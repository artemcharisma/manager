<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NUTRITION PROTOCOL</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nutrition">
    
    <link rel="apple-touch-icon" href="icon.pngF">
    <link rel="stylesheet" href="assets/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. CORE VISUALS --- */
        :root {
            --bg-app: #000000;
            --bg-panel: #121212;
            --border: #2a2a2a;
            --theme: #d4af37; /* GOLD */
            
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            
            --danger: #ef4444;
            --success: #10b981;
            
            /* Macros Colors */
            --p-color: #3b82f6; 
            --f-color: #eab308; 
            --c-color: #10b981; 
            
            --font-ui: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

       /* --- 1. GLOBAL SETTINGS (FIXED CURSORS) --- */
        *, *::before, *::after {
            -webkit-tap-highlight-color: transparent !important;
            box-sizing: border-box; outline: none;
        }

        /* 1. ТЕКСТОВИЙ КУРСОР (Тільки там, де пишемо) */
        input, textarea, [contenteditable] { 
            cursor: text !important;
        }

        /* 2. ПАЛЕЦЬ (Тільки на тому, що реально клікається) */
        button, 
        select, 
        label,
        .icon-btn,       /* Кнопки в шапці */
        .day-tab,        /* Вкладки днів */
        .day-add-btn,    /* Плюс день */
        .btn-del-day,    /* Видалити день */
        .target-badge,   /* Кнопка цілі */
        .mh-del,         /* Хрестик видалення прийому */
        .btn-add-food,   /* + ПРОДУКТ */
        .btn-new-meal,   /* + НОВИЙ ПРИЙОМ */
        .food-row,       /* Рядок продукту (для редагування) */
        .bank-row,       /* Рядок у базі */
        .sugg-item,      /* Елемент пошуку */
        .btn-primary,    /* Головні кнопки модалок */
        .btn-danger,     /* Червоні кнопки */
        .btn-mini,       /* Маленькі кнопки */
        .btn-action,     /* Дії */
        .scroll-top,     /* Кнопка вгору */
        .sys-card,       /* Меню */
        .sys-close,      /* Закриття меню */
        .mc-header span, /* Хрестик закриття модалки */
        .chk-wrap input  /* Чекбокс */
        {
            cursor: pointer !important;
        }

        /* 3. СТРІЛКА (На всьому іншому: панелі, фони, заголовки) */
        body, html, .app-container, .meal-block, .modal-card, .hud {
            cursor: default;
        }

        .app-container { width: 100%; max-width: 800px; margin: 0 auto; }

        /* --- 2. HEADER --- */
        header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding-bottom: 20px; 
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        
        .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .brand-icon {
            width: 44px; height: 44px; 
            background: linear-gradient(135deg, var(--theme), #fcd34d);
            border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2); color: #000;
            transition: 0.3s;
        }
        .brand-text h1 { margin: 0; font-size: 1.2rem; font-weight: 800; color: var(--theme); letter-spacing: -0.5px; }
        .brand-text span { font-size: 0.65rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; display: block; }

        .controls { display: flex; gap: 10px; align-items: center; }
        .icon-btn {
            width: 42px; height: 42px; border-radius: 12px; 
            border: 1px solid #333; background: #121212; color: #888;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; transition: 0.2s;
            -webkit-appearance: none; appearance: none; padding: 0; margin: 0;
        }
        .icon-btn:active { transform: scale(0.95); background: #000; border-color: var(--theme); color: var(--theme); }

        /* --- 3. DAY NAVIGATION (FIXED CLIPPING) --- */
        .day-bar {
            display: flex; overflow-x: auto; gap: 10px; 
            /* Важливо: додаємо відступи всередині скролу, щоб тіні не обрізались */
            padding: 5px 5px 15px 5px; 
            margin-bottom: 5px; 
            scrollbar-width: none;
        }
        .day-tab {
            min-width: 80px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center;
            border-radius: 12px; background: var(--bg-panel); border: 1px solid var(--border);
            color: #555; transition: all 0.2s ease; position: relative;
        }
        .day-tab span { font-weight: 800; font-size: 0.95rem; font-family: var(--font-ui); white-space: nowrap; }
        .day-tab small { font-size: 0.6rem; text-transform: uppercase; font-weight: 700; margin-top: 2px; }
        
        .day-tab.active {
            border-color: var(--theme); color: #fff; background: #1a1a1a;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6); /* Тінь тепер не обрізається */
            transform: translateY(-3px);
            z-index: 2;
        }
        .day-tab.active small { color: var(--theme); }

        .day-add-btn {
            min-width: 45px; border-radius: 12px; border: 1px dashed #444; background: transparent;
            color: #666; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .day-add-btn:active { background: #111; color: var(--theme); border-color: var(--theme); }

        /* --- 4. HUD (DASHBOARD) --- */
        .hud {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px;
            padding: 20px; margin-bottom: 25px; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .hud-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        
        .k-group { display: flex; flex-direction: column; }
        .k-val { font-family: var(--font-mono); font-size: 3rem; font-weight: 700; line-height: 0.9; color: #fff; letter-spacing: -2px; }
        .k-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 8px; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;}

        .target-badge {
            background: #000; border: 1px solid #333; padding: 6px 12px; border-radius: 8px;
            font-family: var(--font-mono); font-size: 0.75rem; color: #666; transition: 0.2s;
        }
        .target-badge span { color: var(--theme); font-weight: 700; }
        .target-badge:active { transform: scale(0.95); border-color: var(--theme); }

        .hud-macros { display: flex; flex-direction: column; gap: 10px; }
        .macro-row { display: grid; grid-template-columns: 35px 1fr 60px; align-items: center; gap: 10px; }
        .mr-label { font-family: var(--font-mono); font-weight: 700; font-size: 0.75rem; color: #555; }
        .mr-track { height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
        .mr-fill { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
        .mr-val { font-family: var(--font-mono); font-size: 0.75rem; text-align: right; color: #fff; }

        /* --- 5. MEALS LIST --- */
        .meal-block { 
            background: var(--bg-panel); border: 1px solid var(--border); 
            border-radius: 16px; margin-bottom: 20px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .meal-header {
            padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
            background: linear-gradient(90deg, rgba(255,255,255,0.02), transparent);
            display: flex; justify-content: space-between; align-items: center;
        }
        .mh-title { 
            font-weight: 800; font-size: 0.95rem; color: #fff; text-transform: uppercase;
            border-bottom: 1px dashed transparent; 
        }
        .mh-title:focus { border-bottom-color: var(--theme); outline: none; }
        
        .mh-meta { display: flex; align-items: center; gap: 12px; }
        .mh-kcal { font-family: var(--font-mono); font-weight: 700; font-size: 0.9rem; color: var(--theme); }
        .mh-del { color: var(--danger); opacity: 0.3; font-size: 16px; padding: 5px; transition: 0.2s; }
        .mh-del:active { opacity: 1; transform: scale(1.2); }

        .food-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 15px; border-bottom: 1px solid rgba(255,255,255,0.03); transition: 0.1s;
        }
        .food-row:last-of-type { border-bottom: none; }
        .food-row:active { background: rgba(212, 175, 55, 0.05); }
        
        .fr-info h4 { margin: 0; font-size: 0.9rem; font-weight: 600; color: #e4e4e7; margin-bottom: 4px; }
        .fr-info p { margin: 0; font-family: var(--font-mono); font-size: 0.65rem; color: #666; }
        .fr-vals { text-align: right; }
        .fr-w { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 700; color: #fff; }
        .fr-k { font-family: var(--font-mono); font-size: 0.7rem; color: #666; margin-top: 2px; }

        /* Buttons */
        .btn-action {
            width: 100%; padding: 14px; background: #0a0a0a; border: none; border-top: 1px solid var(--border);
            color: #666; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.2s;
        }
        .btn-action:active { background: #151515; color: var(--theme); }

        .btn-main-add {
            width: 100%; padding: 16px; border: 1px dashed #333; border-radius: 14px; 
            background: transparent; color: #666; font-weight: 700; font-size: 0.9rem;
            margin-top: 20px; transition: 0.2s;
        }
        .btn-main-add:active { border-color: var(--theme); color: var(--theme); background: rgba(212, 175, 55, 0.05); }

        /* --- 6. MODALS & FORMS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 100; display: none; align-items: flex-end; justify-content: center;
        }
        .modal-card {
            background: #121212; width: 100%; max-width: 600px;
            border-top: 1px solid var(--border); border-radius: 24px 24px 0 0; 
            padding: 25px; padding-bottom: 50px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
            animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .mc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .mc-title { font-weight: 800; font-size: 1.1rem; color: #fff; margin: 0; text-transform: uppercase; letter-spacing: 1px; }

        .inp-main {
            width: 100%; background: #000; border: 1px solid #333;
            padding: 16px; border-radius: 12px; color: #fff; font-size: 1.1rem;
            font-family: var(--font-mono); outline: none; transition: 0.2s;
        }
        .inp-main:focus { border-color: var(--theme); }
        .inp-main::placeholder { color: #444; font-family: var(--font-ui); }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .stat-box { background: #050505; padding: 10px 5px; border-radius: 10px; text-align: center; border: 1px solid #222; }
        .stat-box label { display: block; font-size: 0.6rem; color: #666; font-weight: 700; margin-bottom: 4px; }
        .stat-box input { width: 100%; background: transparent; border: none; color: #fff; text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 1rem; padding: 0; }

        .btn-primary {
            width: 100%; background: var(--theme); color: #000; padding: 16px;
            border-radius: 12px; font-weight: 800; border: none; text-transform: uppercase;
            margin-top: 10px; font-size: 1rem; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-danger {
            width: 100%; background: transparent; color: var(--danger); padding: 14px;
            border-radius: 12px; font-weight: 700; border: 1px solid #333; margin-top: 5px;
            font-size: 0.8rem;
        }

        /* AUTOCOMPLETE */
        #sugg-list {
            background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
            margin-top: 5px; max-height: 200px; overflow-y: auto; display: none;
            position: absolute; width: 100%; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .sugg-item { padding: 14px 15px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; color: #ddd; font-size: 0.9rem; cursor: pointer; }
        .sugg-item:active { background: #333; }
        .sugg-item span { font-family: var(--font-mono); color: #666; font-size: 0.75rem; font-weight: 700; }

        /* COLORS */
        .color-p { color: var(--p-color) !important; }
        .color-f { color: var(--f-color) !important; }
        .color-c { color: var(--c-color) !important; }
        
        #fileInput { display: none; }
        .chk-wrap { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
        .chk-wrap input { accent-color: var(--theme); width: 20px; height: 20px; }
        .chk-wrap label { font-size: 0.9rem; color: #aaa; }

        /* BANK LIST */
        .bank-list-container { max-height: 60vh; overflow-y: auto; margin-top: 15px; }
        .bank-row {
            padding: 14px 0; border-bottom: 1px solid #222; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .bank-row b { display: block; font-size: 1rem; color: #fff; margin-bottom: 4px; }
        .bank-row span { font-family: var(--font-mono); font-size: 0.75rem; color: #666; }
        
        .day-control-panel { display: flex; justify-content: space-between; padding: 0 5px 15px 5px; align-items: center; }
        .day-name-edit { font-size: 1.2rem; font-weight: 800; color: #fff; border-bottom: 1px dashed #333; padding-bottom: 2px; }
        .day-name-edit:focus { border-color: var(--theme); }
        
        .btn-mini { 
            background: #111; border: 1px solid #333; color: #888; 
            font-size: 0.7rem; padding: 8px 12px; border-radius: 8px; font-weight: 700;
            text-transform: uppercase; transition: 0.2s;
        }
        .btn-mini:active { background: #333; color: #fff; }

        /* ANIMATION: SECRET HINT (RED ALERT) */
        @keyframes secret-hint {
            0% { transform: scale(1); filter: none; }
            50% { 
                transform: scale(1.15) rotate(5deg); 
                background: linear-gradient(135deg, #ef4444, #991b1b); /* RED GRADIENT */
                box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
                color: #fff;
                border-color: #ef4444;
            }
            100% { transform: scale(1); filter: none; }
        }
        .brand-icon.hint-active {
            animation: secret-hint 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

    </style>
</head>
<body>

<div class="app-container">
    
    <header>
        <div class="brand" id="brandBlock">
            <div class="brand-icon">🥑</div>
            <div class="brand-text">
                <h1>NUTRITION</h1>
                <span>PROTOCOL</span>
            </div>
        </div>
        <div class="controls">
            <button class="icon-btn" onclick="App.undo()" id="undoBtn" style="display:none; color:var(--theme)">↩</button>
            <button class="icon-btn" onclick="App.exportData()">💾</button>
            <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📂</button>
            <input type="file" id="fileInput" accept=".json" onchange="App.importData(this)">
            <button class="icon-btn" onclick="App.openBank()" style="color:var(--theme)">📚</button>
        </div>
    </header>

    <div class="day-bar" id="dayBar"></div>
    
    <div class="day-control-panel">
        <span class="day-name-edit" contenteditable="true" onblur="App.renameDay(this.innerText)" id="currentDayTitle">День</span>
        <div style="display:flex; gap:8px">
             <button class="btn-mini" onclick="App.duplicateDay()">❐ Копія</button>
             <button class="btn-mini" onclick="App.deleteDay()" style="border-color:rgba(239, 68, 68, 0.4); color:var(--danger)">🗑</button>
        </div>
    </div>

    <div class="hud">
        <div class="hud-header">
            <div class="k-group">
                <span class="k-val" id="disp-k">0</span>
                <span class="k-label">ККАЛ СЬОГОДНІ</span>
            </div>
            <div class="target-badge" onclick="App.openTargets()">
                ЦІЛЬ: <span id="disp-target">2700</span>
            </div>
        </div>
        
        <div class="hud-macros">
            <div class="macro-row">
                <span class="mr-label color-p">PRO</span>
                <div class="mr-track"><div class="mr-fill" id="bar-p" style="width:0%; background:var(--p-color)"></div></div>
                <span class="mr-val" id="disp-p">0g</span>
            </div>
            <div class="macro-row">
                <span class="mr-label color-f">FAT</span>
                <div class="mr-track"><div class="mr-fill" id="bar-f" style="width:0%; background:var(--f-color)"></div></div>
                <span class="mr-val" id="disp-f">0g</span>
            </div>
            <div class="macro-row">
                <span class="mr-label color-c">CARB</span>
                <div class="mr-track"><div class="mr-fill" id="bar-c" style="width:0%; background:var(--c-color)"></div></div>
                <span class="mr-val" id="disp-c">0g</span>
            </div>
        </div>
    </div>

    <div id="mealList"></div>
    <button class="btn-main-add" onclick="App.addMealBlock()">+ ДОДАТИ ПРИЙОМ ЇЖІ</button>

</div>

<div id="foodModal" class="modal-overlay">
    <div class="modal-card">
        <div class="mc-header">
            <h3 class="mc-title" id="modalTitle">ДОДАТИ</h3>
            <span onclick="App.closeModal()" style="font-size:1.5rem;cursor:pointer;color:#666">✕</span>
        </div>

        <div style="position:relative">
            <input id="inpName" class="inp-main" placeholder="Пошук продукту..." autocomplete="off" oninput="App.searchFood(this.value)">
            <div id="sugg-list"></div>
        </div>

        <input type="number" id="inpWeight" class="inp-main" placeholder="Вага (г) або шт" inputmode="decimal">

        <div class="stats-grid">
            <div class="stat-box"><label class="color-p">БІЛ</label><input id="inpP"></div>
            <div class="stat-box"><label class="color-f">ЖИР</label><input id="inpF"></div>
            <div class="stat-box"><label class="color-c">ВУГ</label><input id="inpC"></div>
            <div class="stat-box"><label>ККАЛ</label><input id="inpK"></div>
        </div>
        
        <button class="btn-primary" onclick="App.saveFood()">ЗБЕРЕГТИ</button>
        <button class="btn-danger" id="btnDeleteFood" style="display:none" onclick="App.deleteFood()">ВИДАЛИТИ</button>
    </div>
</div>

<div id="bankModal" class="modal-overlay">
    <div class="modal-card" style="height:85vh; max-height:85vh">
        <div class="mc-header">
            <h3 class="mc-title">БАЗА ПРОДУКТІВ</h3>
            <span onclick="document.getElementById('bankModal').style.display='none'" style="font-size:1.5rem;cursor:pointer;color:#666">✕</span>
        </div>
        <button class="btn-primary" onclick="App.openBankEdit(null)">+ СТВОРИТИ НОВИЙ</button>
        <input class="inp-main" style="margin-top:10px; padding:12px; font-size:0.9rem" placeholder="🔍 Фільтр..." oninput="App.renderBank(this.value)">
        <div class="bank-list-container" id="bankList"></div>
    </div>
</div>

<div id="bankEditModal" class="modal-overlay" style="z-index:110">
    <div class="modal-card">
        <div class="mc-header">
            <h3 class="mc-title">РЕДАКТОР</h3>
            <span onclick="document.getElementById('bankEditModal').style.display='none'" style="font-size:1.5rem;cursor:pointer;color:#666">✕</span>
        </div>
        
        <input id="bankInpName" class="inp-main" placeholder="Назва продукту">
        
        <div class="stats-grid">
            <div class="stat-box"><label class="color-p">Б</label><input id="bankInpP" placeholder="0" inputmode="decimal"></div>
            <div class="stat-box"><label class="color-f">Ж</label><input id="bankInpF" placeholder="0" inputmode="decimal"></div>
            <div class="stat-box"><label class="color-c">В</label><input id="bankInpC" placeholder="0" inputmode="decimal"></div>
            <div class="stat-box"><label>К</label><input id="bankInpK" placeholder="Auto" inputmode="decimal"></div>
        </div>

        <div class="chk-wrap">
            <input type="checkbox" id="bankInpUnit">
            <label for="bankInpUnit">Це одна порція/шт (не 100г)</label>
        </div>

        <button class="btn-primary" onclick="App.saveBankItem()">ЗБЕРЕГТИ В БАЗУ</button>
        <button class="btn-danger" id="btnDelBank" onclick="App.delFromBank()">ВИДАЛИТИ З БАЗИ</button>
    </div>
</div>

<div id="targetsModal" class="modal-overlay">
    <div class="modal-card">
        <div class="mc-header">
            <h3 class="mc-title">МОЇ ЦІЛІ</h3>
            <span onclick="document.getElementById('targetsModal').style.display='none'" style="font-size:1.5rem;cursor:pointer;color:#666">✕</span>
        </div>
        <div class="stats-grid">
            <div class="stat-box"><label class="color-p">БІЛ</label><input id="tgP" inputmode="numeric" oninput="App.calcTargetKcal()"></div>
            <div class="stat-box"><label class="color-f">ЖИР</label><input id="tgF" inputmode="numeric" oninput="App.calcTargetKcal()"></div>
            <div class="stat-box"><label class="color-c">ВУГ</label><input id="tgC" inputmode="numeric" oninput="App.calcTargetKcal()"></div>
            <div class="stat-box"><label>ККАЛ</label><input id="tgK" inputmode="numeric"></div>
        </div>
        <button class="btn-primary" onclick="App.saveTargets()">ОНОВИТИ</button>
    </div>
</div>

<script>
    const DB_KEY = 'protocol_sys_plus_days';

    const DefaultBank = {
        "Вівсянка": {p:13, f:6, c:68, k:380},
        "Рис": {p:2.7, f:0.3, c:28, k:130},
        "Гречка": {p:4, f:1, c:21, k:110},
        "Макарони": {p:5, f:1, c:30, k:150},
        "Картопля": {p:2, f:0, c:17, k:77},
        "Куряче філе": {p:23, f:1, c:0, k:110},
        "Яловичина": {p:20, f:10, c:0, k:180},
        "Яйце (1шт)": {p:6, f:5, c:0.5, k:70, unit:true},
        "Білок яєчний": {p:3, f:0, c:0, k:15, unit:true},
        "Сир кисломолочний": {p:18, f:5, c:2, k:120},
        "Олія оливкова": {p:0, f:100, c:0, k:884},
        "Горіхи": {p:15, f:60, c:10, k:650},
        "Авокадо": {p:2, f:15, c:9, k:160},
        "Банан": {p:1, f:0, c:21, k:90},
        "Протеїн (1 порція)": {p:24, f:1, c:2, k:110, unit:true}
    };

    const App = {
        data: { 
            bank: DefaultBank, 
            targets: {p:200, f:80, c:300, k:2700}, 
            days: [] 
        },
        state: { mid: null, fidx: null, editName: null, currentDayId: null },
        history: [],

        init() {
            const s = localStorage.getItem(DB_KEY);
            if(s) {
                const parsed = JSON.parse(s);
                if(!parsed.days) {
                    this.data.bank = parsed.bank || DefaultBank;
                    this.data.targets = parsed.targets;
                    this.data.days = [{id: Date.now(), name: "Мій день", meals: parsed.meals || []}];
                } else {
                    this.data = parsed;
                }
                this.data.bank = {...DefaultBank, ...this.data.bank};
            } else {
                this.addDay("Мій день", true);
            }
            
            if(!this.state.currentDayId && this.data.days.length > 0) {
                this.state.currentDayId = this.data.days[0].id;
            }
            
            // Hard Reset Logic
            const brandBlock = document.getElementById('brandBlock');
            const brandIcon = brandBlock.querySelector('.brand-icon');
            brandBlock.onclick = () => {
                brandIcon.classList.remove('hint-active');
                void brandIcon.offsetWidth;
                brandIcon.classList.add('hint-active');
            };
            brandBlock.ondblclick = () => {
                if(confirm("⚠ HARD RESET?")) {
                    localStorage.removeItem(DB_KEY);
                    location.reload();
                }
            };

            this.render();
        },

        save() {
            localStorage.setItem(DB_KEY, JSON.stringify(this.data));
            this.updateStats();
        },
        
        pushHistory() {
            if(this.history.length > 10) this.history.shift();
            this.history.push(JSON.stringify(this.data));
            document.getElementById('undoBtn').style.display='flex';
        },
        
        undo() {
            if(!this.history.length) return;
            this.data = JSON.parse(this.history.pop());
            if(!this.history.length) document.getElementById('undoBtn').style.display='none';
            if(!this.data.days.find(d => d.id === this.state.currentDayId)) {
                this.state.currentDayId = this.data.days[0].id;
            }
            this.save(); this.render();
        },

        getCurrentDay() {
            return this.data.days.find(d => d.id === this.state.currentDayId);
        },

        addDay(name = null, silent=false) {
           if(!silent) this.pushHistory();
            if(!name) {
                const now = new Date();
                name = now.toLocaleDateString('uk-UA', {day:'numeric', month:'numeric'});
            }
            const id = Date.now();
            const newDay = {
                id: id, name: name, 
                meals: [
                    {id: id+1, name:"Сніданок", foods:[]},
                    {id: id+2, name:"Обід", foods:[]},
                    {id: id+3, name:"Вечеря", foods:[]}
                ]
            };
            this.data.days.push(newDay);
            this.state.currentDayId = id;
            if(!silent) { this.save(); this.render(); }
        },

        duplicateDay() {
            const day = this.getCurrentDay();
            if(!day) return;
            this.pushHistory();
            const id = Date.now();
            // Deep copy logic
            const newDay = JSON.parse(JSON.stringify(day));
            newDay.id = id;
            newDay.name = day.name + " (Копія)";
            // Regenerate IDs for meals to avoid conflict
            newDay.meals.forEach(m => m.id = Math.random());
            
            this.data.days.push(newDay);
            this.state.currentDayId = id;
            this.save(); this.render();
        },

        switchDay(id) {
            this.state.currentDayId = id;
            this.render();
        },

        renameDay(newName) {
            const d = this.getCurrentDay();
            if(d) {
                d.name = newName;
                this.save();
                this.renderDaysBar();
            }
        },

        deleteDay() {
            if(this.data.days.length <= 1) return;
            if(!confirm("Видалити цей день?")) return;
            this.pushHistory();
            this.data.days = this.data.days.filter(d => d.id !== this.state.currentDayId);
            this.state.currentDayId = this.data.days[0].id;
            this.save(); this.render();
        },

        render() {
            this.renderDaysBar();
            const day = this.getCurrentDay();
            if(!day) return;

            document.getElementById('currentDayTitle').innerText = day.name;
            const list = document.getElementById('mealList');
            list.innerHTML = '';
            
            day.meals.forEach(m => {
                let mCal = 0, mP = 0, mF = 0, mC = 0;

                const foodsHtml = m.foods.map((f, i) => {
                    const ref = this.data.bank[f.n] || {p:f.p, f:f.f, c:f.c, k:f.k, unit:f.unit}; 
                    let k, p, fat, c;
                    
                    if(this.data.bank[f.n]) {
                        const r = ref.unit ? f.w : f.w/100;
                        k = Math.round((ref.k || 0) * r);
                        p = Math.round((ref.p || 0) * r);
                        fat = Math.round((ref.f || 0) * r);
                        c = Math.round((ref.c || 0) * r);
                    } else {
                         k = f.k; p = f.p; fat = f.f; c = f.c;
                    }
                    
                    mCal += k; mP += p; mF += fat; mC += c;

                    return `
                    <div class="food-row" onclick="App.editFood(${m.id}, ${i})">
                        <div class="fr-info">
                            <h4>${f.n}</h4>
                            <p>Б${p} Ж${fat} В${c}</p>
                        </div>
                        <div class="fr-vals">
                            <div class="fr-w">${f.w}${ref.unit?'':'г'}</div>
                            <div class="fr-k">${k}</div>
                        </div>
                    </div>`;
                }).join('');

                list.innerHTML += `
                <div class="meal-block">
                    <div class="meal-header">
                        <div>
                            <div class="mh-title" contenteditable="true" onblur="App.renameMeal(${m.id}, this.innerText)">${m.name}</div>
                            <div class="mh-meta">
                                <div class="mh-kcal">${mCal} ккал</div>
                                <span style="font-size:0.65rem; color:#666">Б${mP} Ж${mF} В${mC}</span>
                            </div>
                        </div>
                        <div class="mh-del" onclick="App.deleteMealBlock(${m.id})">✕</div>
                    </div>
                    <div>${foodsHtml}</div>
                    <button class="btn-action" onclick="App.addFood(${m.id})">+ ПРОДУКТ</button>
                </div>`;
            });
            this.updateStats();
        },

        renderDaysBar() {
            const bar = document.getElementById('dayBar');
            bar.innerHTML = '';
            this.data.days.forEach(d => {
                const el = document.createElement('div');
                el.className = `day-tab ${d.id === this.state.currentDayId ? 'active' : ''}`;
                el.innerHTML = `<span>${d.name.split(' ')[0]}</span><small>${d.name.split(' ').slice(1).join(' ') || '•'}</small>`;
                el.onclick = () => App.switchDay(d.id);
                bar.appendChild(el);
            });
            
            const addBtn = document.createElement('div');
            addBtn.className = 'day-add-btn';
            addBtn.innerText = '+';
            addBtn.onclick = () => App.addDay();
            bar.appendChild(addBtn);
        },

        updateStats() {
            const day = this.getCurrentDay();
            if(!day) return;

            let t = {p:0, f:0, c:0, k:0};
            day.meals.forEach(m => m.foods.forEach(f => {
                const ref = this.data.bank[f.n];
                if(ref) {
                    const r = ref.unit ? f.w : f.w/100;
                    t.p += (ref.p||0)*r; t.f += (ref.f||0)*r; t.c += (ref.c||0)*r; t.k += (ref.k||0)*r;
                } else {
                    t.p += f.p||0; t.f += f.f||0; t.c += f.c||0; t.k += f.k||0;
                }
            }));
            
            const tg = this.data.targets;
            const dispK = document.getElementById('disp-k');
            dispK.innerText = Math.round(t.k);
            document.getElementById('disp-target').innerText = tg.k;
            
            if(t.k > tg.k) dispK.style.color = 'var(--danger)';
            else dispK.style.color = '#fff';

            const updateBar = (id, val, max) => {
                const el = document.getElementById('bar-'+id);
                const txt = document.getElementById('disp-'+id);
                const pct = Math.min(100, (val/max)*100);
                el.style.width = pct + '%';
                txt.innerText = Math.round(val) + 'г (' + Math.round(pct) + '%)';
            };
            
            updateBar('p', t.p, tg.p);
            updateBar('f', t.f, tg.f);
            updateBar('c', t.c, tg.c);
        },

        searchFood(q) {
            const list = document.getElementById('sugg-list');
            list.innerHTML = '';
            if(q.length < 1) { list.style.display='none'; return; }
            
            const matches = Object.keys(this.data.bank).filter(k => k.toLowerCase().includes(q.toLowerCase()));
            if(matches.length) {
                list.style.display = 'block';
                matches.slice(0, 5).forEach(n => {
                    const b = this.data.bank[n];
                    const el = document.createElement('div');
                    el.className = 'sugg-item';
                    el.innerHTML = `${n} <span>${b.k} ккал</span>`;
                    el.onclick = () => App.selectSuggestion(n);
                    list.appendChild(el);
                });
            } else { list.style.display='none'; }
        },

        selectSuggestion(name) {
            const f = this.data.bank[name];
            document.getElementById('inpName').value = name;
            document.getElementById('inpP').value = f.p;
            document.getElementById('inpF').value = f.f;
            document.getElementById('inpC').value = f.c;
            document.getElementById('inpK').value = f.k;
            document.getElementById('sugg-list').style.display='none';
            document.getElementById('inpWeight').placeholder = f.unit ? "Кількість (шт)" : "Вага (г)";
            document.getElementById('inpWeight').focus();
        },

        addFood(mid) {
            this.state.mid = mid; this.state.fidx = -1;
            this.openModal('ДОДАТИ', {}, false);
            setTimeout(() => document.getElementById('inpName').focus(), 100);
        },
        
        editFood(mid, idx) {
            this.state.mid = mid; this.state.fidx = idx;
            const f = this.getCurrentDay().meals.find(m=>m.id===mid).foods[idx];
            let base = this.data.bank[f.n] ? this.data.bank[f.n] : f;
            this.openModal('РЕДАГУВАТИ', {...base, w: f.w, n: f.n}, true);
        },

        openModal(title, f, del) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('inpName').value = f.n||'';
            document.getElementById('inpWeight').value = f.w||'';
            
            document.getElementById('inpP').value = f.p||0;
            document.getElementById('inpF').value = f.f||0;
            document.getElementById('inpC').value = f.c||0;
            document.getElementById('inpK').value = f.k||0;
            
            // Allow manual entry (Quick Add)
            const isBank = !!this.data.bank[f.n];
            // We allow editing even for bank items locally if needed, but standard logic is to lock
            // Let's keep them editable for maximum flexibility
            // const inputs = ['inpP','inpF','inpC','inpK'];
            // inputs.forEach(id => document.getElementById(id).disabled = isBank);
            
            document.getElementById('btnDeleteFood').style.display = del ? 'block':'none';
            document.getElementById('foodModal').style.display = 'flex';
            document.getElementById('sugg-list').style.display = 'none';
        },
        
        closeModal() { document.querySelectorAll('.modal-overlay').forEach(el => el.style.display='none'); },

        saveFood() {
            const n = document.getElementById('inpName').value;
            const w = parseFloat(document.getElementById('inpWeight').value);
            if(!n || isNaN(w)) return;
            
            const meal = this.getCurrentDay().meals.find(m=>m.id===this.state.mid);
            let item;

            if(this.data.bank[n]) {
                item = {n, w};
            } else {
                const p = parseFloat(document.getElementById('inpP').value)||0;
                const f = parseFloat(document.getElementById('inpF').value)||0;
                const c = parseFloat(document.getElementById('inpC').value)||0;
                let k = parseFloat(document.getElementById('inpK').value);
                if(!k && (p||f||c)) k = Math.round(p*4 + f*9 + c*4);
                item = {n, w, p, f, c, k, unit: true}; 
            }

            this.pushHistory();
            if(this.state.fidx === -1) meal.foods.push(item);
            else meal.foods[this.state.fidx] = item;
            
            this.save(); this.render(); this.closeModal();
        },

        deleteFood() {
            this.pushHistory();
            this.getCurrentDay().meals.find(m=>m.id===this.state.mid).foods.splice(this.state.fidx, 1);
            this.save(); this.render(); this.closeModal();
        },

        addMealBlock() {
            this.pushHistory();
            const id = Date.now();
            this.getCurrentDay().meals.push({id, name:"Прийом їжі", foods:[]});
            this.save(); this.render();
        },
        deleteMealBlock(id) {
            if(!confirm("Видалити цей блок?")) return;
            this.pushHistory();
            const day = this.getCurrentDay();
            day.meals = day.meals.filter(m=>m.id!==id);
            this.save(); this.render();
        },
        renameMeal(id, val) {
            this.getCurrentDay().meals.find(m=>m.id===id).name = val;
            this.save();
        },

        renderBank(filter = "") {
            const l = document.getElementById('bankList');
            l.innerHTML = Object.entries(this.data.bank)
                .filter(([n]) => n.toLowerCase().includes(filter.toLowerCase()))
                .sort()
                .map(([n,v]) => `
                <div class="bank-row" onclick="App.openBankEdit('${n}')">
                    <div class="bank-info">
                        <b>${n}</b>
                        <span>${v.unit ? 'ШТ/ПОРЦ' : '100г'} | Б${v.p} Ж${v.f} В${v.c} | ${v.k} ккал</span>
                    </div>
                    <div class="edit-icon">✎</div>
                </div>`).join('');
        },
        openBank() {
            this.renderBank();
            document.getElementById('bankModal').style.display='flex';
        },
        openBankEdit(name) {
            this.state.editName = name;
            if(name) {
                const d = this.data.bank[name];
                document.getElementById('bankInpName').value = name;
                document.getElementById('bankInpP').value = d.p;
                document.getElementById('bankInpF').value = d.f;
                document.getElementById('bankInpC').value = d.c;
                document.getElementById('bankInpK').value = d.k;
                document.getElementById('bankInpUnit').checked = d.unit || false;
                document.getElementById('btnDelBank').style.display = 'block';
            } else {
                document.getElementById('bankInpName').value = '';
                document.getElementById('bankInpP').value = '';
                document.getElementById('bankInpF').value = '';
                document.getElementById('bankInpC').value = '';
                document.getElementById('bankInpK').value = '';
                document.getElementById('bankInpUnit').checked = false;
                document.getElementById('btnDelBank').style.display = 'none';
            }
            document.getElementById('bankEditModal').style.display='flex';
        },
        saveBankItem() {
            const n = document.getElementById('bankInpName').value;
            const p = parseFloat(document.getElementById('bankInpP').value)||0;
            const f = parseFloat(document.getElementById('bankInpF').value)||0;
            const c = parseFloat(document.getElementById('bankInpC').value)||0;
            let k = parseFloat(document.getElementById('bankInpK').value);
            if(!k) k = Math.round(p*4 + f*9 + c*4);
            
            const unit = document.getElementById('bankInpUnit').checked;

            if(this.state.editName && this.state.editName !== n) delete this.data.bank[this.state.editName];
            
            this.data.bank[n] = {p,f,c,k,unit};
            this.save(); this.renderBank();
            document.getElementById('bankEditModal').style.display='none';
            this.render(); 
        },
        delFromBank() {
            if(confirm('Видалити з бази назавжди?')) {
                delete this.data.bank[this.state.editName];
                this.save(); this.renderBank();
                document.getElementById('bankEditModal').style.display='none';
            }
        },

        openTargets() {
            const t = this.data.targets;
            document.getElementById('tgP').value = t.p;
            document.getElementById('tgF').value = t.f;
            document.getElementById('tgC').value = t.c;
            document.getElementById('tgK').value = t.k;
            document.getElementById('targetsModal').style.display='flex';
        },

        calcTargetKcal() {
            const p = parseFloat(document.getElementById('tgP').value)||0;
            const f = parseFloat(document.getElementById('tgF').value)||0;
            const c = parseFloat(document.getElementById('tgC').value)||0;
            document.getElementById('tgK').value = Math.round(p*4 + f*9 + c*4);
        },
        
        saveTargets() {
            this.data.targets = {
                p: parseFloat(document.getElementById('tgP').value)||0,
                f: parseFloat(document.getElementById('tgF').value)||0,
                c: parseFloat(document.getElementById('tgC').value)||0,
                k: parseFloat(document.getElementById('tgK').value)||0
            };
            this.save(); this.updateStats();
            document.getElementById('targetsModal').style.display='none';
        },

        exportData() {
            const a = document.createElement('a');
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.data));
            a.download = "protocol_nutrition.json"; a.click();
        },
        importData(inp) {
            const r = new FileReader();
            r.onload = e => { this.pushHistory(); this.data = JSON.parse(e.target.result); this.save(); location.reload(); };
            r.readAsText(inp.files[0]);
        }
    };

    window.onload = () => App.init();
</script>
<div id="sys-fab" onclick="SysSwitch.toggle()">✦</div>

<div id="sys-overlay" onclick="SysSwitch.close()">
    <div class="sys-panel" onclick="event.stopPropagation()">
        <div class="sys-header">
            <span>MANAGER OS</span>
            <div class="sys-close" onclick="SysSwitch.close()">✕</div>
        </div>
        <div class="sys-grid">
            <a href="index.html" class="sys-card">
                <div class="sys-icon" style="color:#fff">🏠</div>
                <span>HUB</span>
            </a>
            <a href="pharm.html" class="sys-card">
                <div class="sys-icon" style="color:#d4af37">🏆</div>
                <span>PHARM</span>
            </a>
            <a href="training.html" class="sys-card">
                <div class="sys-icon" style="color:#3b82f6">⚖️</div>
                <span>TRAIN</span>
            </a>
            <a href="nutrition.html" class="sys-card">
                <div class="sys-icon" style="color:#10b981">🥑</div>
                <span>FOOD</span>
            </a>
        </div>
    </div>
</div>

<script src="assets/common.js"></script>
    
</body>
