<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRAINING PROTOCOL</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Manager OS">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <style>
        /* --- 1. GLOBAL & NO-SELECT (ЯДЕРНИЙ МЕТОД) --- */
        *, *::before, *::after {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
            box-sizing: border-box;
            outline: none;
        }
        /* Дозволяємо писати */
        input, textarea, [contenteditable="true"] { 
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
            cursor: text;
        }

        /* --- 2. THEME VARIABLES (PHARM STYLE) --- */
        :root {
            /* Scrollbar */
            ::-webkit-scrollbar { width: 6px; height: 6px; }
            ::-webkit-scrollbar-track { background: #000; }
            ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

            --bg-app: #000000;          /* Pure Black як у Pharm */
            --bg-panel: #121212;        /* Dark Panel */
            --bg-card: #1e1e1e;
            --border: #2a2a2a;
            
            --primary: #d4af37;         /* GOLD */
            --danger: #ef4444;    
            --success: #10b981;         /* Emerald Green */
            --cardio: #eab308;
            
            /* Динамічні теми (залишаємо логіку, але підганяємо кольори) */
            --theme: #d4af37;           /* Default Gold */
            
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --radius: 12px;
        }

        body.prog-balanced { --theme: #d4af37; } /* Gold */
        body.prog-arms { --theme: #8b5cf6; }     /* Violet (як у Pharm purple) */

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px 10px; min-height: 100vh;
            display: flex; justify-content: center;
            overflow-x: hidden; padding-bottom: 100px;
        }

        .app-container { width: 100%; max-width: 1400px; }

        /* --- 3. HEADER (PHARM STYLE) --- */
        header {
            display: flex; flex-direction: column; gap: 15px; 
            margin-bottom: 20px; padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; }

        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-icon { 
            width: 40px; height: 40px; 
            background: linear-gradient(135deg, var(--theme), #fcd34d);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 20px; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
            color: #000; border: none;
        }
        .brand h1 { margin: 0; font-size: 1.2rem; font-weight: 800; color: var(--theme); }
        .brand span { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .controls { display: flex; gap: 6px; }
        .btn-icon, .edit-toggle {
            width: 38px; height: 38px;
            border-radius: 10px; border: 1px solid var(--border);
            background: var(--bg-panel); color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; cursor: pointer; transition: 0.2s; padding: 0;
        }
        .btn-icon:hover, .edit-toggle:hover { background: var(--bg-card); color: #fff; }
        .edit-toggle.active { background: var(--theme); color: #000; border-color: var(--theme); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }

        /* --- 4. NAVIGATION & SELECTORS --- */
        .program-selector {
            background: var(--bg-panel); padding: 4px; border-radius: 12px; 
            border: 1px solid var(--border); margin-bottom: 25px; display: flex;
        }
        .prog-opt {
            flex: 1; padding: 10px; text-align: center; font-size: 0.8rem; font-weight: 700; 
            cursor: pointer; color: var(--text-muted); border-radius: 8px; transition: 0.2s;
        }
        .prog-opt.active { color: #000; background: var(--theme); }

        .week-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; align-items: center; }
        .week-btn { 
            background: var(--bg-panel); border: 1px solid var(--border); min-width: 80px; padding: 10px; 
            border-radius: var(--radius); cursor: pointer; display: flex; flex-direction: column; align-items: center;
            color: #666; transition: 0.2s;
        }
        .week-btn span { font-weight: 700; font-size: 1.2rem; }
        .week-btn small { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; margin-top: 4px; }
        
        .week-btn.active { background: rgba(212, 175, 55, 0.1); border-color: var(--theme); color: #fff; }
        .week-btn.active small { color: var(--theme); }

        /* --- 5. CARDS & EXERCISES --- */
        .days-list { display: flex; flex-direction: column; gap: 20px; }
        
        .day-card { 
            background: var(--bg-panel); border: 1px solid var(--border); 
            border-radius: 16px; overflow: hidden; position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .day-card:hover { transform: translateY(-2px); border-color: #444; }

        .day-header { 
            padding: 15px 18px; border-bottom: 1px solid rgba(255,255,255,0.05);
            background: linear-gradient(to bottom, rgba(255,255,255,0.03), transparent);
            display: flex; justify-content: space-between; align-items: center;
        }
        .day-title { font-weight: 800; font-size: 1rem; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
        .day-group { 
            font-size: 0.65rem; font-family: 'JetBrains Mono'; padding: 4px 8px; border-radius: 6px; 
            background: #000; text-transform: uppercase; font-weight: 700; color: var(--theme); border: 1px solid #333;
        }

        .ex-list { padding: 5px 0; }
        .exercise { padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,0.03); position: relative; }
        .exercise:last-child { border-bottom: none; }

        .ex-info { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .ex-name { font-weight: 700; font-size: 0.95rem; color: #fff; }
        
        /* Sets Styling */
        .sets-wrapper { display: flex; flex-wrap: wrap; gap: 6px; }
        .set-row { 
            display: flex; align-items: center; background: #000; 
            border: 1px solid #333; border-radius: 6px; overflow: hidden; height: 30px;
        }
        .set-num { 
            background: #1a1a1a; color: #666; font-size: 0.65rem; font-weight: 700; 
            padding: 0 8px; height: 100%; display: flex; align-items: center; border-right: 1px solid #333;
        }
        .set-input { 
            width: 36px; background: transparent; border: none; text-align: center; 
            font-family: 'JetBrains Mono'; font-weight: 700; font-size: 0.85rem; color: #ccc;
        }
        .set-input.w-val { color: var(--theme); }
        .set-unit { font-size: 0.6rem; color: #444; padding-right: 4px; }
        .set-divider { width: 1px; height: 12px; background: #333; }

        /* --- 6. STATS & EXTRAS --- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 15px; }
        .stat-box { background: var(--bg-panel); border: 1px solid var(--border); padding: 15px; border-radius: 12px; }
        .stat-val { font-family: 'JetBrains Mono'; font-size: 1.4rem; font-weight: 700; color: #fff; }
        .stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .stat-bar-bg { height: 4px; background: #222; border-radius: 2px; margin-top: 10px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--theme); transition: width 0.5s; }

        /* Edit Mode UI */
        .edit-ui { display: none !important; }
        body.editing .edit-ui { display: flex !important; }
        
        /* Bottom Nav */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; 
            background: rgba(0,0,0,0.9); border-top: 1px solid var(--border); 
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 100; backdrop-filter: blur(10px); padding-bottom: 10px;
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #555; transition: 0.2s; cursor: pointer; }
        .nav-item.active { color: var(--theme); }
        .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }
        .nav-item div:last-child { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        /* Інші стилі (Modal, Cardio, etc) залишаються стандартними */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #121212; width: 90%; max-width: 400px; border-radius: 16px; border: 1px solid #333; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .bank-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #222; color: #ccc; }
        
        .scroll-top { position: fixed; bottom: 100px; right: 20px; width: 40px; height: 40px; background: rgba(20,20,20,0.8); border: 1px solid #333; border-radius: 50%; color: var(--theme); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 90; backdrop-filter: blur(5px); }
        #fileInput { display: none; }
    </style>
</head>

        </div>

</div>

</div>

                                : InitialData.guidelines;
                                
            const data = sourceData[m];
            
            // Якщо все одно пусто
            if (!data || data.length === 0) {

            document.getElementById('undoBtn').style.display='flex';
        },

        setProgram(prog) {
            this.data.currentProgram = prog;
            this.setTheme(prog);
            this.save();
            this.render();
        },

        setTheme(prog) {
            document.body.className = `prog-${prog}`;
        },

        // --- BANK LOGIC ---
        updateBank() {
            const allNames = new Set(this.data.exBank);
            this.data.weeks.forEach(w => w.days.forEach(d => d.exercises.forEach(e => {
                if(e.n && e.n.length > 2) allNames.add(e.n);
            })));
            Object.values(this.data.guidelines).forEach(list => list.forEach(r => {
                if(r.n && r.n.length > 2) allNames.add(r.n);
            }));
            
            this.data.exBank = Array.from(allNames).sort();
            document.getElementById('ex-bank').innerHTML = this.data.exBank.map(x=>`<option value="${x}">`).join('');
        },

        openBank() {
            const list = document.getElementById('bankList');
            list.innerHTML = this.data.exBank.map(n => `
                <div class="bank-item">
                    <span>${n}</span>
                    <span class="bank-del" onclick="App.deleteFromBank('${n}')">✕</span>
                </div>
            `).join('');
            document.getElementById('bankModal').style.display = 'flex';
        },

        addToBank() {
            const val = document.getElementById('newBankItem').value.trim();
            if(val && !this.data.exBank.includes(val)) {
                this.pushHistory(); // ADDED: Undo
                this.data.exBank.push(val);
                this.data.exBank.sort();
                this.save();
                this.updateBank(); 
                this.openBank(); 
                document.getElementById('newBankItem').value = '';
            }
        },

        deleteFromBank(name) {
            if(!confirm(`Видалити "${name}" з бази?`)) return;
            this.pushHistory(); // ADDED: Undo
            this.data.exBank = this.data.exBank.filter(x => x !== name);
            this.save();
            this.updateBank();
            this.openBank();
        },

        // --- WEEK OPS ---
        addWeek(type, init=false) {
            if (!init) this.pushHistory(); // ТІЛЬКИ ЯКЩО ЦЕ НЕ АВТОМАТИЧНИЙ СТАРТ
            
            const prog = this.data.currentProgram || 'balanced';
            let newData;
            const lastWeek = [...this.data.weeks].reverse().find(w => w.type === type && w.prog === prog);
            if(lastWeek && !init) {
                newData = JSON.parse(JSON.stringify(lastWeek.days));
                newData.forEach(d => {
                    d.note = "";
                    d.exercises.forEach(ex => { ex.sets.forEach(s => { s.w=""; s.r=""; s.d=""; }); });
                });
            } else {
                newData = JSON.parse(JSON.stringify(Templates[prog][type]));
            }
            const w = { id: Date.now(), type, prog, num: this.data.weeks.length + 1, days: newData };
            this.data.weeks.push(w);
            this.updateBank();
            this.save(); this.render();
            if(!init) setTimeout(()=>document.getElementById(`week-${w.id}`).scrollIntoView({behavior:'smooth'}),100);
        },

        delWeek(idx) {
            if(!confirm("Видалити тиждень?")) return;
            this.pushHistory();
            this.data.weeks.splice(idx, 1);
            this.data.weeks.forEach((w,i) => w.num = i+1);
            this.save(); this.render();
        },

        addEx(w, d, type) {
            this.pushHistory();
            const def = type === 'cardio' ? { n: "Ходьба", g: "Кардіо", m: "cardio", sets: [{}] } : { n: "", g: "Інше", m: "wr", sets: [{},{},{}] };
            this.data.weeks[w].days[d].exercises.push(def);
            this.save(); this.render();
        },
        
        delEx(w, d, e) {
            if(!confirm("Видалити?")) return;
            this.pushHistory();
            this.data.weeks[w].days[d].exercises.splice(e, 1);
            this.save(); this.render();
        },

        updateDay(w, d, f, v) {
            // NEW: Editable day group
            if(this.data.weeks[w].days[d][f] !== v) {
                this.pushHistory();
                this.data.weeks[w].days[d][f] = v;
                this.save();
            }
        },

        updateEx(w, d, e, field, val) {
            // ADDED: Undo check
            if(this.data.weeks[w].days[d].exercises[e][field] !== val) {
                this.pushHistory();
                this.data.weeks[w].days[d].exercises[e][field] = val;
                if(field === 'n') this.updateBank();
                this.save();
            }
        },

        changeSets(w, d, e, delta) {
            this.pushHistory(); // Allows undo
            const ex = this.data.weeks[w].days[d].exercises[e];
            if(delta > 0) ex.sets.push({});
            else if(ex.sets.length > 1) ex.sets.pop();
            this.save(); this.render();
        },

        updateSet(w, d, e, s, f, val) {
            // ADDED: Undo check to prevent spam but allow undo on blur change
            if(this.data.weeks[w].days[d].exercises[e].sets[s][f] !== val) {
                this.pushHistory();
                this.data.weeks[w].days[d].exercises[e].sets[s][f] = val;
                this.save();
            }
        },

        setGuideMode(m) { this.data.guideMode = m; this.save(); this.renderGuide(); },
        
        updateTarget(group, val) { 
            const nVal = parseInt(val)||0;
            if(this.data.targets[group] !== nVal) {
                this.pushHistory(); // ADDED: Undo
                this.data.targets[group] = nVal; 
                this.save(); 
                this.renderStats(); 
            }
        },
        
        filterGuide(q) {
            const rows = document.querySelectorAll('.guide-table tbody tr');
            rows.forEach(r => r.style.display = r.innerText.toLowerCase().includes(q.toLowerCase()) ? '' : 'none');
        },

        updateGuide(m, i, f, v) { 
            if(this.data.guidelines[m][i][f] !== v) {
                this.pushHistory(); // ADDED: Undo
                this.data.guidelines[m][i][f] = v; 
                if(f==='n') this.updateBank();
                this.save(); 
            }
        },
        
        delGuideRow(m, i) {
            if(!confirm("Видалити цю вправу з довідника?")) return;
            this.pushHistory();
            this.data.guidelines[m].splice(i, 1);
            this.save();
            this.renderGuide();
        },

        toggleEdit() {
            document.body.classList.toggle('editing');
            document.getElementById('editBtn').classList.toggle('active');
            this.render(); this.renderGuide();
        },

        setView(v) {
            // 1. Активна кнопка
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(`nav-${v}`).classList.add('active');
            
            // 2. Перемикання екранів
            document.getElementById('viewSchedule').style.display = v==='schedule'?'block':'none';
            document.getElementById('viewStats').style.display = v==='stats'?'block':'none';
            document.getElementById('viewGuide').style.display = v==='guide'?'block':'none';
            
            // 3. ПРИМУСОВЕ ОНОВЛЕННЯ ДАНИХ
            if(v === 'stats') this.renderStats();
            if(v === 'guide') this.renderGuide();
        },

        renderStats() {
            const sel = document.getElementById('statsWeekSelect');
            
            // Заповнюємо селект (якщо він порожній або треба оновити)
            if(sel.innerHTML === "" || this.data.weeks.length !== sel.options.length) {
                 sel.innerHTML = this.data.weeks.map((w, i) => `<option value="${i}">Тиждень ${w.num} (${w.type})</option>`).join('');
                 // Автовибір останнього тижня
                 if (this.data.weeks.length > 0) sel.value = this.data.weeks.length - 1;
            }

            const wIdx = sel.value;
            const currentWeek = this.data.weeks[wIdx];
            
            // Якщо даних немає
            if (!currentWeek) { 
                document.getElementById('statsContent').innerHTML = '<div style="text-align:center;color:#666;padding:20px;grid-column:1/-1">Ще немає даних для аналізу.<br>Додайте тиждень у щоденнику.</div>'; 
                return; 
            }
            
            const stats = {}; 
            Groups.forEach(g => stats[g] = 0);
            
            currentWeek.days.forEach(d => {
                d.exercises.forEach(ex => {
                    const g = ex.g || ResolveGroup(ex.n);
                    if (stats[g] !== undefined) stats[g] += ex.sets.length;
                });
            });

            let html = '';
            for(const [k,v] of Object.entries(stats)) {
                if(k === "Інше") continue;
                const target = this.data.targets[k] || 10; // Беремо ціль або 10 по дефолту
                const pct = Math.min(100, (v / target) * 100);
                
                let color = 'var(--mass)';
                if (v >= target) color = 'var(--success)';
                if (v > target * 1.5) color = 'var(--danger)';

                html += `<div class="stat-box">
                    <div class="stat-header-row">
                        <span class="stat-label">${k}</span>
                        <input class="stat-target-input" value="${target}" onchange="App.updateTarget('${k}', this.value)">
                    </div>
                    <span class="stat-val">${v} <span style="font-size:0.8rem; color:#666">/ ${target}</span></span>
                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%; background:${color}"></div></div>
                </div>`;
            }
            document.getElementById('statsContent').innerHTML = html;
        },
        exportData() {
            const a = document.createElement('a');
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.data));
            a.download = "training_protocol.json"; a.click();
        },
        importData(inp) {
            const r = new FileReader();
            r.onload = e => { 
                this.pushHistory(); this.data = JSON.parse(e.target.result); 
                this.save(); location.reload(); 
            };
            r.readAsText(inp.files[0]);
        },

        render() {
            const c = document.getElementById('scheduleList');
            const nav = document.getElementById('weekNav');
            const isEd = document.body.classList.contains('editing');
            
            document.querySelectorAll('.prog-opt').forEach(el => el.classList.remove('active'));
            document.getElementById(`prog-${this.data.currentProgram}`).classList.add('active');

            // Малюємо кнопки тижнів
            nav.innerHTML = this.data.weeks.map((w,i) => {
                const badge = w.prog === 'arms' ? '<div class="prog-badge arms">A</div>' : '';
                return `<div class="week-btn ${w.type}" onclick="document.getElementById('week-${w.id}').scrollIntoView({behavior:'smooth'})"><span>${w.num}</span><small>${w.type}</small>${badge}</div>`;
            }).join('') + `<div class="week-btn" onclick="App.addWeek('mass')" style="border:1px dashed #444">+ M</div><div class="week-btn" onclick="App.addWeek('cut')" style="border:1px dashed #444">+ C</div>`;

            // Малюємо основний список
            c.innerHTML = this.data.weeks.map((week, wIdx) => {
                const theme = week.type === 'mass' ? 'mass-theme' : 'cut-theme';
                const daysHtml = week.days.map((day, dIdx) => {
                    const exsHtml = day.exercises.map((ex, eIdx) => {
                        const m = ex.m || 'wr';
                        
                        // 1. Якщо це КАРДІО
                        if(m === 'cardio') {
                            const s = ex.sets[0] || {};
                            return `<div class="exercise cardio-block">${isEd ? `<div class="ex-del" onclick="App.delEx(${wIdx},${dIdx},${eIdx})">✕</div>` : ''}<div class="cardio-header">🏃 ${ex.n}</div><div class="cardio-grid"><div class="c-input-box"><span class="c-label">Час</span><input class="c-input" value="${s.r||''}" onblur="App.updateSet(${wIdx},${dIdx},${eIdx},0,'r',this.value)"></div><div class="c-input-box"><span class="c-label">Км</span><input class="c-input" value="${s.w||''}" onblur="App.updateSet(${wIdx},${dIdx},${eIdx},0,'w',this.value)"></div><div class="c-input-box"><span class="c-label">Ккал</span><input class="c-input" value="${s.d||''}" onblur="App.updateSet(${wIdx},${dIdx},${eIdx},0,'d',this.value)"></div></div></div>`;
                        }

                        // 2. Якщо це ВПРАВА (Формуємо кольорові сета)
                        const setsHtml = ex.sets.map((s, sIdx) => {
                            if (m === 't') { // Вправа на час
                                return `
                                <div class="set-row">
                                    <div class="set-num">${sIdx+1}</div>
                                    <div class="set-part">
                                        <input class="set-input" style="width:50px; text-align:center" placeholder="хв" value="${s.r||''}" onblur="App.updateSet(${wIdx},${dIdx},${eIdx},${sIdx},'r',this.value)">
                                        <span class="set-unit">час</span>
                                    </div>
                                </div>`;
                            }
                            // Звичайна вправа (Вага + Повтори)
                            return `
                            <div class="set-row">
                                <div class="set-num">${sIdx+1}</div>
                                <div class="set-part">
                                    <input class="set-input w-val" type="tel" placeholder="0" value="${s.w||''}" onblur="App.updateSet(${wIdx},${dIdx},${eIdx},${sIdx},'w',this.value)">
                                    <span class="set-unit">кг</span>
                                </div>
                                <div class="set-divider"></div>
                                <div class="set-part">
                                    <input class="set-input" type="tel" placeholder="0" value="${s.r||''}" onblur="App.updateSet(${wIdx},${dIdx},${eIdx},${sIdx},'r',this.value)">
                                    <span class="set-unit">x</span>
                                </div>
                            </div>`;
                        }).join('');

                        // 3. Збираємо картку вправи
                        const groupSelect = isEd ? `<select class="group-select" onchange="App.updateEx(${wIdx},${dIdx},${eIdx},'g',this.value)">${Groups.map(g => `<option value="${g}" ${ex.g===g?'selected':''}>${g}</option>`).join('')}</select>` : `<span class="ex-badge group">${ex.g || ResolveGroup(ex.n)}</span>`;
                        
                        return `<div class="exercise">${isEd ? `<div class="ex-del" onclick="App.delEx(${wIdx},${dIdx},${eIdx})">✕</div>` : ''}<div class="ex-info"><div class="ex-name-row">${isEd ? `<input class="ex-name-input" list="ex-bank" value="${ex.n}" placeholder="Введіть назву..." onblur="App.updateEx(${wIdx},${dIdx},${eIdx},'n',this.value)">` : `<span class="ex-name">${ex.n || ''}</span>`}${groupSelect}</div><div class="edit-ui" style="display:flex;gap:5px"><div class="set-btn" onclick="App.changeSets(${wIdx},${dIdx},${eIdx},-1)">-</div><div class="set-btn" onclick="App.changeSets(${wIdx},${dIdx},${eIdx},1)">+</div></div></div><div class="sets-wrapper">${setsHtml}</div></div>`;

                    }).join('');

                    // NEW: Editable Day Group (isEd check inside template)
                    const dayGroup = isEd 
                        ? `<span class="day-group" contenteditable="true" onblur="App.updateDay(${wIdx},${dIdx},'group',this.innerText)">${day.group}</span>` 
                        : `<span class="day-group">${day.group}</span>`;

                    return `<div class="day-card"><div class="day-header"><span class="day-title">${day.day}</span>${dayGroup}</div><div class="ex-list">${exsHtml}<div class="add-controls edit-ui"><div class="btn-add" style="color:var(--success)" onclick="App.addEx(${wIdx},${dIdx},'wr')">+ Вправа</div><div class="btn-add btn-add-cardio" style="color:var(--cardio)" onclick="App.addEx(${wIdx},${dIdx},'cardio')">+ 🏃</div></div><textarea class="notes-area" placeholder="Нотатки..." onblur="App.updateEx(${wIdx},${dIdx},'note',this.value)">${day.note||''}</textarea></div></div>`;
                }).join('');

                return `<div id="week-${week.id}" class="${theme}"><div style="padding:10px 0; display:flex; justify-content:space-between; align-items:center"><div><h3 style="margin:0; color:#fff">ТИЖДЕНЬ ${week.num} <span style="font-size:0.8rem; color:var(--${week.type})">// ${week.type.toUpperCase()}</span></h3><div style="font-size:0.7rem; color:#666">${week.prog==='arms'?'Спеціалізація Руки':'Збалансована'}</div></div><span class="edit-ui" style="color:var(--danger); cursor:pointer" onclick="App.delWeek(${wIdx})">Видалити</span></div><div class="days-list">${daysHtml}</div></div><hr style="border:0; border-top:1px dashed #333; margin:30px 0">`;
            }).join('');
            
            this.renderGuide();
        }
    };
    window.onload = () => App.init();
</script>
<div id="sys-fab" onclick="SysSwitch.toggle()">✦</div>

<div id="sys-overlay" onclick="SysSwitch.close()">
    <div class="sys-panel" onclick="event.stopPropagation()">
        <div class="sys-header">
            <span>MANAGER OS</span>
            <div class="sys-close" onclick="SysSwitch.close()">✕</div>
        </div>
        <div class="sys-grid">
            <a href="index.html" class="sys-card">
                <div class="sys-icon" style="color:#fff">🏠</div>
                <span>HUB</span>
            </a>
            <a href="pharm.html" class="sys-card">
                <div class="sys-icon" style="color:#d4af37">🏆</div>
                <span>PHARM</span>
            </a>
            <a href="training.html" class="sys-card">
                <div class="sys-icon" style="color:#3b82f6">⚖️</div>
                <span>TRAIN</span>
            </a>
            <a href="nutrition.html" class="sys-card">
                <div class="sys-icon" style="color:#10b981">🥑</div>
                <span>FOOD</span>
            </a>
        </div>
    </div>
</div>
