<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRAINING PROTOCOL</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Manager OS">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/training.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* Адаптація локальних модалок (1RM та Банк) під Protocol OS */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: linear-gradient(145deg, #101012 0%, #050505 100%); border: 1px solid var(--border, rgba(255,255,255,0.08)); border-radius: 20px; width: 90%; max-width: 400px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05); }
        .modal-input { width: 100%; background: #000; border: 1px solid #333; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 1rem; padding: 12px; border-radius: 12px; outline: none; transition: 0.2s; }
        .modal-input:focus { border-color: var(--theme); box-shadow: 0 0 15px rgba(212,175,55,0.2); }
        .close-btn { cursor: pointer; font-size: 1.2rem; color: #888; transition: 0.2s; padding: 5px; }
        .close-btn:active { color: #ef4444; transform: scale(0.9); }
    </style>
</head>
<body class="prog-balanced">

<div class="app-container">
    <header>
        <div class="header-top">
            <div class="brand" id="brandBlock">
                <div class="brand-icon">⚖️</div>
                <div>
                    <h1>TRAINING</h1>
                    <span>PROTOCOL</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn-icon" id="undoBtn" onclick="App.undo()" style="display:none;color:var(--theme)">↩</button>
                <button class="btn-icon" onclick="App.exportData()">💾</button>
                <button class="btn-icon" onclick="document.getElementById('fileInput').click()">📂</button>
                <input type="file" id="fileInput" accept=".json" onchange="App.importData(this)">
                <button class="edit-toggle" id="editBtn" onclick="App.toggleEdit()">✎</button>
            </div>
        </div>
    </header>

    <div id="viewSchedule">
        <div class="program-selector">
            <div class="prog-opt active" id="prog-balanced" onclick="App.setProgram('balanced')">⚖️ ЗБАЛАНСОВАНА</div>
            <div class="prog-opt" id="prog-arms" onclick="App.setProgram('arms')">💪 РУКИ</div>
        </div>
        <div class="week-scroll" id="weekNav"></div>
        <div id="scheduleList" class="days-list"></div>
    </div>

    <div id="viewStats" style="display:none">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; align-items:center">
            <h3 style="color:#fff; margin:0">Об'єм (Сети)</h3>
            <select id="statsWeekSelect" class="group-select" style="font-size:0.9rem; padding:8px" onchange="App.renderStats()"></select>
        </div>
        <div id="statsContent" class="stats-grid"></div>
    </div>

    <div id="viewGuide" style="display:none">
        <div style="display:flex; gap:10px; margin-bottom:15px">
            <input type="text" class="guide-search" placeholder="🔍 Пошук..." onkeyup="App.filterGuide(this.value)">
            <button class="btn-icon" title="Керування Базою Вправ" onclick="App.openBank()" style="min-width:40px">📚</button>
            <button class="btn-icon" title="1RM Калькулятор" onclick="App.toggleFab(false); document.getElementById('rmModal').style.display='flex'" style="min-width:45px; font-weight:800; font-size:0.8rem">1RM</button>
        </div>
        <div class="guide-switcher">
            <div class="mode-btn mass active" id="btnG-mass" onclick="App.setGuideMode('mass')">MASS (МАСА)</div>
            <div class="mode-btn cut" id="btnG-cut" onclick="App.setGuideMode('cut')">CUT (СУШКА)</div>
        </div>
        <div id="guideContent"></div>
    </div>

    <div id="scrollTopBtn" class="scroll-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</div>

    <div class="bottom-nav">
        <div class="nav-item active" id="nav-schedule" onclick="App.setView('schedule')">
            <div class="nav-icon">📅</div><div>Щоденник</div>
        </div>
        <div class="nav-item" id="nav-stats" onclick="App.setView('stats')">
            <div class="nav-icon">📊</div><div>Статистика</div>
        </div>
        <div class="nav-item" id="nav-guide" onclick="App.setView('guide')">
            <div class="nav-icon">📖</div><div>Довідник</div>
        </div>
    </div>
</div>

<div id="bankModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px">
            <h3 style="margin:0; color:#fff; font-family:'JetBrains Mono'; font-size:0.9rem; letter-spacing:1px;">📚 БАЗА ВПРАВ</h3>
            <span class="close-btn" onclick="App.closeModal()">✕</span>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:10px">
            <input id="newBankItem" class="modal-input" placeholder="Нова вправа..." style="margin:0">
            <button class="btn-add" style="flex:0 0 60px; border-color:var(--theme); color:var(--theme);" onclick="App.addToBank()">OK</button>
        </div>
        <div id="bankList" style="overflow-y:auto; flex:1; max-height:300px;"></div>
    </div>
</div>
    
<div id="rmModal" class="modal">
    <div class="modal-content" style="text-align:center">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:10px">
            <h3 style="margin:0; color:#fff; font-family:'JetBrains Mono'; font-size:0.9rem; letter-spacing:1px;">🔥 1RM CALCULATOR</h3>
            <span class="close-btn" onclick="App.closeModal()">✕</span>
        </div>
        
        <div style="display:flex; gap:10px; margin-bottom:15px">
            <div style="flex:1">
                <label style="font-size:0.7rem; color:#888; font-family:'JetBrains Mono';">ВАГА (КГ)</label>
                <input id="rm-w" type="number" inputmode="decimal" class="modal-input" style="text-align:center; font-size:1.2rem; font-weight:bold; margin-top:5px;" oninput="App.calc1RM()">
            </div>
            <div style="flex:1">
                <label style="font-size:0.7rem; color:#888; font-family:'JetBrains Mono';">ПОВТОРИ</label>
                <input id="rm-r" type="number" inputmode="decimal" class="modal-input" style="text-align:center; font-size:1.2rem; font-weight:bold; margin-top:5px;" oninput="App.calc1RM()">
            </div>
        </div>

        <div style="background:rgba(0,0,0,0.4); padding:20px; border-radius:12px; border:1px solid rgba(255,255,255,0.05); margin-bottom:15px;">
            <div style="font-size:0.7rem; color:#666; font-family:'JetBrains Mono'; letter-spacing:1px;">ТВІЙ МАКСИМУМ (EST.)</div>
            <div id="rm-result" style="font-size:3rem; color:var(--theme); font-weight:900; font-family:'JetBrains Mono'; text-shadow:0 0 15px rgba(212,175,55,0.3);">0</div>
            <div style="font-size:0.8rem; color:#444; font-family:'JetBrains Mono';">КГ</div>
        </div>
        
        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:5px; font-size:0.75rem; color:#888; font-family:'JetBrains Mono'; background:#111; padding:10px; border-radius:8px;">
            <div>95%: <span id="rm-95" style="color:#fff">0</span></div>
            <div>85%: <span id="rm-85" style="color:#fff">0</span></div>
            <div>75%: <span id="rm-75" style="color:#fff">0</span></div>
            <div>65%: <span id="rm-65" style="color:#fff">0</span></div>
        </div>
    </div>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/training.js"></script>
<script src="assets/js/common.js"></script>

</body>
</html>
