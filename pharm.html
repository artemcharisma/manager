<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COURSE: GOLD PROTOCOL</title>
    <link rel="icon" href="icon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    
    <style>
        :root {
            --gold: #d4af37;
            --bg-primary: #050505;
            --bg-panel: #0a0a0a;
            --border: #1a1a1a;
            --text-muted: #666;
            --blue: #3b82f6;
            --green: #10b981;
            --purple: #8b5cf6;
            --red: #ef4444;
            --yellow: #f59e0b;
            --pink: #ec4899;
            --font-mono: 'JetBrains Mono', monospace;
            --radius: 8px;
        }

        body {
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            padding-bottom: 100px;
            background: var(--bg-primary);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            padding-bottom: 120px;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--gold), #fcd34d);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
        }

        .brand h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--gold);
        }

        .brand span {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 6px;
        }

        .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-icon:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .edit-toggle {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            padding: 0;
        }

        .edit-toggle.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        /* Navigation Tabs */
        .nav-tabs {
            background: var(--bg-panel);
            padding: 4px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            gap: 4px;
            border: 1px solid var(--border);
            margin: 0 20px;
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-tab.active {
            background: #1e1e1e;
            color: var(--gold);
        }

        /* Progress */
        .course-progress {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 3px;
            margin: 0 0 25px 0;
            position: relative;
        }

        .prog-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), #fcd34d);
            transition: width 0.5s ease;
        }

        .prog-text {
            position: absolute;
            top: 8px;
            right: 0;
            font-size: 0.7rem;
            color: #666;
            font-family: var(--font-mono);
        }

        /* Phase Scroll */
        .phase-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 0 20px 10px 20px;
            margin-bottom: 25px;
            align-items: center;
        }

        .phase-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            min-width: 140px;
            padding: 15px;
            border-radius: var(--radius);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .phase-btn small {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .phase-btn span {
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
        }

        .phase-btn.active {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold);
        }

        .phase-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gold);
        }

        .phase-ctrl {
            display: none;
            margin-top: 10px;
            justify-content: space-between;
            border-top: 1px solid #333;
            padding-top: 8px;
        }

        .phase-del {
            display: none;
            position: absolute;
            top: 8px;
            right: 8px;
            color: var(--red);
            font-size: 12px;
            cursor: pointer;
        }

        .new-phase-btn {
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--bg-panel);
            border: 1px dashed #444;
            border-radius: 12px;
            color: var(--green);
            font-size: 24px;
        }

        /* Week Bar */
        .week-bar {
            display: flex;
            gap: 6px;
            background: #000;
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 25px;
            overflow-x: auto;
            margin: 0 20px 25px 20px;
        }

        .week-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            color: #52525b;
            font-weight: 700;
            font-size: 0.85rem;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .week-btn:hover {
            background: #1e1e1e;
            color: #fff;
        }

        .week-btn.active {
            background: var(--gold);
            color: #000;
        }

        .week-btn.has-data {
            color: #bbb;
        }

        /* Main View */
        #mainView {
            padding: 0 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .stat-val {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 5px;
            font-weight: 600;
        }

        .c-blue .stat-val { color: var(--blue); }
        .c-green .stat-val { color: var(--green); }
        .c-purple .stat-val { color: var(--purple); }
        .c-red .stat-val { color: var(--red); }
        .c-yellow .stat-val { color: var(--yellow); }
        .c-pink .stat-val { color: var(--pink); }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .day-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 700;
            color: #fff;
            padding-bottom: 10px;
            border-bottom: 1px solid #27272a;
        }

        .pill {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #555;
            background: rgba(255, 255, 255, 0.03);
            font-size: 0.9rem;
        }

        .pill.c-blue { border-color: var(--blue); }
        .pill.c-green { border-color: var(--green); }
        .pill.c-purple { border-color: var(--purple); }
        .pill.c-red { border-color: var(--red); }
        .pill.c-yellow { border-color: var(--yellow); }
        .pill.c-pink { border-color: var(--pink); }

        .pill-meta {
            font-size: 0.7rem;
            color: #666;
            margin-left: 8px;
        }

        .vitals-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #27272a;
        }

        .vital-input {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            padding: 8px;
            font-size: 0.75rem;
            width: 100%;
            text-align: center;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--bg-panel);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        .modal-title {
            margin-top: 0;
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            background: #050505;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }

        .btn-save {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--gold), #fcd34d);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #666;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .dose-presets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 6px;
            margin-top: 5px;
        }

        .dose-presets span {
            font-size: 0.75rem;
            background: #222;
            padding: 6px 8px;
            border-radius: 6px;
            color: #bbb;
            cursor: pointer;
            border: 1px solid #333;
            transition: 0.2s;
            text-align: center;
        }

        .dose-presets span:hover {
            border-color: var(--gold);
            color: #fff;
            background: #333;
        }

        .tag-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 5px;
            min-height: 25px;
        }

        .tag-chip {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.05);
            color: #999;
            border: 1px solid #333;
            padding: 2px 8px;
            border-radius: 10px;
            cursor: pointer;
        }

        .tag-chip:hover {
            border-color: var(--gold);
            color: #fff;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .checkbox-wrapper input {
            width: 20px;
            height: 20px;
            accent-color: var(--gold);
        }

        .color-options {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .color-opt {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .color-opt.selected {
            border-color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Edit Mode */
        .edit-ui, .phase-ctrl, .phase-del, .new-phase-btn {
            display: none;
        }

        body.editing .edit-ui {
            display: inline-flex !important;
        }

        body.editing .phase-ctrl {
            display: flex;
        }

        body.editing .phase-del {
            display: block;
        }

        body.editing .new-phase-btn {
            display: flex;
        }

        .btn-add-pill {
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            color: var(--green);
            cursor: pointer;
            margin-top: 10px;
            opacity: 0.4;
            padding: 5px;
            border: 1px dashed #333;
            border-radius: 8px;
        }

        .btn-add-pill:hover {
            opacity: 1;
            border-color: var(--green);
        }

        .ctrl-btn {
            font-size: 0.7rem;
            background: #222;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            color: #ccc;
            border: none;
        }

        /* Photo Area */
        .photo-area {
            margin-top: 40px;
            border-top: 1px solid var(--border);
            padding-top: 30px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .photo-card {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-del {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-upload {
            background: rgba(139, 92, 246, 0.1);
            color: var(--purple);
            border: 1px dashed var(--purple);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            display: block;
        }

        .note-input {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            color: #e5e7eb;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 100px;
            margin-top: 20px;
        }

        /* Undo Float */
        #undoFloat {
            position: fixed;
            bottom: 160px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #1c1c1e;
            border: 2px solid var(--gold);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.8);
            transition: all 0.3s;
            cursor: pointer;
        }

        #undoFloat.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        /* Body Map */
        .body-map-container {
            display: flex;
            justify-content: center;
            position: relative;
            height: 400px;
        }

        .body-svg {
            height: 100%;
            width: auto;
        }

        .muscle-group {
            fill: #333;
            stroke: #555;
            stroke-width: 1;
            cursor: pointer;
        }

        .muscle-group.active {
            fill: var(--gold);
            stroke: #fff;
            filter: drop-shadow(0 0 5px var(--gold));
        }

        /* Privacy Modal */
        #privacyModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .privacy-modal-content {
            background: var(--bg-panel);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
            max-width: 300px;
        }

        .privacy-modal-content h2 {
            margin-top: 0;
            color: var(--red);
            font-size: 1.3rem;
        }

        .privacy-modal-content p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .privacy-pwd-input {
            width: 100%;
            padding: 12px;
            background: #050505;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 0.3em;
            margin-bottom: 15px;
        }

        .btn-privacy-unlock {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Privacy Mode */
        body.privacy-locked {
            pointer-events: none !important;
        }

        body.privacy-locked #privacyModal,
        body.privacy-locked .privacy-modal-content {
            pointer-events: auto !important;
        }

        body.privacy-mode .brand h1 {
            font-size: 0;
        }

        body.privacy-mode .brand h1::after {
            content: 'H-TRACK';
            font-size: 1.2rem;
            color: #fff;
        }

        body.privacy-mode .brand span {
            display: none;
        }

        body.privacy-mode .stat-val,
        body.privacy-mode .pill-meta,
        body.privacy-mode .chart-container {
            filter: blur(8px);
            opacity: 0.5;
        }

        #fileInput, #photoInput {
            display: none;
        }

        .med-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            padding: 0 20px;
        }

        .category-block {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .category-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .category-header.heart {
            background: rgba(59, 130, 246, 0.15);
            color: var(--blue);
        }

        .category-header.liver {
            background: rgba(16, 185, 129, 0.15);
            color: var(--green);
        }

        .category-header.sleep {
            background: rgba(139, 92, 246, 0.15);
            color: var(--purple);
        }

        .category-header.sos {
            background: rgba(239, 68, 68, 0.15);
            color: var(--red);
        }

        .med-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.9rem;
            justify-content: space-between;
        }

        .med-name {
            font-weight: 700;
            color: #fff;
        }

        .med-dose {
            background: #222;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        @media (max-width: 360px) {
            .brand h1, .brand span {
                display: none;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                font-size: 0.75rem;
            }

            .days-grid {
                grid-template-columns: 1fr;
            }

            .day-card {
                min-height: auto;
                padding: 12px;
            }

            .pill {
                font-size: 0.8rem;
            }

            .stat-val {
                font-size: 0.9rem;
            }

            .modal-input, .vital-input {
                font-size: 0.85rem;
                padding: 8px;
            }
        }
    </style>
</head>

<body id="appBody">
    <div class="app-container">
        <header>
            <div class="header-top">
                <div class="brand">
                    <div class="brand-icon">🏆</div>
                    <div>
                        <h1>COURSE</h1>
                        <span>GOLD PROTOCOL</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-icon" onclick="App.togglePrivacy()" title="Privacy Mode">🔒</button>
                    <button class="btn-icon" onclick="App.smartSave()" title="Save">💾</button>
                    <button class="btn-icon" onclick="document.getElementById('fileInput').click()" title="Load">📂</button>
                    <input type="file" id="fileInput" accept=".json" onchange="App.importData(this)">
                    <button class="edit-toggle" id="editBtn" onclick="App.toggleEdit()" title="Edit">✏️</button>
                </div>
            </div>

            <div class="nav-tabs">
                <div class="nav-tab active" onclick="App.setView('protocol', this)"><span>Protocol</span></div>
                <div class="nav-tab" onclick="App.setView('analytics', this)"><span>📊 Analytics</span></div>

                    <div class="color-opt" style="background: #10b981;" onclick="App.selectColor('c-green', this)"></div>

                    <div class="color-opt" style="background: #ef4444;" onclick="App.selectColor('c-red', this)"></div>
                    <div class="color-opt" style="background: #f59e0b;" onclick="App.selectColor('c-yellow', this)"></div>

    <script src="common.js"></script>

    <script>
        // === CORE DATA ===
        const DefaultData = {
            startDate: new Date().toISOString().split('T')[0],
            privacyEnabled: false,
            privacyPassword: 2255,
            phases: [
                { id: 1, title: 'Start', weeks: [1, 2] },
                { id: 2, title: 'Mass', weeks: [3, 4, 5, 6, 7, 8, 9, 10] },
                { id: 3, title: 'Bridge', weeks: [11, 12, 13, 14] },
                { id: 4, title: 'Peak Mass', weeks: [15, 16, 17, 18, 19, 20, 21, 22] },
                { id: 5, title: 'Prep', weeks: [23, 24, 25, 26] },
                { id: 6, title: 'Cut', weeks: [27, 28, 29, 30] },
                { id: 7, title: 'Defi', weeks: [31, 32, 33, 34, 35, 36] },
                { id: 8, title: 'Final', weeks: [37, 38] }
            ],
            schedule: (() => {
                let s = {};
                for (let i = 1; i <= 38; i++) {
                    s[i] = [{}, {}, {}, {}, {}, {}, {}];
                }

                const add = (w, d, n, v, c, m) => {
                    s[w][d].push({ name: n, dose: v, color: c, meta: m });
                };

                for (let w = 1; w <= 38; w++) {
                    let pid = 1;
                    if (w > 2) pid = 2;
                    if (w > 10) pid = 3;
                    if (w > 14) pid = 4;
                    if (w > 22) pid = 5;
                    if (w > 26) pid = 6;
                    if (w > 30) pid = 7;
                    if (w > 36) pid = 8;

                    if ([1, 2, 4, 8].includes(pid)) {
                        let t = pid === 4 ? '250mg' : pid === 8 ? '100mg' : '200mg';
                        let p = pid === 1 ? '67mg' : pid === 4 ? '166mg' : '133mg';

                        add(w, 0, 'Test E', t, 'c-blue', 'Base');
                        add(w, 3, 'Test E', t, 'c-blue', 'Base');
                        add(w, 0, 'Primo', p, 'c-green', 'Anabolic');
                        add(w, 2, 'Primo', p, 'c-green', 'Anabolic');
                        add(w, 4, 'Primo', p, 'c-green', 'Anabolic');
                    }

                    if ([3, 5].includes(pid)) {
                        add(w, 0, 'Test E', '150mg', 'c-blue', 'Cruise');
                        for (let d = 0; d < 7; d++) {
                            add(w, d, 'HGH', '2 IU', 'c-purple', 'AM Fasted');
                        }
                    }

                    if (pid === 6) {
                        add(w, 0, 'Test E', '175mg', 'c-blue', 'Base');
                        add(w, 3, 'Test E', '175mg', 'c-blue', 'Base');
                        let clen = 20 * (w - 27) + 40; // mcg
                        for (let d = 0; d < 7; d++) {
                            add(w, d, 'HGH', '3 IU', 'c-purple', 'AM');
                            add(w, d, 'Clen', clen + 'mcg', 'c-yellow', 'Pre-Cardio');
                        }
                    }

                    if (pid === 7) {
                        add(w, 0, 'Test E', '150mg', 'c-blue', 'Base');
                        add(w, 3, 'Test E', '150mg', 'c-blue', 'Base');
                        for (let d = 0; d < 7; d++) {
                            add(w, d, 'HGH', '3 IU', 'c-purple', 'AM');
                        }
                        for (let d = 0; d < 7; d++) {
                            let absDay = w - 31 * 7 + d;
                            if (absDay % 2 === 0) {
                                add(w, d, 'Tren A', '50mg', 'c-red', 'Deep IM');
                            }
                        }
                    }
                }
                return s;
            })(),
            vitals: {},
            bodyMap: { last: null, history: [] },
            analysis: [
                { title: 'Blood Test 1', timing: '0', checks: ['', '', '', ''] },
                { title: 'Blood Test 2', timing: '8-10', checks: ['', '', ''] },
                { title: 'Blood Test 3', timing: '18-20', checks: ['', '', '.', 'HbA1c'] },
                { title: 'Blood Test 4', timing: '28', checks: ['', '', '3', '4'] },
                { title: 'Blood Test 5', timing: '38', checks: ['', '', ''] }
            ],
            pharmacy: [
                { id: 'heart', title: '❤️ Heart', style: 'heart', items: [
                    { n: 'Nebivolol', d: '5mg', i: '.' },
                    { n: 'Telmisartan', d: '40mg', i: '.' },
                    { n: 'Omega-3', d: '4g', i: '.' },
                    { n: 'Ubiquinol', d: '100mg', i: '.' }
                ]},
                { id: 'liver', title: '🫀 Liver', style: 'liver', items: [
                    { n: 'TUDCA', d: '500mg', i: '.' },
                    { n: 'NAC', d: '1200mg', i: '.' },
                    { n: 'Astragalus', d: '2g', i: '.' }
                ]},
                { id: 'sleep', title: '😴 Sleep', style: 'sleep', items: [
                    { n: 'Magnesium', d: '400mg', i: '.' },
                    { n: 'P-5-P B6', d: '50mg', i: '.' },
                    { n: 'GABA', d: '2g', i: '.' }
                ]},
                { id: 'sos', title: '🚨 SOS', style: 'sos', items: [
                    { n: 'Cabergoline', d: '0.25mg', i: '..' },
                    { n: 'Anastrozole', d: '0.5mg', i: '..' },
                    { n: 'Captopril', d: '25mg', i: '160.' }
                ]}
            ],
            notes: {}
        };

        const App = {
            data: null,
            photoKeys: new Set(),
            history: [],
            state: { view: 'protocol', phaseId: 1, week: 1, editing: false, tempPill: null },
            chartInstance: null,
            dayBuffer: null,

            async init() {
                await PhotoDB.init();
                this.load();
                await this.refreshPhotos();
                this.renderNav();
                this.renderView();

                if (this.data.privacyEnabled) {
                    document.body.classList.add('privacy-mode', 'privacy-locked');
                    document.getElementById('privacyModal').style.display = 'flex';
                    setTimeout(() => document.getElementById('privacyPassword').focus(), 100);
                }

                document.querySelector('.brand').ondblclick = () => {
                    if (confirm('HARD RESET? ')) {
                        localStorage.removeItem('goldprotocolv6');
                        try { indexedDB.deleteDatabase('GoldProtocolDB'); } catch (e) {}
                        location.reload();
                    }
                };
            },

            load() {
                const s = localStorage.getItem('goldprotocolv6');
                if (s) {
                    try {
                        this.data = JSON.parse(s);
                        if (!this.data.vitals) this.data.vitals = {};
                        if (!this.data.startDate) this.data.startDate = new Date().toISOString().split('T')[0];
                        if (!this.data.bodyMap) this.data.bodyMap = { last: null, history: [] };
                        if (!this.data.privacyEnabled) this.data.privacyEnabled = false;
                        if (!this.data.privacyPassword) this.data.privacyPassword = 2255;
                        if (!this.data.analysis) this.data.analysis = JSON.parse(JSON.stringify(DefaultData.analysis));
                        if (!this.data.pharmacy) this.data.pharmacy = JSON.parse(JSON.stringify(DefaultData.pharmacy));
                        if (!this.data.phases) this.data.phases = JSON.parse(JSON.stringify(DefaultData.phases));
                        if (!this.data.schedule) this.data.schedule = JSON.parse(JSON.stringify(DefaultData.schedule));
                    } catch (e) {
                        console.error('Load error:', e);
                        this.data = JSON.parse(JSON.stringify(DefaultData));
                    }
                } else {
                    this.data = JSON.parse(JSON.stringify(DefaultData));
                }
                this.save();
            },

            save() {
                localStorage.setItem('goldprotocolv6', JSON.stringify(this.data));
            },

            togglePrivacy() {
                if (this.data.privacyEnabled) {
                    document.getElementById('privacyModal').style.display = 'flex';
                    document.getElementById('privacyPassword').value = '';
                    setTimeout(() => document.getElementById('privacyPassword').focus(), 100);
                } else {
                    this.data.privacyEnabled = true;
                    this.save();
                    document.body.classList.add('privacy-mode', 'privacy-locked');
                    document.getElementById('privacyModal').style.display = 'flex';
                    setTimeout(() => document.getElementById('privacyPassword').focus(), 100);
                }
            },

            unlockPrivacy() {
                const pwd = document.getElementById('privacyPassword').value;
                if (pwd === String(this.data.privacyPassword)) {
                    this.data.privacyEnabled = false;
                    this.save();
                    document.body.classList.remove('privacy-locked', 'privacy-mode');
                    document.getElementById('privacyModal').style.display = 'none';
                    document.getElementById('privacyPassword').value = '';
                } else {
                    alert('❌ Неправильний пароль');
                    document.getElementById('privacyPassword').focus();
                }
            },

            getMondayOfStartWeek() {
                const d = new Date(this.data.startDate);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                return new Date(d.setDate(diff));
            },

            getRealDateObj(week, dayIndex) {
                const monday = this.getMondayOfStartWeek();
                monday.setDate(monday.getDate() + (week - 1) * 7 + dayIndex);
                return monday;
            },

            getRealDate(week, dayIndex) {
                return this.getRealDateObj(week, dayIndex).toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit' });
            },

            isToday(week, dayIndex) {
                const d = this.getRealDateObj(week, dayIndex);
                d.setHours(0, 0, 0, 0);
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                return d.getTime() === now.getTime();
            },

            changeStartDate() {
                const newDate = prompt('Дата старту (YYYY-MM-DD):', this.data.startDate);
                if (newDate && newDate.match(/\d{4}-\d{2}-\d{2}/)) {
                    this.pushHistory();
                    this.data.startDate = newDate;
                    this.save();
                    this.renderView();
                }
            },

            pushHistory() {
                if (this.history.length > 20) this.history.shift();
                this.history.push(JSON.stringify(this.data));
                if (this.state.editing) {
                    document.getElementById('undoFloat').classList.add('visible');
                }
            },

            undo() {
                if (this.history.length === 0) return;
                this.data = JSON.parse(this.history.pop());
                if (this.history.length === 0) {
                    document.getElementById('undoFloat').classList.remove('visible');
                }
                this.save();
                this.refreshPhotos();
                this.renderNav();
                this.renderView();
            },

            async renderView() {
                const scrollPos = window.scrollY;
                const c = document.getElementById('mainView');
                c.innerHTML = '';
                this.renderTimeline();

                if (this.state.view === 'protocol') {
                    await this.renderProtocol(c);
                } else if (this.state.view === 'analysis') {
                    this.renderAnalysis(c);
                } else if (this.state.view === 'pharmacy') {
                    this.renderPharm(c);
                } else if (this.state.view === 'analytics') {
                    this.renderAnalytics(c);
                }

                window.scrollTo(0, scrollPos);
            },

            renderTimeline() {
                const maxW = 38;
                const curW = this.state.week;
                const pct = Math.min(100, (curW / maxW) * 100);
                document.getElementById('progBar').style.width = pct + '%';
                document.getElementById('progText').innerText = `Week ${curW}/${maxW}`;
            },

            async renderProtocol(c) {
                const stats = this.calc(this.state.week);
                let statsHtml = Object.entries(stats).map(([k, v]) => {
                    let color = 'yellow';
                    const key = k.toLowerCase();
                    if (key.includes('test')) color = 'blue';
                    else if (key.includes('tren')) color = 'red';
                    else if (key.includes('primo')) color = 'green';
                    else if (key.includes('hgh')) color = 'purple';
                    else if (key.includes('hcg')) color = 'pink';
                    else if (key.includes('clen')) color = 'yellow';

                    return `<div class="stat-card c-${color}">
                        <span class="stat-val">${parseFloat(v.v).toFixed(2)}</span>
                        <span class="stat-label">${k}</span>
                    </div>`;
                }).join('');

                statsHtml += `<div class="stat-card" style="border-color: #444; cursor: pointer; align-items: center; justify-content: center;" onclick="App.openBodyMap()">
                    <span style="font-size: 1.5rem;">🗺️</span>
                    <span class="stat-label">MAP</span>
                </div>`;

                const ph = this.data.phases.find(x => x.id === this.state.phaseId);
                const wHtml = ph ? ph.weeks.map(w => 
                    `<div class="week-btn ${w === this.state.week ? 'active' : ''} ${this.photoKeys.has(w) ? 'has-data' : ''}" onclick="App.setWeek(${w})">W${w}</div>`
                ).join('') : '';

                let grid = `<div class="days-grid">`;
                const dayNames = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'НД'];

                for (let i = 0; i < 7; i++) {
                    const realDate = this.getRealDate(this.state.week, i);
                    const isToday = this.isToday(this.state.week, i);
                    const pills = this.data.schedule[this.state.week]?.[i] || [];
                    const v = this.data.vitals[`${this.state.week}-${i}`] || { bp: '', hr: '', w: '' };

                    let content = pills.map((m, idx) => 
                        `<div class="pill ${m.color}">
                            <div style="flex: 1;">
                                <div contenteditable="${this.state.editing}" onblur="App.updatePill(${this.state.week},${i},${idx},'name',this.innerText)" style="font-weight: 600;">${m.name}</div>
                                <div class="pill-meta" contenteditable="${this.state.editing}" onblur="App.updatePill(${this.state.week},${i},${idx},'meta',this.innerText)">${m.meta}</div>
                            </div>
                            <div>
                                <span contenteditable="${this.state.editing}" onblur="App.updatePill(${this.state.week},${i},${idx},'dose',this.innerText)">${m.dose}</span>
                                ${this.state.editing ? `<span class="edit-ui" style="color: #ef4444; margin-left: 8px; cursor: pointer;" onclick="App.delPillItem(${this.state.week},${i},${idx})">✕</span>` : ''}
                            </div>
                        </div>`
                    ).join('');

                    const copyBtn = this.state.editing ? 
                        `<span style="font-size: 0.9rem; cursor: pointer; opacity: 0.7; margin-left: 10px;" onclick="App.copyDay(${this.state.week}, ${i})" title="${this.dayBuffer ? '✓' : 'Copy'}">${this.dayBuffer ? '✓' : 'copy'}</span>`
                        : '';

                    grid += `<div class="day-card" style="${isToday ? 'border-color: var(--gold); box-shadow: 0 0 10px rgba(212,175,55,0.1);' : ''}">
                        <div class="day-header">
                            <div style="display: flex; flex-direction: column; line-height: 1.2;">
                                <span>${dayNames[i]}</span>
                                <span style="font-size: 0.65rem; color: #666; font-weight: 400;">${realDate}</span>
                            </div>
                            ${copyBtn}
                        </div>
                        ${content}
                        ${this.state.editing ? `<div class="btn-add-pill edit-ui" onclick="App.openAddPillModal(${this.state.week},${i})">+</div>` : ''}
                        <div class="vitals-row">
                            <input class="vital-input" placeholder="120/80" value="${v.bp}" onblur="App.saveVital(${this.state.week},${i},'bp',this.value)">
                            <input class="vital-input" type="number" placeholder="HR" value="${v.hr}" onblur="App.saveVital(${this.state.week},${i},'hr',this.value)">
                            <input class="vital-input" type="number" placeholder="Weight" value="${v.w}" onblur="App.saveVital(${this.state.week},${i},'w',this.value)">
                        </div>
                    </div>`;
                }

                grid += `</div>`;

                const photos = await PhotoDB.get(this.state.week);
                const pHtml = photos.map(p => 
                    `<div class="photo-card">
                        <img src="${p.data}" onclick="document.getElementById('modalImg').src=this.src;document.getElementById('imgModal').style.display='flex';">
                        <div class="photo-del" onclick="event.stopPropagation(); App.deletePhoto(${p.id})">✕</div>
                    </div>`
                ).join('');

                c.innerHTML = `<div class="stats-grid">${statsHtml}</div>
                    <div class="week-bar">${wHtml}</div>
                    ${grid}
                    <div style="margin-top: 20px; padding: 0 20px;">
                        <textarea class="note-input" placeholder="Заметки на тиждень..." onblur="App.saveNote(${this.state.week}, this.value)">${this.data.notes[this.state.week] || ''}</textarea>
                    </div>
                    <div class="photo-area">
                        <h3 style="color: #fff; font-size: 1rem; margin: 0 0 20px 0;">Week ${this.state.week}</h3>
                        <div class="photo-grid">${pHtml}</div>
                        <label class="btn-upload" style="margin-top: 10px;">
                            <input type="file" id="photoInput" accept="image/*" multiple onchange="App.uploadPhoto(this)">
                            📸 Загрузити фото
                        </label>
                    </div>
                </div>`;
            },

            renderAnalytics(c) {
                c.innerHTML = `<div class="chart-container"><canvas id="mainChart"></canvas></div>`;

                const labels = [];
                const dataTest = [];
                const dataWeight = [];

                for (let w = 1; w <= 38; w++) {
                    labels.push(`W${w}`);
                    let weekTest = 0;
                    if (this.data.schedule[w]) {
                        this.data.schedule[w].forEach(day => {
                            day.forEach(pill => {
                                if (pill.name.toLowerCase().includes('test')) {
                                    const val = parseFloat(pill.dose);
                                    if (!isNaN(val)) weekTest = val;
                                }
                            });
                        });
                    }
                    dataTest.push(weekTest);

                    let weightSum = 0;
                    let weightCount = 0;
                    for (let d = 0; d < 7; d++) {
                        const v = this.data.vitals[`${w}-${d}`];
                        if (v && v.w) {
                            weightSum += parseFloat(v.w.toString().replace(',', '.'));
                            weightCount++;
                        }
                    }
                    dataWeight.push(weightCount > 0 ? weightSum / weightCount : null);
                }

                if (this.chartInstance) {
                    this.chartInstance.destroy();
                    this.chartInstance = null;
                }

                const ctx = document.getElementById('mainChart').getContext('2d');
                this.chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Testosterone (mg)',
                                data: dataTest,
                                backgroundColor: 'rgba(59, 130, 246, 0.5)',
                                yAxisID: 'y',
                                order: 2
                            },
                            {
                                label: 'Weight (kg)',
                                data: dataWeight,
                                borderColor: '#d4af37',
                                backgroundColor: '#d4af37',
                                type: 'line',
                                yAxisID: 'y1',
                                order: 1,
                                tension: 0.4,
                                spanGaps: true
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                grid: { color: '#333' }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                grid: { drawOnChartArea: false }
                            },
                            x: {
                                grid: { display: false }
                            }
                        },
                        plugins: {
                            legend: { labels: { color: '#fff' } },
                            filler: { propagate: true }
                        }
                    }
                });
            },

            renderAnalysis(c) {
                let html = `<div class="med-grid">`;

                this.data.analysis.forEach((block, i) => {
                    html += `<div class="med-card">
                        <div class="med-header">
                            <div style="flex-grow: 1;">
                                <div class="med-title" contenteditable="${this.state.editing}" onblur="App.data.analysis[${i}].title=this.innerText; App.save();">${block.title}</div>
                                <div style="font-size: 0.75rem; color: #999; margin-top: 5px;" contenteditable="${this.state.editing}" onblur="App.data.analysis[${i}].timing=this.innerText; App.save();">${block.timing}</div>
                            </div>
                            ${this.state.editing ? `<div style="cursor: pointer; color: #ef4444;" onclick="App.pushHistory(); App.data.analysis.splice(${i},1); App.save(); App.renderView();">✕</div>` : ''}
                        </div>`;

                    block.checks.forEach((chk, j) => {
                        html += `<div class="check-row">
                            <span style="color: #10b981; font-size: 0.8rem;">✓</span>
                            <span class="check-name" contenteditable="${this.state.editing}" onblur="App.data.analysis[${i}].checks[${j}]=this.innerText; App.save();">${chk}</span>
                            ${this.state.editing ? `<span class="edit-ui" style="color: #ef4444; cursor: pointer;" onclick="App.pushHistory(); App.data.analysis[${i}].checks.splice(${j},1); App.save(); App.renderView();">✕</span>` : ''}
                        </div>`;
                    });

                    if (this.state.editing) {
                        html += `<div class="btn-add-pill" style="margin-top: 10px; font-size: 1rem;" onclick="App.pushHistory(); App.data.analysis[${i}].checks.push(''); App.save(); App.renderView();">+</div>`;
                    }

                    html += `</div>`;
                });

                if (this.state.editing) {
                    html += `<button class="btn-add-pill" style="width: 100%; margin-top: 20px; font-size: 1rem;" onclick="App.pushHistory(); App.data.analysis.push({title: '', timing: '', checks: []}); App.save(); App.renderView();">+ New Test</button>`;
                }

                html += `</div>`;
                c.innerHTML = html;
            },

            renderPharm(c) {
                let html = `<div class="med-grid">`;

                this.data.pharmacy.forEach((cat, i) => {
                    html += `<div class="category-block">
                        <div class="category-header ${cat.style}">${cat.title}</div>`;

                    cat.items.forEach((item, j) => {
                        html += `<div class="med-item">
                            <span class="med-name" contenteditable="${this.state.editing}" onblur="App.data.pharmacy[${i}].items[${j}].n=this.innerText; App.save();">${item.n}</span>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <span class="med-dose" contenteditable="${this.state.editing}" onblur="App.data.pharmacy[${i}].items[${j}].d=this.innerText; App.save();">${item.d}</span>
                                ${this.state.editing ? `<span class="edit-ui" style="color: #ef4444; cursor: pointer; font-size: 0.8rem;" onclick="App.pushHistory(); App.data.pharmacy[${i}].items.splice(${j},1); App.save(); App.renderView();">✕</span>` : ''}
                            </div>
                        </div>`;
                    });

                    html += `<div class="btn-add-pill edit-ui" style="font-size: 1rem; border: none; border-top: 1px solid #333; border-radius: 0; margin: 0;" onclick="App.pushHistory(); App.data.pharmacy[${i}].items.push({n:'',d:'-',i:''}); App.save(); App.renderView();">+</div>
                    </div>`;
                });

                html += `</div>`;
                c.innerHTML = html;
            },

            openBodyMap() {
                document.getElementById('bodyMapModal').style.display = 'flex';
                this.renderBodyMap();
            },

            renderBodyMap() {
                const muscles = [
                    { id: 'deltl', d: 'M85,60 Q70,60 65,80 L70,110 Q85,100 85,60', cx: 75, cy: 85 },
                    { id: 'deltr', d: 'M215,60 Q230,60 235,80 L230,110 Q215,100 215,60', cx: 225, cy: 85 },
                    { id: 'glutel', d: 'M110,200 Q90,200 85,240 Q110,270 150,270 L150,200 Z', cx: 115, cy: 230 },
                    { id: 'gluter', d: 'M190,200 Q210,200 215,240 Q190,270 150,270 L150,200 Z', cx: 185, cy: 230 },
                    { id: 'quadl', d: 'M100,280 Q85,350 90,400 L140,400 Q145,350 150,280 Z', cx: 120, cy: 340 },
                    { id: 'quadr', d: 'M200,280 Q215,350 210,400 L160,400 Q155,350 150,280 Z', cx: 180, cy: 340 }
                ];

                let svg = `<svg viewBox="0 0 300 500" class="body-svg">
                    <path d="M150,20 Q110,20 110,50 L100,60 L100,180 L80,250 L80,450 L140,450 L140,280 L160,280 L160,450 L220,450 L220,250 L200,180 L200,60 L190,50 Q190,20 150,20" fill="#1a1a1a" stroke="none"></path>`;

                muscles.forEach(m => {
                    const isActive = this.data.bodyMap?.last === m.id;
                    svg += `<path d="${m.d}" class="muscle-group ${isActive ? 'active' : ''}" onclick="App.setInjectionSite('${m.id}')"></path>`;
                    if (isActive) {
                        svg += `<text x="${m.cx}" y="${m.cy}" fill="#000" font-size="10" text-anchor="middle" dominant-baseline="middle">✓</text>`;
                    }
                });

                svg += `</svg>`;
                document.getElementById('svgContainer').innerHTML = svg;
            },

            setInjectionSite(id) {
                if (!this.data.bodyMap) this.data.bodyMap = { last: null, history: [] };
                this.data.bodyMap.last = id;
                this.data.bodyMap.history.push({ date: new Date().toISOString(), id: id });
                this.save();
                this.renderBodyMap();
            },

            openAddPillModal(week, dayIndex) {
                this.state.tempPill = { w: week, d: dayIndex, color: 'c-blue' };
                document.getElementById('pillName').value = '';
                document.getElementById('pillDose').value = '';
                document.getElementById('pillMeta').value = '';
                document.getElementById('fillPhase').checked = false;
                document.querySelectorAll('.color-opt').forEach(el => el.classList.remove('selected'));
                document.querySelector('.color-opt').classList.add('selected');
                this.updateSuggestions();
                document.getElementById('addPillModal').style.display = 'flex';
                setTimeout(() => document.getElementById('pillName').focus(), 100);
            },

            setDose(val) {
                document.getElementById('pillDose').value = val;
            },

            updateSuggestions() {
                const medSet = new Set();
                const tagSet = new Set();

                this.data.pharmacy.forEach(c => {
                    c.items.forEach(i => medSet.add(i.n));
                });

                Object.values(this.data.schedule).forEach(w => {
                    w.forEach(d => {
                        d.forEach(p => {
                            if (p.name) medSet.add(p.name);
                            if (p.meta) tagSet.add(p.meta);
                        });
                    });
                });

                const dl = document.getElementById('med-suggestions');
                dl.innerHTML = Array.from(medSet).sort().map(m => `<option value="${m}">`).join('');

                const tagContainer = document.getElementById('tagPresets');
                tagContainer.innerHTML = Array.from(tagSet).sort().map(t => {
                    if (t.length === 0) return '';
                    const chip = `<div class="tag-chip" onclick="document.getElementById('pillMeta').value='${t}'">${t}</div>`;
                    return chip;
                }).join('');
            },

            selectColor(colorClass, el) {
                this.state.tempPill.color = colorClass;
                document.querySelectorAll('.color-opt').forEach(e => e.classList.remove('selected'));
                el.classList.add('selected');
            },

            confirmAddPill() {
                const name = document.getElementById('pillName').value || 'New...';
                const dose = document.getElementById('pillDose').value || '-';
                const meta = document.getElementById('pillMeta').value;
                const fillPhase = document.getElementById('fillPhase').checked;

                this.pushHistory();

                if (fillPhase) {
                    const phase = this.data.phases.find(p => p.weeks.includes(this.state.tempPill.w));
                    if (phase) {
                        const futureWeeks = phase.weeks.filter(w => w >= this.state.tempPill.w);
                        futureWeeks.forEach(w => {
                            this.data.schedule[w][this.state.tempPill.d].push({
                                name, dose, meta, color: this.state.tempPill.color
                            });
                        });
                    }
                } else {
                    this.data.schedule[this.state.tempPill.w][this.state.tempPill.d].push({
                        name, dose, meta, color: this.state.tempPill.color
                    });
                }

                this.save();
                this.closeModal();
                this.renderView();
            },

            closeModal() {
                document.getElementById('addPillModal').style.display = 'none';
            },

            calc(week) {
                const stats = {};
                if (!this.data.schedule[week]) return stats;

                this.data.schedule[week].forEach(d => {
                    d.forEach(p => {
                        const n = parseFloat(p.dose.replace(',', '.'));
                        if (!isNaN(n)) {
                            let k = p.name.trim();
                            let u = p.dose.toLowerCase().includes('iu') ? 'IU' : 'mg';
                            if (!stats[k]) stats[k] = { v: 0, u: u };
                            stats[k].v += n;
                        }
                    });
                });

                return stats;
            },

            updatePill(w, d, i, k, v) {
                this.pushHistory();
                this.data.schedule[w][d][i][k] = v;
                this.save();
                this.renderView();
            },

            saveNote(w, t) {
                this.pushHistory();
                this.data.notes[w] = t;
                this.save();
            },

            saveVital(w, d, k, v) {
                this.pushHistory();
                const key = `${w}-${d}`;
                if (!this.data.vitals[key]) this.data.vitals[key] = { bp: '', hr: '', w: '' };
                this.data.vitals[key][k] = v;
                this.save();
            },

            copyDay(w, d) {
                if (!this.dayBuffer) {
                    this.dayBuffer = JSON.parse(JSON.stringify(this.data.schedule[w][d]));
                    this.renderView();
                } else {
                    if (confirm('Замінити день?')) {
                        this.pushHistory();
                        this.data.schedule[w][d] = JSON.parse(JSON.stringify(this.dayBuffer));
                        this.dayBuffer = null;
                        this.save();
                        this.renderView();
                    }
                }
            },

            smartSave() {
                let report = `GOLD PROTOCOL - Week ${this.state.week}\n\n`;

                const stats = this.calc(this.state.week);
                if (Object.keys(stats).length > 0) {
                    report += `STATS:\n`;
                    Object.entries(stats).forEach(([k, v]) => {
                        report += k.padEnd(15) + ` ${v.v.toFixed(1)} ${v.u}\n`;
                    });
                    report += `\n`;
                }

                const dayNames = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'НД'];
                report += `SCHEDULE:\n`;

                for (let i = 0; i < 7; i++) {
                    const pills = this.data.schedule[this.state.week]?.[i];
                    const realDate = this.getRealDate(this.state.week, i);
                    report += `${dayNames[i]} ${realDate}\n`;

                    if (pills.length === 0) {
                        report += '  (Rest)\n';
                    } else {
                        pills.forEach(p => {
                            report += `  ${p.name} - ${p.dose}`;
                            if (p.meta) report += ` (${p.meta})`;
                            report += '\n';
                        });
                    }
                }

                if (this.data.notes[this.state.week]) {
                    report += `\nNOTES:\n${this.data.notes[this.state.week]}\n`;
                }

                navigator.clipboard.writeText(report).then(() => {
                    alert('✅ Копіровано в буфер обміну!');
                    if (confirm('Завантажити JSON файл?')) {
                        const jsonForFile = JSON.stringify(this.data, null, 2);
                        const a = document.createElement('a');
                        a.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(jsonForFile);
                        a.download = `goldprotocol-w${this.state.week}-${new Date().toISOString().split('T')[0]}.json`;
                        a.click();
                    }
                }).catch(err => {
                    alert('Помилка копіювання');
                });
            },

            setView(v, btn) {
                this.state.view = v;
                document.querySelectorAll('.nav-tab').forEach(e => e.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('phaseNav').style.display = v === 'protocol' ? 'flex' : 'none';
                this.renderView();
            },

            setPhase(id) {
                this.state.phaseId = id;
                const ph = this.data.phases.find(p => p.id === id);
                if (ph) this.state.week = ph.weeks[0];
                this.renderNav();
                this.renderView();
            },

            setWeek(w) {
                this.state.week = w;
                this.renderView();
            },

            delPillItem(w, d, i) {
                this.pushHistory();
                this.data.schedule[w][d].splice(i, 1);
                this.save();
                this.renderView();
            },

            addMed(catIdx) {
                let n = prompt('Назва препарату:');
                if (n) {
                    this.pushHistory();
                    this.data.pharmacy[catIdx].items.push({ n, d: '-', i: '.' });
                    this.save();
                    this.renderView();
                }
            },

            delMed(c, i) {
                if (confirm('Видалити?')) {
                    this.pushHistory();
                    this.data.pharmacy[c].items.splice(i, 1);
                    this.save();
                    this.renderView();
                }
            },

            importData(inp) {
                const r = new FileReader();
                r.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        if (!json.phases) throw new Error('Invalid');
                        this.pushHistory();
                        this.data = json;
                        this.save();
                        location.reload();
                    } catch (err) {
                        alert('Помилка импорту файла');
                    }
                };
                r.readAsText(inp.files[0]);
            },

            async addPhaseWeek(pId) {
                this.pushHistory();
                const pIdx = this.data.phases.findIndex(p => p.id === pId);
                const phase = this.data.phases[pIdx];
                const lastWeek = phase.weeks[phase.weeks.length - 1];
                const maxW = Math.max(...Object.keys(this.data.schedule).map(Number));
                const copyOfLastWeek = JSON.parse(JSON.stringify(this.data.schedule[lastWeek]));

                for (let w = maxW; w > lastWeek; w--) {
                    this.data.schedule[w + 1] = this.data.schedule[w];
                    this.data.notes[w + 1] = this.data.notes[w];
                }

                for (let d = 0; d < 7; d++) {
                    if (this.data.vitals[`${lastWeek}-${d}`]) {
                        this.data.vitals[`${lastWeek + 1}-${d}`] = this.data.vitals[`${lastWeek}-${d}`];
                        delete this.data.vitals[`${lastWeek}-${d}`];
                    }
                }

                this.data.schedule[lastWeek + 1] = copyOfLastWeek;
                await PhotoDB.shiftWeeks(lastWeek + 1, 1);
                phase.weeks.push(lastWeek + 1);

                for (let i = pIdx + 1; i < this.data.phases.length; i++) {
                    this.data.phases[i].weeks = this.data.phases[i].weeks.map(w => w + 1);
                }

                this.save();
                this.refreshPhotos();
                this.renderNav();
                this.renderView();
            },

            async removePhaseWeek(pId) {
                const pIdx = this.data.phases.findIndex(p => p.id === pId);
                const phase = this.data.phases[pIdx];
                if (phase.weeks.length === 1) return alert('Мінімум 1 тиждень!');

                this.pushHistory();
                const lastWeek = phase.weeks[phase.weeks.length - 1];
                await PhotoDB.shiftWeeks(lastWeek + 1, -1);
                const maxW = Math.max(...Object.keys(this.data.schedule).map(Number));

                for (let w = lastWeek; w <= maxW - 1; w++) {
                    this.data.schedule[w] = this.data.schedule[w + 1];
                    this.data.notes[w] = this.data.notes[w + 1];
                }

                for (let d = 0; d < 7; d++) {
                    if (this.data.vitals[`${lastWeek + 1}-${d}`]) {
                        this.data.vitals[`${lastWeek}-${d}`] = this.data.vitals[`${lastWeek + 1}-${d}`];
                        delete this.data.vitals[`${lastWeek + 1}-${d}`];
                    }
                }

                delete this.data.schedule[maxW];
                phase.weeks.pop();

                for (let i = pIdx + 1; i < this.data.phases.length; i++) {
                    this.data.phases[i].weeks = this.data.phases[i].weeks.map(w => w - 1);
                }

                this.save();
                this.refreshPhotos();
                this.renderNav();
                this.setPhase(this.data.phases[0]?.id || 1);
            },

            addNewPhase() {
                this.pushHistory();
                const lastP = this.data.phases[this.data.phases.length - 1];
                const startW = lastP ? lastP.weeks[lastP.weeks.length - 1] + 1 : 1;
                const newId = lastP ? lastP.id + 1 : 1;

                this.data.phases.push({ id: newId, title: 'New', weeks: [startW, startW + 1, startW + 2, startW + 3] });
                for (let i = 0; i < 4; i++) {
                    this.data.schedule[startW + i] = [{}, {}, {}, {}, {}, {}, {}];
                }
                this.save();
                this.renderNav();
            },

            deletePhase(pId) {
                if (!confirm('Видалити фазу?')) return;

                this.pushHistory();
                const pIdx = this.data.phases.findIndex(p => p.id === pId);
                const p = this.data.phases[pIdx];
                const len = p.weeks.length;
                const start = p.weeks[0];
                const maxW = Math.max(...Object.keys(this.data.schedule).map(Number));

                for (let w = start; w <= maxW - len; w++) {
                    this.data.schedule[w] = this.data.schedule[w + len];
                    this.data.notes[w] = this.data.notes[w + len];
                }

                for (let i = 0; i < len; i++) {
                    delete this.data.schedule[maxW - i];
                }

                this.data.phases.splice(pIdx, 1);

                for (let i = pIdx; i < this.data.phases.length; i++) {
                    this.data.phases[i].weeks = this.data.phases[i].weeks.map(w => w - len);
                }

                this.save();
                this.renderNav();
                this.setPhase(this.data.phases[0]?.id || 1);
            },

            async refreshPhotos() {
                this.photoKeys = await PhotoDB.keys();
            },

            async uploadPhoto(inp) {
                this.pushHistory();
                for (let f of inp.files) {
                    await PhotoDB.add(this.state.week, f);
                }
                await this.refreshPhotos();
                this.renderView();
            },

            async deletePhoto(id) {
                if (confirm('Видалити фото?')) {
                    this.pushHistory();
                    await PhotoDB.del(id);
                    await this.refreshPhotos();
                    this.renderView();
                }
            },

            toggleEdit() {
                this.state.editing = !this.state.editing;
                document.body.classList.toggle('editing', this.state.editing);
                document.getElementById('editBtn').classList.toggle('active', this.state.editing);
                this.dayBuffer = null;

                if (!this.state.editing) {
                    document.getElementById('undoFloat').classList.remove('visible');
                } else {
                    if (this.history.length > 0) {
                        document.getElementById('undoFloat').classList.add('visible');
                    }
                }

                this.renderNav();
                this.renderView();
            },

            renderNav() {
                const nav = document.getElementById('phaseNav');
                let html = this.data.phases.map(p => `
                    <div class="phase-btn ${p.id === this.state.phaseId ? 'active' : ''}" onclick="App.setPhase(${p.id})">
                        <small>PHASE ${p.id}</small>
                        <span>${p.title}</span>
                        <div class="phase-ctrl">
                            <div class="ctrl-btn" onclick="event.stopPropagation(); App.removePhaseWeek(${p.id});">- W</div>
                            <div class="ctrl-btn" onclick="event.stopPropagation(); App.addPhaseWeek(${p.id});">+ W</div>
                        </div>
                        <div class="phase-del" onclick="event.stopPropagation(); App.deletePhase(${p.id});">✕</div>
                    </div>
                `).join('');

                html += `<div class="new-phase-btn phase-btn" onclick="App.addNewPhase()">+</div>`;
                html += `<div style="display: flex; align-items: center; margin-left: 10px; opacity: 0.5; font-size: 0.8rem; cursor: pointer;" onclick="App.changeStartDate();" title="${this.data.startDate}">📅</div>`;

                nav.innerHTML = html;
            }
        };

        window.onload = () => App.init();
    </script>
</body>
</html>
