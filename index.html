<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAGER OS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Manager OS">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="common.css">

    <style>
        /* Уникальные стили только для Хаба */
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
        }
        .hub-container { width: 100%; max-width: 500px; animation: fadeIn 0.8s ease; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-family: var(--font-mono); font-size: 2rem; margin: 0; letter-spacing: -1px; }
        .subtitle { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px; margin-top: 5px; }
        
        /* Виджет часов */
        .sys-widget { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 25px; text-align: center; font-family: var(--font-mono); }
        .time { font-size: 1.8rem; font-weight: 700; color: #fff; letter-spacing: 2px; }
        .date { font-size: 0.8rem; color: var(--gold); text-transform: uppercase; margin-top: 5px; }

        /* Сетка приложений */
        .app-grid { display: grid; gap: 15px; }
        .app-card { background: var(--bg-panel); border: 1px solid var(--border); padding: 20px; border-radius: 16px; text-decoration: none; display: flex; align-items: center; gap: 20px; transition: 0.3s; position: relative; overflow: hidden; }
        .app-card:hover { transform: translateY(-3px); border-color: #444; }
        .app-card:active { transform: scale(0.98); }
        
        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); }
        .info h3 { margin: 0; font-size: 1.1rem; color: #fff; }
        .info p { margin: 4px 0 0; font-size: 0.8rem; color: var(--text-muted); }
        
        .card-pharm:hover { border-color: var(--gold); } .card-pharm .icon-box { color: var(--gold); }
        .card-nutri:hover { border-color: var(--green); } .card-nutri .icon-box { color: var(--green); }
        .card-train:hover { border-color: var(--blue); } .card-train .icon-box { color: var(--blue); }
        
        @keyframes fadeIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }
    </style>
</head>
<body>
    <div class="hub-container">
        <header>
            <h1>MANAGER OS</h1>
            <div class="subtitle">PROTOCOL MANAGEMENT</div>
        </header>

        <div class="sys-widget">
            <div class="time" id="clock-time">00:00</div>
            <div class="date" id="clock-date">LOADING...</div>
        </div>

        <div class="app-grid">
            <a href="pharm.html" class="app-card card-pharm">
                <div class="icon-box">🏆</div>
                <div class="info"><h3>Здоров'я</h3><p>Gold Protocol • Курс • Аналізи</p></div>
            </a>
            <a href="training.html" class="app-card card-train">
                <div class="icon-box">⚖️</div>
                <div class="info"><h3>Тренування</h3><p>Training • Mass • Cut</p></div>
            </a>
            <a href="nutrition.html" class="app-card card-nutri">
                <div class="icon-box">🥑</div>
                <div class="info"><h3>Харчування</h3><p>Макроси • База продуктів</p></div>
            </a>
        </div>
        
        <div style="margin-top: 40px; text-align: center; color: #333; font-size: 0.7rem; font-family: 'JetBrains Mono'">SYSTEM CONTROL</div>

        <div style="margin-top: 20px; display:flex; gap:10px; justify-content:center;">
            <button onclick="CreateRestorePoint()" style="background:#111; border:1px solid #333; color:var(--green); padding:10px 15px; border-radius:8px; font-size:0.75rem; cursor:pointer; font-family:'JetBrains Mono'; font-weight:600">
                💾 SAVE RESTORE POINT
            </button>
            <button onclick="SystemReset()" style="background:#111; border:1px solid #333; color:var(--red); padding:10px 15px; border-radius:8px; font-size:0.75rem; cursor:pointer; font-family:'JetBrains Mono'; font-weight:600">
                ⚠ SYSTEM RESET
            <button onclick="ForceUpdate()" style="background:#111; border:1px solid #d4af37; color:#d4af37; padding:10px 15px; border-radius:8px; font-size:0.75rem; cursor:pointer; font-family:'JetBrains Mono'; font-weight:600">
                ⚡ UPDATE APP
</button>
        </div>
    </div>

    <script src="common.js"></script>

    <script>
      // 1. ЧАСЫ
    function updateClock() {
        const now = new Date();
        document.getElementById('clock-time').innerText = now.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
        document.getElementById('clock-date').innerText = now.toLocaleDateString('uk-UA', {weekday:'long', day:'numeric', month:'long'});
    }
    setInterval(updateClock, 1000); updateClock();

    // 2. ГЛОБАЛЬНЫЙ БЭКАП (СКАЧАТЬ)
    function GlobalBackup() {
        // Я исправил ключи на те, которые реально используются в твоих файлах:
        const bundle = {
            date: new Date().toISOString(),
            pharm: JSON.parse(localStorage.getItem('gold_protocol_data') || 'null'), // Исправлено под pharm.html
            training: JSON.parse(localStorage.getItem('train_data') || 'null'),       // Исправлено под training.html
            nutrition: JSON.parse(localStorage.getItem('nutrition_data') || 'null')   // Исправлено под nutrition.html
        };

        const a = document.createElement('a');
        a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bundle));
        a.download = `ManagerOS_Backup_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // 3. ЛОГИКА ВОССТАНОВЛЕНИЯ
    const fileInput = document.getElementById('restore-input');
    
    // Клик по кнопке вызывает скрытый инпут
    document.getElementById('restore-btn').onclick = () => {
        // Если забыл добавить input в HTML, создадим его на лету, чтобы не было ошибок
        if (!fileInput) {
            alert('Ошибка: Не добавлен <input id="restore-input"> в HTML коде!');
            return;
        }
        fileInput.click();
    };

    if (fileInput) {
        fileInput.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    let count = 0;

                    // Раскладываем данные по правильным полочкам
                    if(data.pharm) { localStorage.setItem('gold_protocol_data', JSON.stringify(data.pharm)); count++; }
                    if(data.training) { localStorage.setItem('train_data', JSON.stringify(data.training)); count++; }
                    if(data.nutrition) { localStorage.setItem('nutrition_data', JSON.stringify(data.nutrition)); count++; }

                    if (count > 0) {
                        alert(`✅ Восстановлено модулей: ${count}`);
                        location.reload();
                    } else {
                        alert("⚠️ В файле нет данных Manager OS.");
                    }
                } catch (err) {
                    alert("❌ Ошибка чтения файла: " + err);
                }
            };
            reader.readAsText(file);
        };
    }

    // 4. ПОЛНАЯ ОЧИСТКА (WIPE)
    function FullWipe() {
        if(confirm("⚠ ВНИМАНИЕ: Это удалит ВСЕ данные приложения!\nПродолжить?")) {
            localStorage.clear();
            indexedDB.deleteDatabase("GoldProtocolDB"); // Удаляем базу фото
            alert("♻️ Система очищена.");
            location.reload();
        }
    }
// Оновлена реєстрація
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => reg.update());
    });
}

// Функція примусового оновлення
function ForceUpdate() {
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) registration.unregister();
            caches.keys().then((names) => {
                for (let name of names) caches.delete(name);
            });
            alert("Оновлення завантажено! Перезавантажую...");
            window.location.reload(true);
        });
    } else {
        window.location.reload(true);
    }
}
    </script>
</body>

</html>
