<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROTOCOL MANAGER</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root { 
            --bg: #050505; 
            --card-bg: rgba(18, 18, 18, 0.6); 
            --border: #2a2a2a; 
            --gold: #d4af37; 
            --blue: #3b82f6; 
            --green: #10b981; 
            --red: #ef4444;
            --text: #f4f4f5; 
            --text-dim: #a1a1aa; 
        }
        
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }

        body { 
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 60%);
            color: var(--text); 
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 15px; 
            min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; 
            overflow-x: hidden;
        }

        .hub-container { width: 100%; max-width: 450px; margin-top: 10px; }
        
        /* --- HEADER --- */
        header { 
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 10px 5px; margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            animation: slideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .sys-status-left {
            display: flex; align-items: center; gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem; color: #fff; letter-spacing: 1.5px; font-weight: 700;
        }

        .status-dot {
            width: 8px; height: 8px; background-color: var(--green); border-radius: 50%;
            box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite;
        }

        .sys-status-right { text-align: right; font-family: 'JetBrains Mono', monospace; }
        .sys-time { font-size: 1.2rem; font-weight: 700; color: #fff; letter-spacing: 1px; }
        .sys-date { font-size: 0.6rem; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; }

        /* --- VITALS DASHBOARD (Заміна кілець) --- */
        .vitals-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
            animation: fadeIn 1s ease 0.2s backwards;
        }

        .vital-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px 5px;
            text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Кольорові акценти зверху карток */
        .vital-train { border-top: 3px solid var(--blue); }
        .vital-food { border-top: 3px solid var(--green); }
        .vital-pharm { border-top: 3px solid var(--gold); }

        .vital-icon { font-size: 1.4rem; opacity: 0.9; margin-bottom: 2px; }
        
        .vital-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem; font-weight: 700; color: #fff;
            letter-spacing: 0.5px;
        }
        
        .vital-sub {
            font-size: 0.6rem; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 0.5px;
            line-height: 1.2;
        }

        /* --- CARDS GRID (Швидкий доступ) --- */
        .app-grid { display: grid; gap: 12px; width: 100%; }
        
        .app-card { 
            background: var(--card-bg); backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05); padding: 16px; border-radius: 14px; 
            text-decoration: none; display: flex; align-items: center; gap: 15px; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; 
            animation: fadeInUp 0.6s ease backwards;
        }

        .app-card:nth-child(1) { animation-delay: 0.3s; }
        .app-card:nth-child(2) { animation-delay: 0.4s; }
        .app-card:nth-child(3) { animation-delay: 0.5s; }

        .app-card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.03); }
        .app-card:active { transform: scale(0.98); }
        
        .icon-box { 
            width: 45px; height: 45px; border-radius: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; 
            font-size: 20px; background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s;
        }
        
        .info h3 { margin: 0; font-size: 0.95rem; color: #fff; letter-spacing: 0.5px; font-weight: 600; }
        .info p { margin: 3px 0 0; font-size: 0.65rem; color: var(--text-dim); font-weight: 400; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .card-pharm:hover { border-color: rgba(212, 175, 55, 0.4); } 
        .card-pharm:hover .icon-box { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }

        .card-train:hover { border-color: rgba(59, 130, 246, 0.4); } 
        .card-train:hover .icon-box { color: var(--blue); border-color: var(--blue); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }

        .card-nutri:hover { border-color: rgba(16, 185, 129, 0.4); } 
        .card-nutri:hover .icon-box { color: var(--green); border-color: var(--green); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }

        /* --- BUTTONS --- */
        .ctrl-btn {
            background: rgba(0,0,0,0.4); border: 1px solid #333; padding: 12px 20px; border-radius: 8px;
            font-size: 0.7rem; cursor: pointer; font-family: 'JetBrains Mono'; font-weight: 600;
            transition: 0.2s; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(4px);
        }
        .btn-save { color: var(--green); }
        .btn-save:hover { background: rgba(16, 185, 129, 0.1); border-color: var(--green); }
        
        .btn-reset { color: var(--red); }
        .btn-reset:hover { background: rgba(239, 68, 68, 0.1); border-color: var(--red); }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); opacity: 1; } 50% { opacity: 0.8; } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div class="hub-container">
        
        <header>
            <div class="sys-status-left">
                <div class="status-dot"></div>
                <span>PROTOCOL MANAGER</span>
            </div>
            <div class="sys-status-right">
                <div class="sys-time" id="clock-time">00:00</div>
                <div class="sys-date" id="clock-date">LOADING...</div>
            </div>
        </header>

        <div class="vitals-grid">
            <div class="vital-card vital-train">
                <div class="vital-icon">⚖️</div>
                <div class="vital-val" id="vital-train-val">--</div>
                <div class="vital-sub" id="vital-train-sub">Завантаження</div>
            </div>
            <div class="vital-card vital-food">
                <div class="vital-icon">🥑</div>
                <div class="vital-val" id="vital-food-val">-- KCAL</div>
                <div class="vital-sub" id="vital-food-sub">Б:0 Ж:0 В:0</div>
            </div>
            <div class="vital-card vital-pharm">
                <div class="vital-icon">🏆</div>
                <div class="vital-val" id="vital-pharm-val">--</div>
                <div class="vital-sub" id="vital-pharm-sub">Оновлення</div>
            </div>
        </div>

        <div class="app-grid">
            <a href="pharm.html" class="app-card card-pharm">
                <div class="icon-box">🏆</div>
                <div class="info"><h3>Фармакологія</h3><p>Протокол • Аналізи • Аптечка</p></div>
            </a>
            <a href="training.html" class="app-card card-train">
                <div class="icon-box">⚖️</div>
                <div class="info"><h3>Тренування</h3><p>Журнал • Програми • Статистика</p></div>
            </a>
            <a href="nutrition.html" class="app-card card-nutri">
                <div class="icon-box">🥑</div>
                <div class="info"><h3>Харчування</h3><p>КБЖУ • Раціон • Продукти</p></div>
            </a>
        </div>
        
        <div style="margin-top: 40px; text-align: center; color: #333; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 2px; margin-bottom: 15px;">SYSTEM CONTROL</div>

        <div style="display:flex; gap:15px; justify-content:center;">
            <button onclick="CreateRestorePoint()" class="ctrl-btn btn-save">💾 BACKUP</button>
            <button onclick="SystemReset()" class="ctrl-btn btn-reset">⚠ WIPE ALL</button>
        </div>
        
        <div id="last-backup" style="margin-top: 15px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: #555;">NO DATA FOUND</div>
    </div>

<script>
        // Годинник
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('clock-date').innerText = now.toLocaleDateString('uk-UA', {weekday:'short', day:'2-digit', month:'2-digit'});
        }
        setInterval(updateClock, 1000); 

        // --- ЛОГІКА ЗЧИТУВАННЯ СТАТУСУ ---
        function fetchSystemVitals() {
            // 1. ТРЕНУВАННЯ (Зчитуємо поточну фазу)
            let trainText = "ПУСТО";
            let trainSub = "Додайте тиждень";
            try {
                const tr = JSON.parse(localStorage.getItem('training_protocol'));
                if (tr && tr.weeks && tr.weeks.length > 0) {
                    const lastWeek = tr.weeks[tr.weeks.length - 1]; // Беремо останній створений тиждень
                    trainText = lastWeek.type === 'mass' ? 'МАСА' : 'СУШКА';
                    trainSub = `Тиждень ${lastWeek.num}`;
                }
            } catch(e){}

            // 2. ХАРЧУВАННЯ (Зчитуємо КБЖУ монодієти з першого дня)
            let foodText = "0 KCAL";
            let foodSub = "Б:0 Ж:0 В:0";
            try {
                // Перевіряємо всі можливі ключі бази
                const nu = JSON.parse(localStorage.getItem('protocol_sys_plus_days') || localStorage.getItem('nutrition_protocol') || localStorage.getItem('nutrition_sys'));
                if (nu && nu.days && nu.days.length > 0) {
                    const day = nu.days[0]; // Монодієта = читаємо лише 1-й день
                    let p=0, f=0, c=0, kcal=0;
                    if (day.meals) {
                        day.meals.forEach(m => {
                            if (m.foods) {
                                m.foods.forEach(item => {
                                    const w = parseFloat(item.w)||0;
                                    p += (parseFloat(item.p)||0) * w / 100;
                                    f += (parseFloat(item.f)||0) * w / 100;
                                    c += (parseFloat(item.c)||0) * w / 100;
                                    kcal += (parseFloat(item.kcal)||0) * w / 100;
                                });
                            }
                        });
                    }
                    if (kcal > 0) {
                        foodText = Math.round(kcal) + " KCAL";
                        foodSub = `Б:${Math.round(p)} Ж:${Math.round(f)} В:${Math.round(c)}`;
                    } else {
                        foodText = "ПУСТО";
                        foodSub = "Додайте їжу";
                    }
                }
            } catch(e){}

            // 3. ФАРМАКОЛОГІЯ (Кількість препаратів і залишки)
            let pharmText = "ПУСТО";
            let pharmSub = "Створіть базу";
            try {
                const ph = JSON.parse(localStorage.getItem('gold_protocol') || localStorage.getItem('pharm_protocol') || localStorage.getItem('pharmacy_sys'));
                if (ph && ph.pharmacy) {
                    let itemsCount = 0;
                    let lowStock = 0;
                    ph.pharmacy.forEach(cat => {
                        if(cat.items) {
                            cat.items.forEach(i => {
                                itemsCount++;
                                const stockNum = parseInt(i.stock);
                                if(!isNaN(stockNum) && stockNum <= 10 && stockNum > 0) lowStock++;
                            });
                        }
                    });
                    
                    if (itemsCount > 0) {
                        pharmText = `${itemsCount} ПОЗИЦІЙ`;
                        pharmSub = lowStock > 0 ? `⚠️ ${lowStock} закінчується` : "Запаси в нормі";
                    }
                }
            } catch(e){}

            // Оновлюємо DOM
            document.getElementById('vital-train-val').innerText = trainText;
            document.getElementById('vital-train-sub').innerText = trainSub;
            
            document.getElementById('vital-food-val').innerText = foodText;
            document.getElementById('vital-food-sub').innerText = foodSub;
            
            document.getElementById('vital-pharm-val').innerText = pharmText;
            document.getElementById('vital-pharm-sub').innerText = pharmSub;
        }

        // --- БЕКАП ЛОГІКА ---
        const APP_KEYS = ['gold_protocol', 'training_protocol', 'protocol_sys_plus_days'];

        function CreateRestorePoint() {
            if(!confirm("Створити резервну копію (Backup)?")) return;
            let savedCount = 0;
            APP_KEYS.forEach(k => {
                const d = localStorage.getItem(k);
                if(d) { localStorage.setItem(k + '_backup', d); savedCount++; }
            });
            const now = new Date().toLocaleString('uk-UA');
            localStorage.setItem('backup_timestamp', now);
            updateBackupLabel();
            alert(savedCount > 0 ? "Успішно збережено в пам'ять пристрою!" : "Система пуста. Немає чого зберігати.");
        }

        function updateBackupLabel() {
            const ts = localStorage.getItem('backup_timestamp');
            const el = document.getElementById('last-backup');
            if(ts) { el.innerText = "LAST BACKUP: " + ts; el.style.color = "var(--green)"; } 
            else { el.innerText = "NO BACKUP FOUND"; el.style.color = "#555"; }
        }

        function SystemReset() {
            const hasBackup = APP_KEYS.some(k => localStorage.getItem(k + '_backup'));
            if(hasBackup) {
                if(prompt("1 - ВІДНОВИТИ з Backup\n2 - ВИДАЛИТИ ВСІ ДАНІ (Wipe All)\nВведіть цифру:", "1") === '1') {
                    APP_KEYS.forEach(k => { const b = localStorage.getItem(k + '_backup'); if(b) localStorage.setItem(k, b); });
                    alert("Систему успішно відновлено!"); location.reload();
                } else if(confirm("Ви точно хочете видалити ВСІ дані назавжди?")) FullWipe();
            } else {
                if(confirm("Резервних копій немає. Точно очистити додаток?")) FullWipe();
            }
        }

        function FullWipe() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            updateClock();
            updateBackupLabel();
            fetchSystemVitals(); // Підтягуємо дані з інших модулів
        };
    </script>
</body>
</html>
