<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROTOCOL MANAGER</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap');

        :root { 
            --bg: #030303; 
            --card-bg: rgba(20, 20, 22, 0.85); 
            --border: rgba(255, 255, 255, 0.08); 
            --gold: #d4af37; 
            --blue: #3b82f6; 
            --green: #10b981; 
            --red: #ef4444;
            --text-main: #ffffff; 
            --text-dim: #888888; 
            --text-dark: #555555;
        }
        
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg);
            /* Багатошаровий насичений фон: радіальний градієнт + сітка для глибини */
            background-image: 
                radial-gradient(circle at 50% -20%, #1a1a1a 0%, #030303 70%),
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            background-position: center top;
            color: var(--text-main); 
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 20px 15px; 
            min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow-x: hidden;
        }

        .hub-container { 
            width: 100%; max-width: 450px; 
            display: flex; flex-direction: column;
            margin: auto 0; 
        }
        
        /* --- HEADER --- */
        header { 
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding-bottom: 20px; margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            position: relative;
            animation: slideDown 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Декоративна лінія під хедером */
        header::after {
            content: ''; position: absolute; bottom: -1px; left: 0;
            width: 30%; height: 1px; background: linear-gradient(90deg, var(--green), transparent);
        }

        .sys-status-left {
            display: flex; align-items: center; gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem; color: #fff; letter-spacing: 1.5px; font-weight: 700;
        }

        .status-dot {
            width: 8px; height: 8px; background-color: var(--green); border-radius: 50%;
            box-shadow: 0 0 12px var(--green); animation: pulse 2s infinite;
        }

        .sys-status-right { text-align: right; font-family: 'JetBrains Mono', monospace; }
        .sys-time { font-size: 1.4rem; font-weight: 800; color: #fff; letter-spacing: 1px; line-height: 1; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .sys-date { font-size: 0.65rem; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }

        /* --- SMART CARDS --- */
        .nav-grid { display: flex; flex-direction: column; gap: 16px; width: 100%; }
        
        .smart-card {
            background: linear-gradient(145deg, rgba(25, 25, 28, 0.9) 0%, rgba(10, 10, 12, 0.95) 100%);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px 20px;
            text-decoration: none;
            display: flex; align-items: center; gap: 20px;
            position: relative; overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: fadeInUp 0.6s ease backwards;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        /* Бічна товста лінія кольору */
        .smart-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: #333; transition: 0.3s;
        }
        
        .card-pharm::before { background: var(--gold); box-shadow: 0 0 15px var(--gold); }
        .card-train::before { background: var(--blue); box-shadow: 0 0 15px var(--blue); }
        .card-nutri::before { background: var(--green); box-shadow: 0 0 15px var(--green); }

        .smart-card:nth-child(1) { animation-delay: 0.1s; }
        .smart-card:nth-child(2) { animation-delay: 0.2s; }
        .smart-card:nth-child(3) { animation-delay: 0.3s; }

        /* Насичені градієнтні іконки */
        .icon-box { 
            width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; 
            font-size: 26px; border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.3s ease;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.6);
        }
        
        /* БАЗОВІ ВІДТІНКИ ІКОНОК */
        .card-pharm .icon-box { color: var(--gold); border-color: rgba(212,175,55,0.3); }
        .card-train .icon-box { color: var(--blue); border-color: rgba(59,130,246,0.3); }
        .card-nutri .icon-box { color: var(--green); border-color: rgba(16,185,129,0.3); }

        /* --- HOVER & ACTIVE (ЕФЕКТИ ПРОТИСКАННЯ ТА ГРАДІЄНТИ) --- */
        @media (hover: hover) {
            .card-pharm:hover { 
                background: linear-gradient(145deg, rgba(212,175,55,0.15) 0%, rgba(10,10,12,0.95) 100%);
                border-color: rgba(212,175,55,0.4); transform: translateY(-3px); box-shadow: 0 12px 35px rgba(212,175,55,0.15);
            }
            .card-train:hover { 
                background: linear-gradient(145deg, rgba(59,130,246,0.15) 0%, rgba(10,10,12,0.95) 100%);
                border-color: rgba(59,130,246,0.4); transform: translateY(-3px); box-shadow: 0 12px 35px rgba(59,130,246,0.15);
            }
            .card-nutri:hover { 
                background: linear-gradient(145deg, rgba(16,185,129,0.15) 0%, rgba(10,10,12,0.95) 100%);
                border-color: rgba(16,185,129,0.4); transform: translateY(-3px); box-shadow: 0 12px 35px rgba(16,185,129,0.15);
            }
        }
        
        /* ACTIVE СТАН (Для мобільних та кліків) */
        .card-pharm:active { 
            background: linear-gradient(145deg, rgba(212,175,55,0.2) 0%, rgba(20,20,22,0.95) 100%);
            border-color: var(--gold); transform: scale(0.96); 
        }
        .card-train:active { 
            background: linear-gradient(145deg, rgba(59,130,246,0.2) 0%, rgba(20,20,22,0.95) 100%);
            border-color: var(--blue); transform: scale(0.96); 
        }
        .card-nutri:active { 
            background: linear-gradient(145deg, rgba(16,185,129,0.2) 0%, rgba(20,20,22,0.95) 100%);
            border-color: var(--green); transform: scale(0.96); 
        }

        .smart-card:active .icon-box { transform: scale(0.9) rotate(-5deg); box-shadow: 0 0 20px currentColor; }
        
        .info { flex-grow: 1; }
        .info h3 { margin: 0; font-size: 1.15rem; color: #fff; letter-spacing: 0.5px; font-weight: 700; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        .info-data { 
            margin-top: 8px; font-family: 'JetBrains Mono', monospace; 
            font-size: 0.75rem; color: var(--text-dim); 
            letter-spacing: 0.5px; line-height: 1.5;
            display: flex; flex-direction: column; gap: 5px;
        }
        
        .data-row { display: flex; align-items: center; gap: 8px; }
        .data-hl { color: #fff; font-weight: 700; }
        .data-lbl { color: var(--text-dark); }

        /* --- БЛОК VITALS ТА КНОПКИ --- */
        .bottom-wrapper {
            margin-top: 40px; 
            width: 100%;
            animation: fadeIn 1s ease 0.5s backwards;
        }

        .vitals-strip {
            display: flex; justify-content: space-between;
            margin-bottom: 25px; padding: 18px 20px;
            background: linear-gradient(to bottom, rgba(20, 20, 25, 0.8), rgba(10, 10, 12, 0.95));
            border: 1px solid var(--border);
            border-radius: 18px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        /* Декоративний елемент всередині віталів */
        .vitals-strip::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 50%; height: 1px; background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 100%);
        }
        
        .v-item { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 2; }
        .v-item.right { text-align: right; align-items: flex-end; }
        
        .v-label { 
            font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; 
            color: var(--text-dim); letter-spacing: 1.5px; font-weight: 700; 
            display: flex; align-items: center; gap: 6px;
        }
        
        .v-val { 
            font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; 
            color: #fff; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        .v-val span { font-size: 0.75rem; color: var(--text-dim); font-weight: 600; letter-spacing: 1px; margin-left: 2px;}

        .sys-control-title {
            text-align: center; color: #555; 
            font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; 
            letter-spacing: 4px; margin-bottom: 15px; font-weight: 800;
        }

        /* --- КНОПКИ БЕКАПУ ТА СКИДАННЯ --- */
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .ctrl-btn {
            background: linear-gradient(to bottom, rgba(25, 25, 28, 0.9), rgba(15, 15, 17, 0.95)); 
            border: 1px solid rgba(255,255,255,0.05); 
            padding: 16px; border-radius: 14px;
            font-size: 0.75rem; cursor: pointer; 
            font-family: 'JetBrains Mono', monospace; font-weight: 700;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            letter-spacing: 1px; color: var(--text-dim);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* ГРАДІЄНТИ І РАМКИ ПРИ НАВЕДЕННІ/НАТИСКАННІ */
        @media (hover: hover) {
            .btn-save:hover { 
                border-color: var(--green); 
                background: linear-gradient(to bottom, rgba(16, 185, 129, 0.15), rgba(15, 15, 17, 0.95));
                color: var(--green);
                box-shadow: 0 5px 20px rgba(16, 185, 129, 0.2);
            }
            .btn-reset:hover { 
                border-color: var(--red); 
                background: linear-gradient(to bottom, rgba(239, 68, 68, 0.15), rgba(15, 15, 17, 0.95));
                color: var(--red);
                box-shadow: 0 5px 20px rgba(239, 68, 68, 0.2);
            }
        }
        
        /* ACTIVE СТАН (Щоб не залипало на iOS) */
        .btn-save:active { 
            border-color: var(--green); color: var(--green); font-weight: 800;
            background: rgba(16, 185, 129, 0.2); transform: scale(0.95); 
        }
        .btn-reset:active { 
            border-color: var(--red); color: var(--red); font-weight: 800;
            background: rgba(239, 68, 68, 0.2); transform: scale(0.95); 
        }

        .last-backup {
            margin-top: 18px; text-align: center; font-family: 'JetBrains Mono', monospace; 
            font-size: 0.65rem; color: var(--text-dark); letter-spacing: 1px;
        }

        @keyframes pulse { 0% { opacity: 1; box-shadow: 0 0 12px var(--green); } 50% { opacity: 0.4; box-shadow: 0 0 2px var(--green); } 100% { opacity: 1; box-shadow: 0 0 12px var(--green); } }
        @keyframes slideDown { from { transform: translateY(-15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="hub-container">
        
        <header>
            <div class="sys-status-left">
                <div class="status-dot"></div>
                <span>PROTOCOL MANAGER</span>
            </div>
            <div class="sys-status-right">
                <div class="sys-time" id="clock-time">00:00</div>
                <div class="sys-date" id="clock-date">-- --</div>
            </div>
        </header>

        <div class="nav-grid">
            
            <a href="pharm.html" class="smart-card card-pharm">
                <div class="icon-box">🏆</div>
                <div class="info">
                    <h3>Фармакологія</h3>
                    <div class="info-data" id="data-pharm">
                        <span class="data-lbl">ЗАВАНТАЖЕННЯ...</span>
                    </div>
                </div>
            </a>
            
            <a href="training.html" class="smart-card card-train">
                <div class="icon-box">⚖️</div>
                <div class="info">
                    <h3>Тренування</h3>
                    <div class="info-data" id="data-train">
                        <span class="data-lbl">ЗАВАНТАЖЕННЯ...</span>
                    </div>
                </div>
            </a>
            
            <a href="nutrition.html" class="smart-card card-nutri">
                <div class="icon-box">🥑</div>
                <div class="info">
                    <h3>Харчування</h3>
                    <div class="info-data" id="data-nutri">
                        <span class="data-lbl">ЗАВАНТАЖЕННЯ...</span>
                    </div>
                </div>
            </a>
            
        </div>
        
        <div class="bottom-wrapper">
            
            <div class="vitals-strip">
                <div class="v-item">
                    <span class="v-label">CURRENT WEIGHT</span>
                    <span class="v-val" id="vital-weight">--.--<span>KG</span></span>
                </div>
                <div class="v-item right">
                    <span class="v-label" style="color: var(--red);">
                        <svg viewBox="0 0 100 20" style="width: 20px; height: 10px; stroke: var(--red); fill: none; stroke-width: 3;">
                            <path d="M0,10 L20,10 L30,0 L40,20 L50,10 L100,10" />
                        </svg>
                        BLOOD PRESSURE
                    </span>
                    <span class="v-val" id="vital-bp">--/--</span>
                </div>
            </div>

            <div class="sys-control-title">SYSTEM CONTROL</div>

            <div class="controls-grid">
                <button onclick="CreateRestorePoint()" class="ctrl-btn btn-save">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    BACKUP
                </button>
                <button onclick="SystemReset()" class="ctrl-btn btn-reset">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    WIPE ALL
                </button>
            </div>
            
            <div id="last-backup" class="last-backup">NO BACKUP FOUND</div>
        </div>
    </div>

<script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('clock-date').innerText = now.toLocaleDateString('uk-UA', {weekday:'short', day:'2-digit', month:'2-digit'});
        }
        setInterval(updateClock, 1000); 

        function getDayMacros(day, bank) {
            let p=0, f=0, c=0, kcal=0;
            if (day && day.meals) {
                day.meals.forEach(m => {
                    if (m.foods) {
                        m.foods.forEach(item => {
                            const ref = bank[item.n];
                            if (ref) {
                                const ratio = ref.unit ? parseFloat(item.w) : parseFloat(item.w) / 100;
                                p += (parseFloat(ref.p)||0) * ratio;
                                f += (parseFloat(ref.f)||0) * ratio;
                                c += (parseFloat(ref.c)||0) * ratio;
                                kcal += (parseFloat(ref.k)||0) * ratio;
                            } else {
                                p += parseFloat(item.p)||0;
                                f += parseFloat(item.f)||0;
                                c += parseFloat(item.c)||0;
                                kcal += parseFloat(item.k)||0;
                            }
                        });
                    }
                });
            }
            return { p: Math.round(p), f: Math.round(f), c: Math.round(c), kcal: Math.round(kcal) };
        }

        function populateSmartCards() {
            // 1. ФАРМАКОЛОГІЯ ТА ПОКАЗНИКИ (ВАГА, ТИСК)
            try {
                const ph = JSON.parse(localStorage.getItem('gold_protocol'));
                if (ph) {
                    if (ph.schedule && ph.startDate) {
                        const startDate = new Date(ph.startDate);
                        const now = new Date();
                        const day = startDate.getDay();
                        const diff = startDate.getDate() - day + (day === 0 ? -6 : 1);
                        const startMonday = new Date(startDate.setDate(diff));
                        startMonday.setHours(0,0,0,0);
                        
                        const diffTime = now.getTime() - startMonday.getTime();
                        let currentWeek = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7)) + 1;
                        
                        const maxW = Math.max(...Object.keys(ph.schedule).map(Number));
                        if (currentWeek < 1) currentWeek = 1;
                        if (currentWeek > maxW) currentWeek = maxW;

                        let phaseTitle = "Курс";
                        if (ph.phases) {
                            const currentPhase = ph.phases.find(p => p.weeks.includes(currentWeek));
                            if (currentPhase) phaseTitle = currentPhase.title;
                        }
                        
                        document.getElementById('data-pharm').innerHTML = `
                            <div class="data-row"><span class="data-lbl">ФАЗА:</span> <span class="data-hl" style="color:var(--gold)">${phaseTitle.toUpperCase()}</span></div>
                            <div class="data-row"><span class="data-lbl">ТИЖДЕНЬ:</span> <span class="data-hl">${currentWeek}</span></div>
                        `;
                    }

                    if(ph.vitals) {
                        let latestW = "--.--<span>KG</span>", latestBP = "--/--";
                        const keys = Object.keys(ph.vitals).sort((a,b) => {
                            const [wA, dA] = a.split('-').map(Number);
                            const [wB, dB] = b.split('-').map(Number);
                            if(wA !== wB) return wB - wA;
                            return dB - dA;
                        });
                        
                        for(let key of keys) {
                            if(ph.vitals[key].w && latestW.includes("--")) latestW = ph.vitals[key].w + "<span>KG</span>";
                            if(ph.vitals[key].bp && latestBP === "--/--") latestBP = ph.vitals[key].bp;
                            if(!latestW.includes("--") && latestBP !== "--/--") break;
                        }
                        
                        document.getElementById('vital-weight').innerHTML = latestW;
                        document.getElementById('vital-bp').innerHTML = latestBP;
                    }
                }
            } catch(e){}

            // 2. ТРЕНУВАННЯ
            try {
                const tr = JSON.parse(localStorage.getItem('training_protocol'));
                if (tr && tr.weeks && tr.weeks.length > 0) {
                    const lastWeek = tr.weeks[tr.weeks.length - 1]; 
                    const progName = tr.currentProgram === 'arms' ? 'РУКИ' : 'ЗБАЛАНСОВАНА';
                    const typeName = lastWeek.type === 'mass' ? 'МАСА' : 'СУШКА';
                    document.getElementById('data-train').innerHTML = `
                        <div class="data-row"><span class="data-lbl">ПЛАН:</span> <span class="data-hl" style="color:var(--blue)">${progName}</span></div>
                        <div class="data-row"><span class="data-lbl">ЕТАП:</span> <span class="data-hl">${typeName} (W${lastWeek.num})</span></div>
                    `;
                }
            } catch(e){}

            // 3. ХАРЧУВАННЯ
            try {
                const nu = JSON.parse(localStorage.getItem('protocol_sys_plus_days'));
                if (nu && nu.days) {
                    const bank = nu.bank || {}; 
                    let htmlContent = '';
                    
                    if (nu.days[0]) {
                        const d1 = getDayMacros(nu.days[0], bank);
                        if(d1.kcal > 0) {
                            htmlContent += `<div class="data-row"><span class="data-lbl" style="color:var(--green)">[T]</span> <span class="data-hl">${d1.kcal}</span> <span class="data-lbl">KCAL</span> <span class="data-lbl" style="margin-left:auto">Б${d1.p} Ж${d1.f} В${d1.c}</span></div>`;
                        }
                    }
                    
                    if (nu.days[1]) {
                        const d2 = getDayMacros(nu.days[1], bank);
                        if(d2.kcal > 0) {
                            htmlContent += `<div class="data-row"><span class="data-lbl" style="color:var(--green)">[R]</span> <span class="data-hl">${d2.kcal}</span> <span class="data-lbl">KCAL</span> <span class="data-lbl" style="margin-left:auto">Б${d2.p} Ж${d2.f} В${d2.c}</span></div>`;
                        }
                    }
                    
                    if (htmlContent !== '') {
                        document.getElementById('data-nutri').innerHTML = htmlContent;
                    } else {
                        document.getElementById('data-nutri').innerHTML = `<span class="data-lbl">РАЦІОН ПОРОЖНІЙ</span>`;
                    }
                }
            } catch(e){}
        }

        const APP_KEYS = ['gold_protocol', 'training_protocol', 'protocol_sys_plus_days'];

        function CreateRestorePoint() {
            if(!confirm("Створити резервну копію (Backup)?")) return;
            let savedCount = 0;
            APP_KEYS.forEach(k => {
                const d = localStorage.getItem(k);
                if(d) { localStorage.setItem(k + '_backup', d); savedCount++; }
            });
            const now = new Date().toLocaleString('uk-UA');
            localStorage.setItem('backup_timestamp', now);
            updateBackupLabel();
        }

        function updateBackupLabel() {
            const ts = localStorage.getItem('backup_timestamp');
            const el = document.getElementById('last-backup');
            if(ts) { el.innerText = "LAST BACKUP: " + ts; el.style.color = "var(--green)"; } 
            else { el.innerText = "NO BACKUP FOUND"; el.style.color = "var(--text-dark)"; }
        }

        function SystemReset() {
            const hasBackup = APP_KEYS.some(k => localStorage.getItem(k + '_backup'));
            if(hasBackup) {
                const choice = prompt("1 - ВІДНОВИТИ з Backup\n2 - ВИДАЛИТИ ВСІ ДАНІ (Wipe All)\nВведіть цифру:", "1");
                if (choice === '1') {
                    APP_KEYS.forEach(k => { const b = localStorage.getItem(k + '_backup'); if(b) localStorage.setItem(k, b); });
                    alert("Систему успішно відновлено!"); location.reload();
                } else if (choice === '2') {
                    if(confirm("Ви точно хочете видалити ВСІ дані назавжди?")) FullWipe();
                }
            } else {
                if(confirm("Резервних копій немає. Точно очистити додаток?")) FullWipe();
            }
        }

        function FullWipe() { localStorage.clear(); location.reload(); }

        document.addEventListener('click', (e) => {
            if (e.target.closest('.smart-card') || e.target.closest('.ctrl-btn')) {
                if(navigator.vibrate) navigator.vibrate(10);
            }
        });

        window.onload = () => {
            updateClock();
            updateBackupLabel();
            populateSmartCards(); 
        };
    </script>
</body>
</html>
