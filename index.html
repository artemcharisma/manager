<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAGER OS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Manager OS">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/style.css">

    <style>
        /* Унікальні стилі для HUB (index.html) */
        :root { 
            --bg: #050505; 
            --card: #121212; 
            --border: #2a2a2a; 
            --gold: #d4af37; 
            --blue: #3b82f6; 
            --green: #10b981; 
            --text: #f4f4f5; 
            --text-dim: #a1a1aa; 
        }
        
        /* Специфічне центрування для головної сторінки */
        body { 
            background: var(--bg); 
            color: var(--text); 
            /* font-family вже в style.css */
            margin: 0; padding: 20px; 
            min-height: 100vh; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
        }

        .hub-container { width: 100%; max-width: 500px; animation: fadeIn 0.8s ease; }
        
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-family: 'JetBrains Mono', monospace; font-size: 2rem; margin: 0; letter-spacing: -1px; }
        .subtitle { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px; margin-top: 5px; }
        
        /* WIDGET CLOCK */
        .sys-widget { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 25px; text-align: center; font-family: 'JetBrains Mono', monospace; }
        .time { font-size: 1.8rem; font-weight: 700; color: #fff; letter-spacing: 2px; }
        .date { font-size: 0.8rem; color: var(--gold); text-transform: uppercase; margin-top: 5px; }

        .app-grid { display: grid; gap: 15px; }
        .app-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; text-decoration: none; display: flex; align-items: center; gap: 20px; transition: 0.3s; position: relative; overflow: hidden; }
        .app-card:hover { transform: translateY(-3px); border-color: #444; }
        .app-card:active { transform: scale(0.98); }
        
        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); }
        .info h3 { margin: 0; font-size: 1.1rem; color: #fff; }
        .info p { margin: 4px 0 0; font-size: 0.8rem; color: var(--text-dim); }
        
        .card-pharm:hover { border-color: var(--gold); } .card-pharm .icon-box { color: var(--gold); }
        .card-nutri:hover { border-color: var(--green); } .card-nutri .icon-box { color: var(--green); }
        .card-train:hover { border-color: var(--blue); } .card-train .icon-box { color: var(--blue); }
        
        @keyframes fadeIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }
    </style>
</head>
<body>
    <div class="hub-container">
        <header>
            <h1>MANAGER OS</h1>
            <div class="subtitle">PROTOCOL MANAGEMENT</div>
        </header>

        <div class="sys-widget">
            <div class="time" id="clock-time">00:00</div>
            <div class="date" id="clock-date">LOADING...</div>
        </div>

        <div class="app-grid">
            <a href="pharm.html" class="app-card card-pharm">
                <div class="icon-box">🏆</div>
                <div class="info"><h3>Здоров'я</h3><p>Gold Protocol • Курс • Аналізи</p></div>
            </a>
            <a href="training.html" class="app-card card-train">
                <div class="icon-box">⚖️</div>
                <div class="info"><h3>Тренування</h3><p>Training • Mass • Cut</p></div>
            </a>
            <a href="nutrition.html" class="app-card card-nutri">
                <div class="icon-box">🥑</div>
                <div class="info"><h3>Харчування</h3><p>Макроси • База продуктів</p></div>
            </a>
        </div>
        
        <div style="margin-top: 40px; text-align: center; color: #333; font-size: 0.7rem; font-family: 'JetBrains Mono'">SYSTEM CONTROL</div>

        <div style="margin-top: 20px; display:flex; gap:10px; justify-content:center;">
            <button onclick="CreateRestorePoint()" style="background:#111; border:1px solid #333; color:#10b981; padding:10px 15px; border-radius:8px; font-size:0.75rem; cursor:pointer; font-family:'JetBrains Mono'; font-weight:600">
                💾 SAVE RESTORE POINT
            </button>
            <button onclick="SystemReset()" style="background:#111; border:1px solid #333; color:#ef4444; padding:10px 15px; border-radius:8px; font-size:0.75rem; cursor:pointer; font-family:'JetBrains Mono'; font-weight:600">
                ⚠ SYSTEM RESET
            </button>
        </div>
        
        <div id="last-backup" style="margin-top: 10px; text-align: center; font-family: 'JetBrains Mono'; font-size: 0.65rem; color: #666;">
            NO RESTORE POINT FOUND
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('clock-date').innerText = now.toLocaleDateString('uk-UA', {weekday:'long', day:'numeric', month:'long'});
        }
        setInterval(updateClock, 1000); 

        // Основні ключі даних
        const APP_KEYS = [
            'gold_protocol_v3',       // Фарма
            'training_protocol',      // Тренування
            'protocol_sys_plus_days'  // Харчування
        ];

        // 1. СТВОРЕННЯ ТОЧКИ ВІДНОВЛЕННЯ (ОНОВЛЕНО)
        function CreateRestorePoint() {
            if(!confirm("Зберегти поточний стан як нову 'Точку Відновлення'?\n\nВ майбутньому Reset поверне дані саме до цього стану, а не до нуля.")) return;

            let savedCount = 0;
            APP_KEYS.forEach(key => {
                const data = localStorage.getItem(key);
                if(data) {
                    localStorage.setItem(key + '_backup', data);
                    savedCount++;
                }
            });

            // Зберігаємо час бекапу
            const now = new Date().toLocaleString('uk-UA');
            localStorage.setItem('backup_timestamp', now);
            updateBackupLabel();

            if(savedCount > 0) alert(`Успішно! Точка відновлення створена: ${now}`);
            else alert("Помилка: Немає даних для збереження (системи пусті).");
        }

        // Відображення дати бекапу
        function updateBackupLabel() {
            const ts = localStorage.getItem('backup_timestamp');
            const el = document.getElementById('last-backup');
            if(ts) {
                el.innerText = "LAST BACKUP: " + ts;
                el.style.color = "#10b981"; // Зелений
            } else {
                el.innerText = "NO RESTORE POINT FOUND";
                el.style.color = "#666";
            }
        }

        // 2. РОЗУМНЕ СКИДАННЯ
        function SystemReset() {
            const hasBackup = APP_KEYS.some(key => localStorage.getItem(key + '_backup'));

            if(hasBackup) {
                const choice = prompt(
                    "ЗНАЙДЕНО ТОЧКУ ВІДНОВЛЕННЯ.\n\n" +
                    "[ 1 ] - ВІДНОВИТИ (Повернутись до збереженої точки)\n" +
                    "[ 2 ] - ВИДАЛИТИ ВСЕ (Повне очищення до заводських)\n\n" +
                    "Введіть цифру:", "1"
                );

                if (choice === '1') {
                    APP_KEYS.forEach(key => {
                        const backup = localStorage.getItem(key + '_backup');
                        if (backup) localStorage.setItem(key, backup);
                    });
                    alert("Дані успішно відновлено до точки збереження!");
                    location.reload();

                } else if (choice === '2') {
                    if(confirm("Ви впевнені? Це видалить також і вашу точку відновлення.")) {
                        FullWipe();
                    }
                }
            } else {
                if(confirm("Точки відновлення немає. Видалити всі дані повністю?")) {
                    FullWipe();
                }
            }
        }

        function FullWipe() {
            localStorage.clear();
            try { indexedDB.deleteDatabase("GoldProtocolDB"); } catch(e){}
            alert("Система повністю очищена.");
            location.reload();
        }

        // Ініціалізація
        window.onload = () => {
            updateClock();
            updateBackupLabel();
        };
    </script>

    <div id="sys-fab" onclick="SysSwitch.toggle()">✦</div>

    <div id="sys-overlay" onclick="SysSwitch.close()">
        <div class="sys-panel" onclick="event.stopPropagation()">
            <div class="sys-header">
                <span>MANAGER OS</span>
                <div class="sys-close" onclick="SysSwitch.close()">✕</div>
            </div>
            <div class="sys-grid">
                <a href="index.html" class="sys-card">
                    <div class="sys-icon" style="color:#fff">🏠</div>
                    <span>HUB</span>
                </a>
                <a href="pharm.html" class="sys-card">
                    <div class="sys-icon" style="color:#d4af37">🏆</div>
                    <span>PHARM</span>
                </a>
                <a href="training.html" class="sys-card">
                    <div class="sys-icon" style="color:#3b82f6">⚖️</div>
                    <span>TRAIN</span>
                </a>
                <a href="nutrition.html" class="sys-card">
                    <div class="sys-icon" style="color:#10b981">🥑</div>
                    <span>FOOD</span>
                </a>
            </div>
        </div>
    </div>

    <script src="assets/common.js"></script>
</body>
</html>
