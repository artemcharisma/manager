<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROTOCOL // OS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/style.css">

    <style>
        :root { 
            --bg: #050505; 
            --card-bg: rgba(18, 18, 18, 0.6); 
            --border: #2a2a2a; 
            --gold: #d4af37; 
            --blue: #3b82f6; 
            --green: #10b981; 
            --red: #ef4444;
            --text: #f4f4f5; 
            --text-dim: #a1a1aa; 
        }
        
        body { 
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 60%);
            color: var(--text); 
            font-family: 'JetBrains Mono', monospace, sans-serif;
            margin: 0; 
            padding: 15px; 
            min-height: 100vh; 
            display: flex; flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .hub-container { width: 100%; max-width: 450px; }
        
        /* --- HEADER --- */
        header { 
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 10px 5px; margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            animation: slideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .sys-status-left {
            display: flex; align-items: center; gap: 10px;
            font-size: 0.75rem; color: #fff; letter-spacing: 1.5px; font-weight: 600;
        }

        .status-dot {
            width: 8px; height: 8px; background-color: var(--green); border-radius: 50%;
            box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite;
        }

        .sys-status-right { text-align: right; }
        .sys-time { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 1px; }
        .sys-date { font-size: 0.6rem; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; }

        /* --- DASHBOARD WIDGET (RINGS) --- */
        .dashboard-widget {
            background: var(--card-bg); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 20px; 
            padding: 20px; margin-bottom: 25px; 
            display: flex; align-items: center; gap: 20px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            animation: fadeIn 1s ease 0.2s backwards;
        }

        .rings-box { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
        .rings-box svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
        
        .ring-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 8; }
        .ring-progress { 
            fill: none; stroke-width: 8; stroke-linecap: round;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        /* Довжина кола: 2 * pi * R */
        .ring-train { stroke: var(--blue); stroke-dasharray: 251.2; stroke-dashoffset: 251.2; filter: drop-shadow(0 0 4px rgba(59,130,246,0.5)); } /* R=40 */
        .ring-nutri { stroke: var(--green); stroke-dasharray: 188.5; stroke-dashoffset: 188.5; filter: drop-shadow(0 0 4px rgba(16,185,129,0.5)); } /* R=30 */
        .ring-pharm { stroke: var(--gold); stroke-dasharray: 125.6; stroke-dashoffset: 125.6; filter: drop-shadow(0 0 4px rgba(212,175,55,0.5)); } /* R=20 */

        .rings-center {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .stats-box { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .stat-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; font-weight: 500; }
        .stat-label { display: flex; align-items: center; gap: 8px; color: var(--text-dim); }
        .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
        .stat-val { font-family: 'JetBrains Mono'; font-weight: 700; color: #fff; font-size: 0.9rem; }

        /* --- CARDS GRID --- */
        .app-grid { display: grid; gap: 12px; width: 100%; }
        
        .app-card { 
            background: var(--card-bg); backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05); padding: 16px; border-radius: 14px; 
            text-decoration: none; display: flex; align-items: center; gap: 15px; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; 
            animation: fadeInUp 0.6s ease backwards;
        }

        .app-card:nth-child(1) { animation-delay: 0.3s; }
        .app-card:nth-child(2) { animation-delay: 0.4s; }
        .app-card:nth-child(3) { animation-delay: 0.5s; }

        .app-card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.03); }
        .app-card:active { transform: scale(0.98); }
        
        .icon-box { 
            width: 45px; height: 45px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 20px; background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s;
        }
        
        .info h3 { margin: 0; font-size: 0.95rem; color: #fff; letter-spacing: 0.5px; font-weight: 600; }
        .info p { margin: 3px 0 0; font-size: 0.65rem; color: var(--text-dim); font-weight: 400; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .card-pharm:hover { border-color: rgba(212, 175, 55, 0.4); } 
        .card-pharm:hover .icon-box { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }

        .card-train:hover { border-color: rgba(59, 130, 246, 0.4); } 
        .card-train:hover .icon-box { color: var(--blue); border-color: var(--blue); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }

        .card-nutri:hover { border-color: rgba(16, 185, 129, 0.4); } 
        .card-nutri:hover .icon-box { color: var(--green); border-color: var(--green); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }

        /* --- BUTTONS --- */
        .ctrl-btn {
            background: rgba(0,0,0,0.4); border: 1px solid #333; padding: 12px 20px; border-radius: 8px;
            font-size: 0.7rem; cursor: pointer; font-family: 'JetBrains Mono'; font-weight: 600;
            transition: 0.2s; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(4px);
        }
        .btn-save { color: var(--green); }
        .btn-save:hover { background: rgba(16, 185, 129, 0.1); border-color: var(--green); }
        
        .btn-reset { color: var(--red); }
        .btn-reset:hover { background: rgba(239, 68, 68, 0.1); border-color: var(--red); }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); opacity: 1; } 50% { opacity: 0.8; } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div class="hub-container">
        
        <header>
            <div class="sys-status-left">
                <div class="status-dot"></div>
                <span>PROTOCOL OS</span>
            </div>
            <div class="sys-status-right">
                <div class="sys-time" id="clock-time">00:00</div>
                <div class="sys-date" id="clock-date">LOADING...</div>
            </div>
        </header>

        <div class="dashboard-widget">
            <div class="rings-box">
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="40" class="ring-bg" />
                    <circle cx="50" cy="50" r="40" class="ring-progress ring-train" id="svg-train" />
                    <circle cx="50" cy="50" r="30" class="ring-bg" />
                    <circle cx="50" cy="50" r="30" class="ring-progress ring-nutri" id="svg-nutri" />
                    <circle cx="50" cy="50" r="20" class="ring-bg" />
                    <circle cx="50" cy="50" r="20" class="ring-progress ring-pharm" id="svg-pharm" />
                </svg>
                <div class="rings-center">⚡</div>
            </div>
            <div class="stats-box">
                <div class="stat-item">
                    <span class="stat-label"><div class="stat-dot" style="background: var(--blue)"></div> Тренування</span>
                    <span class="stat-val" id="val-train">0%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label"><div class="stat-dot" style="background: var(--green)"></div> Харчування</span>
                    <span class="stat-val" id="val-nutri">0%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label"><div class="stat-dot" style="background: var(--gold)"></div> Фармакологія</span>
                    <span class="stat-val" id="val-pharm">0%</span>
                </div>
            </div>
        </div>

        <div class="app-grid">
            <a href="pharm.html" class="app-card card-pharm">
                <div class="icon-box">🏆</div>
                <div class="info"><h3>Фармакологія</h3><p>Протокол • Аналізи • Аптечка</p></div>
            </a>
            <a href="training.html" class="app-card card-train">
                <div class="icon-box">⚖️</div>
                <div class="info"><h3>Тренування</h3><p>Журнал • Програми • Статистика</p></div>
            </a>
            <a href="nutrition.html" class="app-card card-nutri">
                <div class="icon-box">🥑</div>
                <div class="info"><h3>Харчування</h3><p>КБЖУ • Раціон • Продукти</p></div>
            </a>
        </div>
        
        <div style="margin-top: 40px; text-align: center; color: #333; font-size: 0.65rem; letter-spacing: 2px; margin-bottom: 15px;">SYSTEM CONTROL</div>

        <div style="display:flex; gap:15px; justify-content:center;">
            <button onclick="CreateRestorePoint()" class="ctrl-btn btn-save">💾 BACKUP</button>
            <button onclick="SystemReset()" class="ctrl-btn btn-reset">⚠ WIPE</button>
        </div>
        
        <div id="last-backup" style="margin-top: 15px; text-align: center; font-size: 0.6rem; color: #555;">NO DATA FOUND</div>
    </div>

<script>
        // Годинник
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('clock-date').innerText = now.toLocaleDateString('uk-UA', {weekday:'short', day:'2-digit', month:'2-digit'});
        }
        setInterval(updateClock, 1000); 

        // --- ЛОГІКА КІЛЕЦЬ АКТИВНОСТІ ---
        function calculateDashboardStats() {
            let trainPct = 0, pharmPct = 0, nutriPct = 0;

            // 1. Читаємо прогрес Тренувань (Заповнені підходи / Всі підходи)
            try {
                const tr = JSON.parse(localStorage.getItem('training_protocol'));
                if(tr && tr.weeks) {
                    let tDone = 0, tTotal = 0;
                    tr.weeks.forEach(w => w.days.forEach(d => d.exercises.forEach(ex => {
                        ex.sets.forEach(s => {
                            tTotal++;
                            if(s.w || s.r) tDone++;
                        });
                    })));
                    if(tTotal > 0) trainPct = Math.round((tDone/tTotal)*100);
                }
            } catch(e){}

            // 2. Читаємо прогрес Фарми (Випиті пігулки / Всі пігулки)
            try {
                const ph = JSON.parse(localStorage.getItem('gold_protocol'));
                if(ph && ph.schedule) {
                    let pDone = 0, pTotal = 0;
                    ph.schedule.forEach(w => {
                        if(w) w.forEach(d => {
                            if(d) d.forEach(pill => {
                                pTotal++;
                                if(pill.done) pDone++;
                            });
                        });
                    });
                    if(pTotal > 0) pharmPct = Math.round((pDone/pTotal)*100);
                }
            } catch(e){}

            // 3. Харчування (Оскільки структура змінна, ставимо красиве демо або читаємо)
            // Якщо є реальні дані в nutrition_sys (або protocol_sys_plus_days), можна рахувати. 
            // Для візуального ефекту поки дамо базові 40%, якщо база пуста, або рахуємо дні.
            try {
                const nu = JSON.parse(localStorage.getItem('protocol_sys_plus_days') || localStorage.getItem('nutrition_protocol'));
                if (nu && nu.days && nu.days.length > 0) nutriPct = 65; // Візуальна заглушка
                else nutriPct = 0; 
            } catch(e){ nutriPct = 0; }

            // АНІМАЦІЯ КІЛЕЦЬ
            setRingProgress('svg-train', 251.2, trainPct, 'val-train');
            setRingProgress('svg-nutri', 188.5, nutriPct, 'val-nutri');
            setRingProgress('svg-pharm', 125.6, pharmPct, 'val-pharm');
        }

        function setRingProgress(id, circumference, percent, textId) {
            const circle = document.getElementById(id);
            const textEl = document.getElementById(textId);
            
            // Обмежуємо 100%
            if(percent > 100) percent = 100;
            
            const offset = circumference - (percent / 100) * circumference;
            
            // Запускаємо анімацію з мікрозатримкою
            setTimeout(() => {
                circle.style.strokeDashoffset = offset;
                textEl.innerText = percent + '%';
            }, 300);
        }

        // Базова логіка Backup
        const APP_KEYS = ['gold_protocol', 'training_protocol', 'protocol_sys_plus_days'];

        function CreateRestorePoint() {
            if(!confirm("Створити бекап?")) return;
            let savedCount = 0;
            APP_KEYS.forEach(k => {
                const d = localStorage.getItem(k);
                if(d) { localStorage.setItem(k + '_backup', d); savedCount++; }
            });
            const now = new Date().toLocaleString('uk-UA');
            localStorage.setItem('backup_timestamp', now);
            updateBackupLabel();
            alert(savedCount > 0 ? "Успішно збережено!" : "Система пуста.");
        }

        function updateBackupLabel() {
            const ts = localStorage.getItem('backup_timestamp');
            const el = document.getElementById('last-backup');
            if(ts) { el.innerText = "RESTORE: " + ts; el.style.color = "#10b981"; } 
            else { el.innerText = "NO DATA"; el.style.color = "#555"; }
        }

        function SystemReset() {
            const hasBackup = APP_KEYS.some(k => localStorage.getItem(k + '_backup'));
            if(hasBackup) {
                if(prompt("1 - ВІДНОВИТИ (Restore)\n2 - ВИДАЛИТИ ВСЕ (Wipe)\nВведіть цифру:", "1") === '1') {
                    APP_KEYS.forEach(k => { const b = localStorage.getItem(k + '_backup'); if(b) localStorage.setItem(k, b); });
                    alert("Відновлено!"); location.reload();
                } else if(confirm("Точно видалити ВСЕ?")) FullWipe();
            } else {
                if(confirm("Немає бекапу. Видалити всі дані?")) FullWipe();
            }
        }

        function FullWipe() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            updateClock();
            updateBackupLabel();
            calculateDashboardStats(); // Запуск кілець
        };
    </script>
</body>
</html>
