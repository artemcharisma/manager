<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROTOCOL MANAGER</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="assets/style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap');

        /* РІДНІ СТИЛІ ХАБУ */
        :root { 
            --bg: #030303; 
            --card-bg: rgba(18, 18, 20, 0.8); 
            --border: rgba(255, 255, 255, 0.08); 
            --gold: #d4af37; 
            --blue: #3b82f6; 
            --green: #10b981; 
            --red: #ef4444;
            --text-main: #ffffff; 
            --text-dim: #888888; 
            --text-dark: #555555;
        }
        
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% -20%, #1a1a1a 0%, #030303 70%),
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            background-position: center top;
            color: var(--text-main); 
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 20px 15px; 
            min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        .hub-container { 
            width: 100%; max-width: 450px; 
            display: flex; flex-direction: column;
            margin: auto 0; 
        }
        
        header { 
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding-bottom: 10px; margin-bottom: 35px;
            animation: slideDown 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .sys-status-left { display: flex; align-items: center; gap: 12px; }

        .status-indicator { position: relative; display: flex; align-items: center; justify-content: center; width: 14px; height: 14px; }
        .status-dot { width: 6px; height: 6px; background-color: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); position: relative; z-index: 2; }
        .status-ring { position: absolute; width: 100%; height: 100%; border: 1px solid var(--green); border-radius: 50%; animation: radarPulse 2.5s infinite cubic-bezier(0.25, 1, 0.5, 1); }

        .brand-title { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: #fff; letter-spacing: 2px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; }
        .brand-title span { font-weight: 400; color: var(--text-dim); margin-left: 6px; }

        .sys-status-right { text-align: right; font-family: 'JetBrains Mono', monospace; }
        .sys-time { font-size: 1.4rem; font-weight: 800; color: #fff; letter-spacing: 1px; line-height: 1; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .sys-date { font-size: 0.65rem; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }

        .nav-grid { display: flex; flex-direction: column; gap: 16px; width: 100%; }
        
        .smart-card {
            background: linear-gradient(145deg, rgba(25, 25, 28, 0.9) 0%, rgba(10, 10, 12, 0.95) 100%);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 20px; padding: 22px 20px;
            text-decoration: none; display: flex; align-items: center; gap: 20px;
            position: relative; overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
            animation: fadeInUp 0.6s ease backwards;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .smart-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #333; transition: 0.3s; }
        .card-pharm::before { background: var(--gold); box-shadow: 0 0 15px var(--gold); }
        .card-train::before { background: var(--blue); box-shadow: 0 0 15px var(--blue); }
        .card-nutri::before { background: var(--green); box-shadow: 0 0 15px var(--green); }

        .smart-card:nth-child(1) { animation-delay: 0.1s; }
        .smart-card:nth-child(2) { animation-delay: 0.2s; }
        .smart-card:nth-child(3) { animation-delay: 0.3s; }

        .icon-box { 
            width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; 
            font-size: 26px; border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.3s ease; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); background: rgba(0,0,0,0.6);
        }
        
        .card-pharm .icon-box { color: var(--gold); border-color: rgba(212,175,55,0.3); }
        .card-train .icon-box { color: var(--blue); border-color: rgba(59,130,246,0.3); }
        .card-nutri .icon-box { color: var(--green); border-color: rgba(16,185,129,0.3); }

        @media (hover: hover) {
            .card-pharm:hover { background: linear-gradient(145deg, rgba(212,175,55,0.15) 0%, rgba(10,10,12,0.95) 100%); border-color: rgba(212,175,55,0.4); transform: translateY(-3px); box-shadow: 0 12px 35px rgba(212,175,55,0.15); }
            .card-train:hover { background: linear-gradient(145deg, rgba(59,130,246,0.15) 0%, rgba(10,10,12,0.95) 100%); border-color: rgba(59,130,246,0.4); transform: translateY(-3px); box-shadow: 0 12px 35px rgba(59,130,246,0.15); }
            .card-nutri:hover { background: linear-gradient(145deg, rgba(16,185,129,0.15) 0%, rgba(10,10,12,0.95) 100%); border-color: rgba(16,185,129,0.4); transform: translateY(-3px); box-shadow: 0 12px 35px rgba(16,185,129,0.15); }
        }
        
        .card-pharm:active { background: linear-gradient(145deg, rgba(212,175,55,0.2) 0%, rgba(20,20,22,0.95) 100%); border-color: var(--gold); transform: scale(0.96); transition: transform 0.05s ease; }
        .card-train:active { background: linear-gradient(145deg, rgba(59,130,246,0.2) 0%, rgba(20,20,22,0.95) 100%); border-color: var(--blue); transform: scale(0.96); transition: transform 0.05s ease; }
        .card-nutri:active { background: linear-gradient(145deg, rgba(16,185,129,0.2) 0%, rgba(20,20,22,0.95) 100%); border-color: var(--green); transform: scale(0.96); transition: transform 0.05s ease; }
        .smart-card:active .icon-box { transform: scale(0.9) rotate(-5deg); box-shadow: 0 0 20px currentColor; }
        
        .info { flex-grow: 1; }
        .info h3 { margin: 0; font-size: 1.15rem; color: #fff; letter-spacing: 0.5px; font-weight: 700; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        .info-data { margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.5px; line-height: 1.5; display: flex; flex-direction: column; gap: 5px; }
        .data-row { display: flex; align-items: center; gap: 8px; }
        .data-hl { color: #fff; font-weight: 700; }
        .data-lbl { color: var(--text-dark); }

        .bottom-wrapper { margin-top: 40px; width: 100%; animation: fadeIn 1s ease 0.5s backwards; }

        .vitals-strip { display: flex; justify-content: space-between; margin-bottom: 30px; padding: 0 10px; }
        .v-item { display: flex; flex-direction: column; gap: 4px; position: relative; z-index: 2; }
        .v-item.right { text-align: right; align-items: flex-end; }
        
        .v-label { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text-dim); letter-spacing: 1.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        
        .ecg-svg { width: 32px; height: 12px; stroke: var(--red); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px rgba(239,68,68,0.6)); }
        .ecg-line { stroke-dasharray: 90; stroke-dashoffset: 90; animation: ecgDraw 2s infinite linear; }

        .v-val { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; color: #fff; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 0 15px rgba(255,255,255,0.15); margin-top: 2px; }
        .v-val span { font-size: 0.75rem; color: var(--text-dim); font-weight: 600; letter-spacing: 1px; margin-left: 2px;}

        .sys-control-title { text-align: center; color: #555; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 4px; margin-bottom: 15px; font-weight: 800; }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .ctrl-btn {
            background: linear-gradient(to bottom, rgba(25, 25, 28, 0.9), rgba(15, 15, 17, 0.95)); 
            border: 1px solid rgba(255,255,255,0.05); padding: 16px; border-radius: 14px;
            font-size: 0.75rem; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-weight: 700;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; gap: 8px;
            letter-spacing: 1px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Чіткі контури для кнопок Хабу на мобільних пристроях */
        .btn-save { 
            color: var(--green); 
            border-color: rgba(16, 185, 129, 0.4); /* Більш яскрава рамка */
            background: linear-gradient(to bottom, rgba(16, 185, 129, 0.08), rgba(10, 10, 12, 0.95)); 
        }
        .btn-reset { 
            color: var(--red); 
            border-color: rgba(239, 68, 68, 0.4); 
            background: linear-gradient(to bottom, rgba(239, 68, 68, 0.08), rgba(10, 10, 12, 0.95)); 
        }
        @media (hover: hover) {
            .btn-save:hover { border-color: var(--green); background: linear-gradient(to bottom, rgba(16, 185, 129, 0.15), rgba(15, 15, 17, 0.95)); box-shadow: 0 5px 20px rgba(16, 185, 129, 0.2); }
            .btn-reset:hover { border-color: var(--red); background: linear-gradient(to bottom, rgba(239, 68, 68, 0.15), rgba(15, 15, 17, 0.95)); box-shadow: 0 5px 20px rgba(239, 68, 68, 0.2); }
        }
        
        .btn-save:active { border-color: var(--green); background: rgba(16, 185, 129, 0.2); transform: scale(0.93); transition: transform 0.05s ease; }
        .btn-reset:active { border-color: var(--red); background: rgba(239, 68, 68, 0.2); transform: scale(0.93); transition: transform 0.05s ease; }

        .last-backup { margin-top: 18px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text-dark); letter-spacing: 1px; }

        /* ВІЗУАЛЬНІ АНІМАЦІЇ ДЛЯ ХАБУ */
        @keyframes ecgDraw { 0% { stroke-dashoffset: 90; } 40% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -90; } }
        @keyframes radarPulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        @keyframes slideDown { from { transform: translateY(-15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseBeat { 0% { transform: scale(0.8); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.8; } }
        @keyframes levitate { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        
        .anim-heart { animation: pulseBeat 1.2s infinite cubic-bezier(0.2, 0.8, 0.2, 1); transform-origin: center; }
        .anim-weight { animation: levitate 2s infinite ease-in-out; }
        
        /* Приховуємо глобальне меню (зірку) на головній сторінці */
        #sys-fab { display: none !important; }

        
    </style>
</head>

<script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('clock-date').innerText = now.toLocaleDateString('uk-UA', {weekday:'short', day:'2-digit', month:'2-digit'});
        }
        setInterval(updateClock, 1000); 

        function getDayMacros(day, bank) {
            let p=0, f=0, c=0, kcal=0;
            if (day && day.meals) {
                day.meals.forEach(m => {
                    if (m.foods) {
                        m.foods.forEach(item => {
                            const ref = bank[item.n];
                            if (ref) {
                                const ratio = ref.unit ? parseFloat(item.w) : parseFloat(item.w) / 100;
                                p += (parseFloat(ref.p)||0) * ratio; f += (parseFloat(ref.f)||0) * ratio;
                                c += (parseFloat(ref.c)||0) * ratio; kcal += (parseFloat(ref.k)||0) * ratio;
                            } else {
                                p += parseFloat(item.p)||0; f += parseFloat(item.f)||0; c += parseFloat(item.c)||0; kcal += parseFloat(item.k)||0;
                            }
                        });
                    }
                });
            }
            return { p: Math.round(p), f: Math.round(f), c: Math.round(c), kcal: Math.round(kcal) };
        }

        async function populateSmartCards() {
            // 1. Фармакологія
            try {
                const ph = await Utils.load('gold_protocol', null);
                const el = document.getElementById('data-pharm');
                if (ph && (ph.blocks || ph.schedule)) {
                    // Адаптація під макроцикли (Blocks)
                    const activeBlockId = ph.currentBlockId || null;
                    const blocks = ph.blocks || [];
                    const activeBlock = blocks.find(b => b.id === activeBlockId) || ph;

                    const sDate = activeBlock.startDate || ph.startDate;
                    const phases = activeBlock.phases || ph.phases || [];
                    
                    let currentWeek = 1;
                    if (sDate) {
                        const startDate = new Date(sDate); const now = new Date();
                        const day = startDate.getDay(); const diff = startDate.getDate() - day + (day === 0 ? -6 : 1);
                        const startMonday = new Date(startDate.setDate(diff)); startMonday.setHours(0,0,0,0);
                        const diffTime = now.getTime() - startMonday.getTime();
                        currentWeek = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7)) + 1;
                        if (currentWeek < 1) currentWeek = 1;
                    }
                    
                    // Шукаємо максимальний тиждень саме по активних фазах, ігноруючи порожні хвости
                    let activeWeeks = [];
                    phases.forEach(p => { if (p.weeks) activeWeeks.push(...p.weeks); });
                    const maxW = activeWeeks.length > 0 ? Math.max(...activeWeeks) : 1;
                    
                    if (currentWeek > maxW) currentWeek = maxW;
                    
                    let phaseTitle = "Курс";
                    const currentPhase = phases.find(p => p.weeks && p.weeks.includes(currentWeek));
                    if (currentPhase) phaseTitle = currentPhase.title;

                    // Назва макроциклу (Блоку)
                    const blockName = activeBlock.name || "ФАРМАКОЛОГІЯ";

                    if(el) el.innerHTML = `<div class="data-row"><span class="data-lbl">БЛОК:</span> <span class="data-hl" style="color:var(--gold)">${blockName.toUpperCase()}</span></div><div class="data-row"><span class="data-lbl">ЕТАП:</span> <span class="data-hl">${phaseTitle.toUpperCase()} (W${currentWeek})</span></div>`;
                } else if (el) {
                    el.innerHTML = `<span class="data-lbl">НЕМАЄ ДАНИХ</span>`;
                }
            } catch(e){ console.error(e); }

            // 2. Життєві показники
            try {
                const vitalsData = await GlobalVitals.getAll();
                if (vitalsData && Object.keys(vitalsData).length > 0) {
                    let latestW = "--.--<span>KG</span>", latestBP = "--/--", latestHR = "--";
                    const dates = Object.keys(vitalsData).sort((a, b) => new Date(b) - new Date(a));
                    for (let d of dates) {
                        const v = vitalsData[d];
                        if (v.w && latestW.includes("--")) latestW = v.w + "<span>KG</span>";
                        if (v.bp && latestBP === "--/--") latestBP = v.bp;
                        if (v.hr && latestHR === "--") latestHR = v.hr;
                        if (!latestW.includes("--") && latestBP !== "--/--" && latestHR !== "--") break;
                    }
                    const weightEl = document.getElementById('vital-weight');
                    const bpEl = document.getElementById('vital-bp');
                    const hrEl = document.getElementById('vital-hr');
                    if (weightEl) weightEl.innerHTML = latestW;
                    if (bpEl) bpEl.innerHTML = latestBP;
                    if (hrEl && latestHR !== "--") hrEl.innerHTML = latestHR + "<span>BPM</span>";
                }
            } catch(e) { console.error(e); }

            // 3. Тренування
            try {
                const tr = await Utils.load('training_protocol', null);
                const el = document.getElementById('data-train');
                if (tr && tr.weeks && tr.weeks.length > 0) {
                    
                    // Адаптація під нові Макроцикли (Blocks)
                    const activeBlockId = tr.currentBlockId || tr.currentProgram || 'balanced';
                    const blocks = tr.blocks || [];
                    const activeBlock = blocks.find(b => b.id === activeBlockId);
                    
                    // Беремо дату конкретного макроциклу (або глобальну, якщо ще не мігрували)
                    const sDate = activeBlock ? activeBlock.startDate : tr.startDate;

                    let currentTrainWeek = 1;
                    if (sDate) {
                        const startDate = new Date(sDate); 
                        const now = new Date();
                        const day = startDate.getDay(); 
                        const diff = startDate.getDate() - day + (day === 0 ? -6 : 1);
                        const startMonday = new Date(startDate.setDate(diff)); 
                        startMonday.setHours(0,0,0,0);
                        const diffTime = now.getTime() - startMonday.getTime();
                        currentTrainWeek = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7)) + 1;
                        if (currentTrainWeek < 1) currentTrainWeek = 1;
                    }
                    
                    // Шукаємо актуальний тиждень у збереженій базі поточного блоку
                    let activeWeek = tr.weeks.find(w => w.num === currentTrainWeek && w.prog === activeBlockId);
                    
                    if (!activeWeek) {
                        const progWeeks = tr.weeks.filter(w => w.prog === activeBlockId);
                        activeWeek = progWeeks.length > 0 ? progWeeks[progWeeks.length - 1] : tr.weeks[tr.weeks.length - 1];
                    }

                    // Назва макроциклу замість жорстких "Збалансована/Руки"
                    const progName = activeBlock ? activeBlock.name : (activeBlockId === 'arms' ? 'РУКИ' : 'ЗБАЛАНСОВАНА');
                    const typeName = activeWeek.type === 'mass' ? 'МАСА' : 'СУШКА';
                    
                    if(el) el.innerHTML = `<div class="data-row"><span class="data-lbl">БЛОК:</span> <span class="data-hl" style="color:var(--blue)">${progName}</span></div><div class="data-row"><span class="data-lbl">ЕТАП:</span> <span class="data-hl">${typeName} (W${activeWeek.num})</span></div>`;
                } else if (el) {
                    el.innerHTML = `<span class="data-lbl">НЕМАЄ ДАНИХ</span>`;
                }
            } catch(e){ console.error(e); }

            // 4. Харчування
            try {
                const nu = await Utils.load('protocol_sys_plus_days', null);
                const el = document.getElementById('data-nutri');
                if (nu && nu.days && nu.days.length > 0) {
                    const bank = nu.bank || {}; 
                    let htmlContent = '';
                    
                    let trainDay = null;
                    let restDay = null;

                    // 1. Спочатку шукаємо дні, які ти закріпив вручну
                    if (nu.hub) {
                        trainDay = nu.days.find(d => d.id === nu.hub.train);
                        restDay = nu.days.find(d => d.id === nu.hub.rest);
                    }

                    // 2. Якщо вручну не закріплено - шукаємо за ключовими словами (стара логіка для страховки)
                    if (!trainDay && (!nu.hub || !nu.hub.train)) {
                        const findDay = (keywords) => nu.days.find(d => keywords.some(kw => d.name.toLowerCase().includes(kw)));
                        trainDay = findDay(['трен', 'train', 'робоч', 'важк']) || nu.days[0];
                    }
                    if (!restDay && (!nu.hub || !nu.hub.rest)) {
                        const findDay = (keywords) => nu.days.find(d => keywords.some(kw => d.name.toLowerCase().includes(kw)));
                        restDay = findDay(['відпоч', 'рест', 'rest', 'off', 'вихідн']) || (nu.days.length > 1 ? nu.days[1] : null);
                        
                        // Захист від дублювання, якщо програма знайшла один і той самий день
                        if (restDay && trainDay && trainDay.id === restDay.id && nu.days.length > 1) {
                            restDay = nu.days.find(d => d.id !== trainDay.id);
                        }
                    }

                    // Рендеримо дані
                    if (trainDay) {
                        const d1 = getDayMacros(trainDay, bank);
                        if(d1.kcal > 0) htmlContent += `<div class="data-row"><span class="data-lbl" style="color:var(--green)">[T]</span> <span class="data-hl">${d1.kcal}</span> <span class="data-lbl">KCAL</span> <span class="data-lbl" style="margin-left:auto">Б${d1.p} Ж${d1.f} В${d1.c}</span></div>`;
                    }
                    if (restDay) {
                        const d2 = getDayMacros(restDay, bank);
                        if(d2.kcal > 0) htmlContent += `<div class="data-row"><span class="data-lbl" style="color:var(--green)">[R]</span> <span class="data-hl">${d2.kcal}</span> <span class="data-lbl">KCAL</span> <span class="data-lbl" style="margin-left:auto">Б${d2.p} Ж${d2.f} В${d2.c}</span></div>`;
                    }
                    
                    if(el) {
                        if (htmlContent !== '') el.innerHTML = htmlContent;
                        else el.innerHTML = `<span class="data-lbl">РАЦІОН ПОРОЖНІЙ</span>`;
                    }
                } else if (el) {
                    el.innerHTML = `<span class="data-lbl">НЕМАЄ ДАНИХ</span>`;
                }
            } catch(e){ console.error(e); }
        }

        // ДОДАНО: 'protocol_global_vitals' для збереження історії тиску/ваги
        const APP_KEYS = ['gold_protocol', 'training_protocol', 'protocol_sys_plus_days', 'protocol_global_vitals'];

        async function CreateRestorePoint() {
            const msg = `Створити ФІЗИЧНУ резервну копію (Export)?<br><br>
                         <span style="display:block; border-left: 2px solid var(--gold); padding-left: 10px; margin-top: 10px; text-align: left; font-size: 0.85rem; color: var(--text-dim);">
                            Усі ваші дані (тренування, фарма, харчування, вітали) будуть зібрані в один файл та завантажені на пристрій.
                         </span>`;
            const confirmed = await Modal.confirm(msg, "ЕКСПОРТ БАЗИ ДАНИХ", "gold");
            if(!confirmed) return; 

            let fullBackup = {
                timestamp: new Date().toISOString(),
                device_info: navigator.userAgent,
                data: {}
            };

            let hasData = false;

            // Збираємо всі дані з усіх модулів
            for (const k of APP_KEYS) {
                const d = await Utils.load(k, null);
                if(d) { 
                    fullBackup.data[k] = d;
                    hasData = true;
                }
            }

            if(!hasData) {
                await Modal.alert("Система пуста. Немає даних для експорту.", "ПОМИЛКА", "gold");
                return;
            }

            // Генеруємо ім'я файлу
            const dateStr = new Date().toLocaleDateString('uk-UA').replace(/\./g, '_');
            const filename = `PROTOCOL_OS_BACKUP_${dateStr}.json`;

            // Фізичне завантаження на пристрій
            const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url; 
            a.download = filename; 
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 150);

            // Оновлюємо мітку в Хабі
            localStorage.setItem('backup_timestamp', new Date().toLocaleString('uk-UA'));
            updateBackupLabel();
            
            await Modal.alert("Файл успішно завантажено. Зберігайте його в надійному місці (iCloud/Google Drive/PC).", "BACKUP СТВОРЕНО", "green");
        }

        function updateBackupLabel() {
            const ts = localStorage.getItem('backup_timestamp');
            const el = document.getElementById('last-backup');
            if(ts) { el.innerText = "LAST EXPORT: " + ts; el.style.color = "var(--green)"; } 
            else { el.innerText = "NO BACKUPS YET"; el.style.color = "var(--text-dark)"; }
        }

        async function SystemReset() {
            // ФІКС: Прямі синхронні кнопки в HTML модалки для обходу блокування iOS
            const promptText = `
                <div style="margin-bottom: 18px; font-weight: 500; font-size: 1.05rem;">Оберіть дію:</div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button onclick="document.getElementById('sys-restore-file').click(); Modal.handleCancel();" style="background: rgba(212,175,55,0.1); border: 1px solid var(--gold); color: var(--gold); padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase;">📥 ІМПОРТ З ФАЙЛУ (.json)</button>
                    <button onclick="Modal.handleOK()" style="background: rgba(239,68,68,0.1); border: 1px solid var(--red); color: var(--red); padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase;">🗑 ВИДАЛИТИ ВСІ ДАНІ</button>
                </div>
            `;
            
            // Використовуємо confirm, кнопка "ОК" тригерить видалення, кнопка "Імпорт" перехоплює на себе клік по інпуту
            const confirmedWipe = await Modal.confirm(promptText, "СИСТЕМНИЙ ЗАПИТ", "red");
            
            if (confirmedWipe) {
                if (await Modal.confirm("ОСТАТОЧНЕ ВИДАЛЕННЯ.<br><br><span style='color:var(--red); font-weight:bold'>Відновити дані буде НЕМОЖЛИВО без фізичного файлу бекапу.</span><br><br>Ви точно впевнені?", "⚠ WIPE ALL ⚠", "red")) {
                    FullWipe();
                }
            }
        }

        async function HandleRestore(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (!imported.data) throw new Error("Невірний формат. Очікується файл бекапу Protocol OS.");
                    
                    // Записуємо імпортовані дані назад у пам'ять
                    for (const k of APP_KEYS) {
                        if (imported.data[k]) {
                            Utils.save(k, imported.data[k]); 
                        }
                    }
                    await Modal.alert("Систему успішно відновлено з файлу!", "ВІДНОВЛЕНО", "green");
                    location.reload();
                } catch (err) {
                    await Modal.alert("Помилка імпорту: " + err.message, "ПОМИЛКА", "red");
                }
            };
            reader.readAsText(file);
            inputElement.value = ''; // Скидаємо інпут для можливості повторного вибору
        }

        // ФІКС: Повертаємо випадково видалену функцію очищення
        async function FullWipe() { 
            localStorage.clear(); 
            try { indexedDB.deleteDatabase('ProtocolOS_DB'); } catch(e) {}
            try { indexedDB.deleteDatabase('GoldProtocolDB'); } catch(e) {}
            location.reload(); 
        }

        window.onload = () => {
            updateClock();
            updateBackupLabel();
            populateSmartCards(); 
        };
    </script>
    <input type="file" id="sys-restore-file" accept=".json" style="display:none" onchange="HandleRestore(this)">
</body>
</html>
