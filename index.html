<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMXXVI // OS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/style.css">

    <style>
        /* Унікальні стилі для HUB (index.html) */
        :root { 
            --bg: #050505; 
            --card: #121212; 
            --border: #2a2a2a; 
            --gold: #d4af37; 
            --blue: #3b82f6; 
            --green: #10b981; 
            --text: #f4f4f5; 
            --text-dim: #a1a1aa; 
        }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'JetBrains Mono', monospace, sans-serif;
            margin: 0; 
            /* Зменшив відступи для мобілок, щоб все влізло */
            padding: 15px; 
            min-height: 100vh; 
            display: flex; flex-direction: column; 
            align-items: center; 
            /* Важливо: центрування по вертикалі, якщо екран великий */
            justify-content: center; 
            box-sizing: border-box;
        }

        .hub-container { width: 100%; max-width: 450px; animation: fadeIn 0.8s ease; }
        
        /* --- НОВИЙ КОМПАКТНИЙ HEADER (System Bar Status) --- */
        header { 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-bottom: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-family: 'JetBrains Mono', monospace;
        }

        .sys-status-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sys-status-right {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
        }
        /* ----------------------------------------------- */
        
        /* WIDGET CLOCK */
        .sys-widget { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: center; font-family: 'JetBrains Mono', monospace; }
        .time { font-size: 1.8rem; font-weight: 700; color: #fff; letter-spacing: 2px; }
        .date { font-size: 0.8rem; color: var(--gold); text-transform: uppercase; margin-top: 5px; }

        .app-grid { display: grid; gap: 12px; }
        
        .app-card { 
            background: var(--card); 
            border: 1px solid var(--border); 
            padding: 18px; /* Трохи зменшив падінг карток */
            border-radius: 14px; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            transition: 0.3s; 
            position: relative; 
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
        }
        .app-card:hover { transform: translateY(-3px); border-color: #444; }
        .app-card:active { transform: scale(0.98); }
        
        .icon-box { width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); }
        
        .info h3 { margin: 0; font-size: 1rem; color: #fff; letter-spacing: -0.5px; }
        .info p { margin: 3px 0 0; font-size: 0.7rem; color: var(--text-dim); font-weight: 300; }
        
        .card-pharm:hover { border-color: var(--gold); } .card-pharm .icon-box { color: var(--gold); }
        .card-nutri:hover { border-color: var(--green); } .card-nutri .icon-box { color: var(--green); }
        .card-train:hover { border-color: var(--blue); } .card-train .icon-box { color: var(--blue); }
        
        @keyframes fadeIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }
    </style>
</head>
<body>
    <div class="hub-container">
        
        <header>
            <div class="sys-status-left">
                <span style="color: var(--gold);">✦</span> SYSTEM READY
            </div>
            <div class="sys-status-right">
                MMXXVI
            </div>
        </header>

        <div class="sys-widget">
            <div class="time" id="clock-time">00:00</div>
            <div class="date" id="clock-date">LOADING...</div>
        </div>

        <div class="app-grid">
            <a href="pharm.html" class="app-card card-pharm">
                <div class="icon-box">🏆</div>
                <div class="info"><h3>Фармакологія</h3><p>Gold Protocol • Курс • Аналізи</p></div>
            </a>
            <a href="training.html" class="app-card card-train">
                <div class="icon-box">⚖️</div>
                <div class="info"><h3>Тренування</h3><p>Training • Mass • Cut</p></div>
            </a>
            <a href="nutrition.html" class="app-card card-nutri">
                <div class="icon-box">🥑</div>
                <div class="info"><h3>Харчування</h3><p>Макроси • База продуктів</p></div>
            </a>
        </div>
        
        <div style="margin-top: 30px; text-align: center; color: #333; font-size: 0.7rem; font-family: 'JetBrains Mono'">SYSTEM CONTROL</div>

        <div style="margin-top: 15px; display:flex; gap:10px; justify-content:center;">
            <button onclick="CreateRestorePoint()" style="background:#111; border:1px solid #333; color:#10b981; padding:10px 15px; border-radius:8px; font-size:0.7rem; cursor:pointer; font-family:'JetBrains Mono'; font-weight:600">
                💾 SAVE POINT
            </button>
            <button onclick="SystemReset()" style="background:#111; border:1px solid #333; color:#ef4444; padding:10px 15px; border-radius:8px; font-size:0.7rem; cursor:pointer; font-family:'JetBrains Mono'; font-weight:600">
                ⚠ RESET
            </button>
        </div>
        
        <div id="last-backup" style="margin-top: 10px; text-align: center; font-family: 'JetBrains Mono'; font-size: 0.6rem; color: #666;">
            NO RESTORE POINT FOUND
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('clock-date').innerText = now.toLocaleDateString('uk-UA', {weekday:'long', day:'numeric', month:'long'});
        }
        setInterval(updateClock, 1000); 

        // Основні ключі даних
        const APP_KEYS = [
            'gold_protocol',       // Фарма
            'training_protocol',      // Тренування
            'protocol_sys_plus_days'  // Харчування
        ];

        // 1. СТВОРЕННЯ ТОЧКИ ВІДНОВЛЕННЯ
        function CreateRestorePoint() {
            if(!confirm("Зберегти поточний стан як нову 'Точку Відновлення'?\n\nВ майбутньому Reset поверне дані саме до цього стану, а не до нуля.")) return;

            let savedCount = 0;
            APP_KEYS.forEach(key => {
                const data = localStorage.getItem(key);
                if(data) {
                    localStorage.setItem(key + '_backup', data);
                    savedCount++;
                }
            });

            const now = new Date().toLocaleString('uk-UA');
            localStorage.setItem('backup_timestamp', now);
            updateBackupLabel();

            if(savedCount > 0) alert(`Успішно! Точка відновлення створена: ${now}`);
            else alert("Помилка: Немає даних для збереження (системи пусті).");
        }

        // Відображення дати бекапу
        function updateBackupLabel() {
            const ts = localStorage.getItem('backup_timestamp');
            const el = document.getElementById('last-backup');
            if(ts) {
                el.innerText = "LAST BACKUP: " + ts;
                el.style.color = "#10b981"; // Зелений
            } else {
                el.innerText = "NO RESTORE POINT FOUND";
                el.style.color = "#666";
            }
        }

        // 2. РОЗУМНЕ СКИДАННЯ
        function SystemReset() {
            const hasBackup = APP_KEYS.some(key => localStorage.getItem(key + '_backup'));

            if(hasBackup) {
                const choice = prompt(
                    "ЗНАЙДЕНО ТОЧКУ ВІДНОВЛЕННЯ.\n\n" +
                    "[ 1 ] - ВІДНОВИТИ (Повернутись до збереженої точки)\n" +
                    "[ 2 ] - ВИДАЛИТИ ВСЕ (Повне очищення до заводських)\n\n" +
                    "Введіть цифру:", "1"
                );

                if (choice === '1') {
                    APP_KEYS.forEach(key => {
                        const backup = localStorage.getItem(key + '_backup');
                        if (backup) localStorage.setItem(key, backup);
                    });
                    alert("Дані успішно відновлено до точки збереження!");
                    location.reload();

                } else if (choice === '2') {
                    if(confirm("Ви впевнені? Це видалить також і вашу точку відновлення.")) {
                        FullWipe();
                    }
                }
            } else {
                if(confirm("Точки відновлення немає. Видалити всі дані повністю?")) {
                    FullWipe();
                }
            }
        }

        function FullWipe() {
            localStorage.clear();
            try { indexedDB.deleteDatabase("GoldProtocolDB"); } catch(e){}
            alert("Система повністю очищена.");
            location.reload();
        }

        // Ініціалізація
        window.onload = () => {
            updateClock();
            updateBackupLabel();
        };
    </script>
</body>
</html>
