<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROTOCOL: NUTRITION</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Manager OS">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css"> <style>
        /* ЗАБОРОНА ВИДІЛЕННЯ ТЕКСТУ */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* ДОЗВОЛЯЄМО ТАМ, ДЕ ТРЕБА ПИСАТИ */
        input, textarea, [contenteditable] {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
            cursor: text;
        }
        :root {
            /* CUSTOM SCROLLBAR */
            ::-webkit-scrollbar { width: 6px; height: 6px; }
            ::-webkit-scrollbar-track { background: #050505; }
            ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
            ::-webkit-scrollbar-thumb:hover { background: #d4af37; }

            /* --- PROTOCOL THEME --- */
            --bg-body: #050505;
            --bg-card: #0F0F11;
            --bg-input: #1A1A1C;
            --border: #333333;
            
            --accent: #FFD700; /* Gold */
            
            --blue: #2E86DE;
            --green: #2ECC71;
            --red: #E74C3C;
            --yellow: #f59e0b;
            
            --text-main: #FFFFFF;
            --text-mute: #888888;
            
            --radius-l: 16px;
            
            --font-ui: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; outline: none; }
        
        body {
            background-color: var(--bg-body); color: var(--text-main);
            font-family: var(--font-ui);
            margin: 0; padding: 0; min-height: 100vh;
            padding-bottom: 140px; /* Місце для меню */
        }

        .app-container { max-width: 600px; margin: 0 auto; padding: 0 16px; }

        /* --- HEADER --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 0;
            position: sticky; top: 0; z-index: 50;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }
        
        .brand { display: flex; flex-direction: column; }
        .brand h1 { 
            font-family: var(--font-mono); 
            font-size: 1.4rem; font-weight: 800; margin: 0; 
            letter-spacing: -1px; color: var(--text-main);
        }
        .brand span { 
            font-family: var(--font-mono);
            font-size: 0.65rem; color: var(--accent); 
            font-weight: 500; letter-spacing: 2px; text-transform: uppercase; 
        }

        .toolbar { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--bg-input); border: 1px solid var(--border);
            width: 40px; height: 40px; border-radius: 8px;
            color: var(--text-main); font-size: 1.1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .icon-btn:active { transform: scale(0.96); border-color: var(--text-mute); }
        .icon-btn.accent { border-color: var(--accent); color: var(--accent); background: rgba(255, 215, 0, 0.05); }

        /* --- DAY MANAGER --- */
        .day-bar {
            display: flex; overflow-x: auto; gap: 10px; padding-bottom: 15px;
            margin-bottom: 15px; scrollbar-width: none;
        }
        .day-tab {
            flex: 0 0 auto; padding: 8px 16px;
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 20px; color: var(--text-mute);
            font-family: var(--font-mono); font-size: 0.85rem; cursor: pointer;
            transition: 0.2s; white-space: nowrap;
        }
        .day-tab.active {
            background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700;
        }
        .day-add-btn {
            flex: 0 0 auto; width: 35px; height: 35px; border-radius: 50%;
            background: transparent; border: 1px dashed var(--border);
            color: var(--text-mute); font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- DASHBOARD --- */
        .hud {
            background: var(--bg-card); border-radius: var(--radius-l); padding: 20px;
            margin-bottom: 24px; position: relative; overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        
        .hud-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
        
        .k-group { display: flex; flex-direction: column; }
        .k-val { font-family: var(--font-mono); font-size: 3rem; font-weight: 700; line-height: 0.9; letter-spacing: -2px; }
        .k-label { font-size: 0.75rem; color: var(--text-mute); margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;}

        .target-badge {
            background: var(--bg-input); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 20px;
            font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-mute);
            cursor: pointer; transition: 0.2s;
        }
        .target-badge span { color: var(--accent); font-weight: 700; }

        /* Macro Bars */
        .hud-macros { display: flex; flex-direction: column; gap: 12px; }
        .macro-row { display: grid; grid-template-columns: 40px 1fr 60px; align-items: center; gap: 10px; }
        .mr-label { font-family: var(--font-mono); font-weight: 700; font-size: 0.8rem; color: var(--text-mute); }
        
        .mr-track { height: 6px; background: #222; border-radius: 3px; overflow: hidden; position: relative; }
        .mr-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 0 10px currentColor; }
        .mr-val { font-family: var(--font-mono); font-size: 0.8rem; text-align: right; color: var(--text-main); }
        
        /* --- MEALS LIST --- */
        .meal-block { 
            background: var(--bg-card); border: 1px solid var(--border); 
            border-radius: var(--radius-l); margin-bottom: 20px; overflow: hidden; 
        }
        
        .meal-header {
            padding: 16px; background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .mh-title { 
            font-weight: 600; font-size: 1rem; color: var(--text-main); 
            border-bottom: 1px dashed transparent; cursor: text;
        }
        .mh-title:focus { border-bottom-color: var(--accent); }
        
        .mh-meta { display: flex; align-items: center; gap: 12px; }
        .mh-macros { display: flex; gap: 6px; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-mute); }
        .mh-macros span b { font-weight: 700; }
        .mh-kcal { font-family: var(--font-mono); font-weight: 700; font-size: 0.9rem; color: var(--text-main); }
        .mh-del { color: var(--red); opacity: 0.4; cursor: pointer; padding: 4px; }
        .mh-del:hover { opacity: 1; }

        .food-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; border-bottom: 1px solid #222;
            cursor: pointer; transition: background 0.1s;
        }
        .food-row:last-of-type { border-bottom: none; }
        .food-row:active { background: var(--bg-input); }
        
        .fr-info h4 { margin: 0; font-size: 0.95rem; font-weight: 500; }
        .fr-info p { margin: 2px 0 0; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-mute); }
        .fr-vals { text-align: right; }
        .fr-w { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 700; color: var(--accent); }
        .fr-k { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-mute); margin-top: 2px; }

        .btn-add-food {
            width: 100%; padding: 14px; background: transparent; border: none;
            border-top: 1px solid var(--border);
            color: var(--text-mute); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: 0.2s;
        }
        .btn-add-food:active { background: rgba(255,255,255,0.05); color: var(--text-main); }

        .btn-new-meal {
            width: 100%; padding: 18px; border: 1px dashed var(--border);
            border-radius: var(--radius-l); background: transparent;
            color: var(--text-mute); font-weight: 600; cursor: pointer;
            margin-top: 10px; transition: 0.2s;
        }
        .btn-new-meal:active { border-color: var(--accent); color: var(--accent); }

        /* --- DAY CONTROL --- */
        .day-control-panel {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; padding: 0 5px;
        }
        .day-name-edit {
            font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700;
            color: var(--text-main); border-bottom: 1px dashed var(--border);
        }
        .day-name-edit:focus { border-bottom-color: var(--accent); }
        .btn-del-day {
            font-size: 0.8rem; color: var(--red); background: transparent; border: none;
            cursor: pointer; opacity: 0.7;
        }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            z-index: 100; display: none; align-items: flex-end; justify-content: center;
        }
        .modal-card {
            background: #141414; width: 100%; max-width: 600px;
            border-top: 1px solid var(--border);
            border-radius: 24px 24px 0 0; padding: 24px; padding-bottom: 40px;
            display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 -20px 50px rgba(0,0,0,0.7);
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .mc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .mc-title { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
        
        .inp-group { position: relative; }
        .inp-main {
            width: 100%; background: var(--bg-body); border: 1px solid var(--border);
            padding: 16px; border-radius: 12px; color: #fff; font-size: 1rem;
            font-family: var(--font-mono); transition: border 0.2s;
        }
        .inp-main:focus { border-color: var(--accent); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .stat-box { background: var(--bg-input); padding: 10px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .stat-box label { display: block; font-size: 0.6rem; color: var(--text-mute); font-weight: 700; margin-bottom: 4px; }
        .stat-box input { width: 100%; background: transparent; border: none; color: #fff; text-align: center; font-family: var(--font-mono); font-weight: 700; }

        .btn-primary {
            width: 100%; background: var(--accent); color: #000; padding: 16px;
            border-radius: 12px; font-weight: 800; font-family: var(--font-mono);
            border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-danger {
            width: 100%; background: rgba(231, 76, 60, 0.15); color: var(--red); padding: 16px;
            border-radius: 12px; font-weight: 700; border: none; cursor: pointer; margin-top: 8px;
        }

        /* AUTOCOMPLETE */
        #sugg-list {
            position: absolute; top: 100%; left: 0; width: 100%;
            background: #1A1A1C; border: 1px solid var(--border);
            border-radius: 0 0 12px 12px; z-index: 10; overflow: hidden;
            display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .sugg-item { 
            padding: 12px 16px; border-bottom: 1px solid #333; 
            display: flex; justify-content: space-between; cursor: pointer;
        }
        .sugg-item:active { background: #333; }
        .sugg-item span { font-family: var(--font-mono); color: var(--text-mute); font-size: 0.8rem; }

        /* CHECKBOX */
        .chk-wrap { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
        .chk-wrap input { accent-color: var(--accent); width: 18px; height: 18px; }
        .chk-wrap label { font-size: 0.85rem; color: var(--text-mute); }

        /* HELPER */
        .color-p { color: var(--blue) !important; }
        .color-f { color: var(--yellow) !important; }
        .color-c { color: var(--green) !important; }
        
        #fileInput { display: none; }
        
        /* Bank List Style */
        .bank-list-container { max-height: 60vh; overflow-y: auto; margin-top: 10px; }
        .bank-row {
            padding: 12px 0; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .bank-row b { display: block; font-size: 0.95rem; margin-bottom: 4px; }
        .bank-row span { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-mute); }
        .edit-icon { opacity: 0.5; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="app-container">
    
    <header>
        <div class="brand">
            <h1>PROTOCOL</h1>
            <span>СИСТЕМА ХАРЧУВАННЯ</span>
        </div>
        <div class="toolbar">
            <button class="icon-btn" onclick="App.undo()" id="undoBtn" style="display:none">↩</button>
            <button class="icon-btn" onclick="App.openBank()">📚</button>
            <button class="icon-btn accent" onclick="document.getElementById('fileInput').click()">📂</button>
            <button class="icon-btn" onclick="App.exportData()">💾</button>
            <input type="file" id="fileInput" accept=".json" onchange="App.importData(this)">
        </div>
    </header>

    <div class="day-bar" id="dayBar"></div>
    
    <div class="day-control-panel">
        <span class="day-name-edit" contenteditable="true" onblur="App.renameDay(this.innerText)" id="currentDayTitle">День</span>
        <button class="btn-del-day" onclick="App.deleteDay()">🗑 Видалити день</button>
    </div>

    <div class="hud">
        <div class="hud-header">
            <div class="k-group">
                <span class="k-val" id="disp-k">0</span>
                <span class="k-label">ВСЬОГО ККАЛ</span>
            </div>
            <div class="target-badge" onclick="App.openTargets()">
                ЦІЛЬ: <span id="disp-target">2700</span>
            </div>
        </div>
        
        <div class="hud-macros">
            <div class="macro-row">
                <span class="mr-label color-p">БІЛ</span>
                <div class="mr-track"><div class="mr-fill color-p" id="bar-p" style="width:0%; background:var(--blue)"></div></div>
                <span class="mr-val" id="disp-p">0g</span>
            </div>
            <div class="macro-row">
                <span class="mr-label color-f">ЖИР</span>
                <div class="mr-track"><div class="mr-fill color-f" id="bar-f" style="width:0%; background:var(--yellow)"></div></div>
                <span class="mr-val" id="disp-f">0g</span>
            </div>
            <div class="macro-row">
                <span class="mr-label color-c">ВУГ</span>
                <div class="mr-track"><div class="mr-fill color-c" id="bar-c" style="width:0%; background:var(--green)"></div></div>
                <span class="mr-val" id="disp-c">0g</span>
            </div>
        </div>
    </div>

    <div id="mealList"></div>
    <button class="btn-new-meal" onclick="App.addMealBlock()">+ НОВИЙ ПРИЙОМ ЇЖІ</button>

</div>

<div id="foodModal" class="modal-overlay">
    <div class="modal-card">
        <div class="mc-header">
            <h3 class="mc-title" id="modalTitle">ДОДАТИ</h3>
            <span onclick="App.closeModal()" style="font-size:1.5rem;cursor:pointer;color:#666">✕</span>
        </div>

        <div class="inp-group">
            <input id="inpName" class="inp-main" placeholder="Пошук в базі..." autocomplete="off" oninput="App.searchFood(this.value)">
            <div id="sugg-list"></div>
        </div>

        <input type="number" id="inpWeight" class="inp-main" placeholder="Вага (г) / Кількість (шт)" inputmode="decimal">

        <div class="stats-grid">
            <div class="stat-box"><label class="color-p">Б</label><input id="inpP" disabled></div>
            <div class="stat-box"><label class="color-f">Ж</label><input id="inpF" disabled></div>
            <div class="stat-box"><label class="color-c">В</label><input id="inpC" disabled></div>
            <div class="stat-box"><label>ККАЛ</label><input id="inpK" disabled></div>
        </div>
        
        <button class="btn-primary" onclick="App.saveFood()">ПІДТВЕРДИТИ</button>
        <button class="btn-danger" id="btnDeleteFood" style="display:none" onclick="App.deleteFood()">ВИДАЛИТИ</button>
    </div>
</div>

<div id="bankModal" class="modal-overlay">
    <div class="modal-card" style="height:85vh; max-height:85vh">
        <div class="mc-header">
            <h3 class="mc-title">БАЗА ПРОДУКТІВ</h3>
            <span onclick="document.getElementById('bankModal').style.display='none'" style="font-size:1.5rem;cursor:pointer;color:#666">✕</span>
        </div>
        <button class="btn-primary" onclick="App.openBankEdit(null)">+ СТВОРИТИ НОВИЙ</button>
        
        <input class="inp-main" style="margin-top:10px; padding:12px" placeholder="Фільтр..." oninput="App.renderBank(this.value)">
        
        <div class="bank-list-container" id="bankList"></div>
    </div>
</div>

<div id="bankEditModal" class="modal-overlay">
    <div class="modal-card">
        <div class="mc-header">
            <h3 class="mc-title">РЕДАКТОР</h3>
            <span onclick="document.getElementById('bankEditModal').style.display='none'" style="font-size:1.5rem;cursor:pointer;color:#666">✕</span>
        </div>
        
        <input id="bankInpName" class="inp-main" placeholder="Назва продукту">
        
        <div class="stats-grid">
            <div class="stat-box"><label class="color-p">Б</label><input id="bankInpP" placeholder="0" inputmode="decimal"></div>
            <div class="stat-box"><label class="color-f">Ж</label><input id="bankInpF" placeholder="0" inputmode="decimal"></div>
            <div class="stat-box"><label class="color-c">В</label><input id="bankInpC" placeholder="0" inputmode="decimal"></div>
            <div class="stat-box"><label>К</label><input id="bankInpK" placeholder="0" inputmode="decimal"></div>
        </div>

        <div class="chk-wrap">
            <input type="checkbox" id="bankInpUnit">
            <label for="bankInpUnit">Це одна порція/шт (не 100г)</label>
        </div>

        <button class="btn-primary" onclick="App.saveBankItem()">ЗБЕРЕГТИ В БАЗУ</button>
        <button class="btn-danger" id="btnDelBank" onclick="App.delFromBank()">ВИДАЛИТИ З БАЗИ</button>
    </div>
</div>

<div id="targetsModal" class="modal-overlay">
    <div class="modal-card">
        <div class="mc-header">
            <h3 class="mc-title">МОЇ ЦІЛІ</h3>
            <span onclick="document.getElementById('targetsModal').style.display='none'" style="font-size:1.5rem;cursor:pointer;color:#666">✕</span>
        </div>
        <div class="stats-grid">
            <div class="stat-box"><label class="color-p">БІЛ</label><input id="tgP" inputmode="numeric" oninput="App.calcTargetKcal()"></div>
            <div class="stat-box"><label class="color-f">ЖИР</label><input id="tgF" inputmode="numeric" oninput="App.calcTargetKcal()"></div>
            <div class="stat-box"><label class="color-c">ВУГ</label><input id="tgC" inputmode="numeric" oninput="App.calcTargetKcal()"></div>
            <div class="stat-box"><label>ККАЛ</label><input id="tgK" inputmode="numeric"></div>
        </div>
        <button class="btn-primary" onclick="App.saveTargets()">ОНОВИТИ</button>
    </div>
</div>

<script src="common.js"></script>

<script>
    // --- PROTOCOL CORE ---
    const DB_KEY = 'protocol_sys_plus_days';

    const DefaultBank = {
        "Вівсянка": {p:13, f:6, c:68, k:380},
        "Рис": {p:2.7, f:0.3, c:28, k:130},
        "Гречка": {p:4, f:1, c:21, k:110},
        "Макарони": {p:5, f:1, c:30, k:150},
        "Картопля": {p:2, f:0, c:17, k:77},
        "Куряче філе": {p:23, f:1, c:0, k:110},
        "Яловичина": {p:20, f:10, c:0, k:180},
        "Яйце (1шт)": {p:6, f:5, c:0.5, k:70, unit:true},
        "Білок яєчний": {p:3, f:0, c:0, k:15, unit:true},
        "Сир кисломолочний": {p:18, f:5, c:2, k:120},
        "Олія оливкова": {p:0, f:100, c:0, k:884},
        "Горіхи": {p:15, f:60, c:10, k:650},
        "Авокадо": {p:2, f:15, c:9, k:160},
        "Банан": {p:1, f:0, c:21, k:90},
        "Протеїн (1 порція)": {p:24, f:1, c:2, k:110, unit:true}
    };

    const App = {
        // New structure: "meals" are now inside "days"
        data: { 
            bank: DefaultBank, 
            targets: {p:200, f:80, c:300, k:2700}, 
            days: [] // Array of {id, name, meals:[]}
        },
        state: { mid: null, fidx: null, editName: null, currentDayId: null },
        history: [],

        init() {
            const s = localStorage.getItem(DB_KEY);
            if(s) {
                const parsed = JSON.parse(s);
                // Migration logic for older versions if needed
                if(!parsed.days) {
                    this.data.bank = parsed.bank || DefaultBank;
                    this.data.targets = parsed.targets;
                    // Move old "meals" to a new Day
                    this.data.days = [{id: Date.now(), name: "Мій день", meals: parsed.meals || []}];
                } else {
                    this.data = parsed;
                }
                this.data.bank = {...DefaultBank, ...this.data.bank};
            } else {
                this.addDay("Мій день", true); // Init first day
            }
            
            // Set current day to first if not set
            if(!this.state.currentDayId && this.data.days.length > 0) {
                this.state.currentDayId = this.data.days[0].id;
            }
            
            this.render();
        },

        save() {
            localStorage.setItem(DB_KEY, JSON.stringify(this.data));
            this.updateStats();
        },
        
        pushHistory() {
            if(this.history.length > 10) this.history.shift();
            this.history.push(JSON.stringify(this.data));
            document.getElementById('undoBtn').style.display='flex';
        },
        
        undo() {
            if(!this.history.length) return;
            this.data = JSON.parse(this.history.pop());
            if(!this.history.length) document.getElementById('undoBtn').style.display='none';
            // Ensure ID is valid
            if(!this.data.days.find(d => d.id === this.state.currentDayId)) {
                this.state.currentDayId = this.data.days[0].id;
            }
            this.save(); this.render();
        },

        // --- DAY MANAGER LOGIC ---
        getCurrentDay() {
            return this.data.days.find(d => d.id === this.state.currentDayId);
        },

        addDay(name = null, silent=false) {
           if(!silent) this.pushHistory();
    
            // Якщо ім'я не задали — ставимо поточну дату (напр. 14.05)
            if(!name) {
            const now = new Date();
            name = now.toLocaleDateString('uk-UA', {day:'numeric', month:'numeric'});
            }

            const id = Date.now();
            const newDay = {
                id: id, 
                name: name, 
                meals: [
                    {id: id+1, name:"Сніданок", foods:[]},
                    {id: id+2, name:"Обід", foods:[]},
                    {id: id+3, name:"Вечеря", foods:[]}
                ]
            };
            this.data.days.push(newDay);
            this.state.currentDayId = id;
            if(!silent) { this.save(); this.render(); }
        },

        switchDay(id) {
            this.state.currentDayId = id;
            this.render();
        },

        renameDay(newName) {
            const d = this.getCurrentDay();
            if(d) {
                d.name = newName;
                this.save();
                this.renderDaysBar(); // Update tab name
            }
        },

        deleteDay() {
            if(this.data.days.length <= 1) {
                alert("Не можна видалити останній день.");
                return;
            }
            if(!confirm("Видалити цей день зі всіма записами?")) return;
            
            this.pushHistory();
            this.data.days = this.data.days.filter(d => d.id !== this.state.currentDayId);
            this.state.currentDayId = this.data.days[0].id;
            this.save();
            this.render();
        },

        // --- RENDER ENGINE ---
        render() {
            this.renderDaysBar();
            const day = this.getCurrentDay();
            if(!day) return;

            document.getElementById('currentDayTitle').innerText = day.name;

            const list = document.getElementById('mealList');
            list.innerHTML = '';
            
            day.meals.forEach(m => {
                let mCal = 0, mP = 0, mF = 0, mC = 0;

                const foodsHtml = m.foods.map((f, i) => {
                    const ref = this.data.bank[f.n] || f; 
                    const r = ref.unit ? f.w : f.w/100;
                    
                    const k = Math.round((ref.k || 0) * r);
                    const p = Math.round((ref.p || 0) * r);
                    const fat = Math.round((ref.f || 0) * r);
                    const c = Math.round((ref.c || 0) * r);
                    
                    mCal += k; mP += p; mF += fat; mC += c;

                    return `
                    <div class="food-row" onclick="App.editFood(${m.id}, ${i})">
                        <div class="fr-info">
                            <h4>${f.n}</h4>
                            <p>Б${p} Ж${fat} В${c}</p>
                        </div>
                        <div class="fr-vals">
                            <div class="fr-w">${f.w}${ref.unit?'':'г'}</div>
                            <div class="fr-k">${k}</div>
                        </div>
                    </div>`;
                }).join('');

                list.innerHTML += `
                <div class="meal-block">
                    <div class="meal-header">
                        <div>
                            <div class="mh-title" contenteditable="true" onblur="App.renameMeal(${m.id}, this.innerText)">${m.name}</div>
                            <div class="mh-meta">
                                <div class="mh-kcal">${mCal} ккал</div>
                                <div class="mh-macros">
                                    <span class="color-p">Б <b>${mP}</b></span>
                                    <span class="color-f">Ж <b>${mF}</b></span>
                                    <span class="color-c">В <b>${mC}</b></span>
                                </div>
                            </div>
                        </div>
                        <div class="mh-del" onclick="App.deleteMealBlock(${m.id})">✕</div>
                    </div>
                    <div>${foodsHtml}</div>
                    <button class="btn-add-food" onclick="App.addFood(${m.id})">+ ПРОДУКТ</button>
                </div>`;
            });
            this.updateStats();
        },

        renderDaysBar() {
            const bar = document.getElementById('dayBar');
            bar.innerHTML = '';
            this.data.days.forEach(d => {
                const el = document.createElement('div');
                el.className = `day-tab ${d.id === this.state.currentDayId ? 'active' : ''}`;
                el.innerText = d.name;
                el.onclick = () => App.switchDay(d.id);
                bar.appendChild(el);
            });
            
            // Add button
            const addBtn = document.createElement('button');
            addBtn.className = 'day-add-btn';
            addBtn.innerText = '+';
            addBtn.onclick = () => App.addDay();
            bar.appendChild(addBtn);
        },

        updateStats() {
            const day = this.getCurrentDay();
            if(!day) return;

            let t = {p:0, f:0, c:0, k:0};
            day.meals.forEach(m => m.foods.forEach(f => {
                const ref = this.data.bank[f.n] || f;
                const r = ref.unit ? f.w : f.w/100;
                t.p += (ref.p||0)*r; 
                t.f += (ref.f||0)*r; 
                t.c += (ref.c||0)*r; 
                t.k += (ref.k||0)*r;
            }));
            
            const tg = this.data.targets;
            document.getElementById('disp-k').innerText = Math.round(t.k);
            document.getElementById('disp-target').innerText = tg.k;
            
            const updateBar = (id, val, max) => {
                const el = document.getElementById('bar-'+id);
                const txt = document.getElementById('disp-'+id);
                const pct = Math.min(100, (val/max)*100);
                
                el.style.width = pct + '%';
                txt.innerText = Math.round(val) + 'г / ' + Math.round(pct) + '%';
                
                if(pct > 90) el.style.boxShadow = "0 0 15px currentColor";
                else el.style.boxShadow = "none";
            };
            
            updateBar('p', t.p, tg.p);
            updateBar('f', t.f, tg.f);
            updateBar('c', t.c, tg.c);

            // ДОДАНО: Зміна кольору головної цифри
            const dispK = document.getElementById('disp-k');
            if (t.k > tg.k) {
                dispK.style.color = 'var(--red)'; // Червоний, якщо переїв
            } else {
                dispK.style.color = 'var(--text-main)'; // Білий, якщо норма
            }
        },

        // --- FOOD ACTIONS ---
        searchFood(q) {
            const list = document.getElementById('sugg-list');
            list.innerHTML = '';
            if(q.length < 1) { list.style.display='none'; return; }
            
            const matches = Object.keys(this.data.bank).filter(k => k.toLowerCase().includes(q.toLowerCase()));
            if(matches.length) {
                list.style.display = 'block';
                matches.slice(0, 5).forEach(n => {
                    const b = this.data.bank[n];
                    const el = document.createElement('div');
                    el.className = 'sugg-item';
                    el.innerHTML = `${n} <span>${b.k} ккал</span>`;
                    el.onclick = () => App.selectSuggestion(n);
                    list.appendChild(el);
                });
            } else { list.style.display='none'; }
        },

        selectSuggestion(name) {
            const f = this.data.bank[name];
            document.getElementById('inpName').value = name;
            document.getElementById('inpP').value = f.p;
            document.getElementById('inpF').value = f.f;
            document.getElementById('inpC').value = f.c;
            document.getElementById('inpK').value = f.k;
            document.getElementById('sugg-list').style.display='none';
            const inpW = document.getElementById('inpWeight');
            if (f.unit) {
                inpW.placeholder = "Кількість (шт)";
            } else {
                inpW.placeholder = "Вага (г)";
            }
            document.getElementById('inpWeight').focus();
        },

        addFood(mid) {
            this.state.mid = mid; this.state.fidx = -1;
            this.openModal('ДОДАТИ', {}, false);
            setTimeout(() => document.getElementById('inpName').focus(), 100);
        },
        
        editFood(mid, idx) {
            this.state.mid = mid; this.state.fidx = idx;
            const f = this.getCurrentDay().meals.find(m=>m.id===mid).foods[idx];
            let base = this.data.bank[f.n] || f; 
            this.openModal('РЕДАГУВАТИ', {...base, w: f.w, n: f.n}, true);
        },

        openModal(title, f, del) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('inpName').value = f.n||'';
            document.getElementById('inpWeight').value = f.w||'';
            
            const ref = this.data.bank[f.n] || f;
            document.getElementById('inpP').value = ref.p||0;
            document.getElementById('inpF').value = ref.f||0;
            document.getElementById('inpC').value = ref.c||0;
            document.getElementById('inpK').value = ref.k||0;
            
            // --- FIX: Use ref.unit (from bank), not f.unit (from record)
            const inpW = document.getElementById('inpWeight');
            if (ref.unit) {
                inpW.placeholder = "Кількість (шт)";
            } else {
                inpW.placeholder = "Вага (г)";
            }

            document.getElementById('btnDeleteFood').style.display = del ? 'block':'none';
            document.getElementById('foodModal').style.display = 'flex';
            document.getElementById('sugg-list').style.display = 'none';
        },
        
        closeModal() { 
            document.querySelectorAll('.modal-overlay').forEach(el => el.style.display='none');
        },

        saveFood() {
            let n = document.getElementById('inpName').value.trim(); // Прибираємо зайві пробіли
            const w = parseFloat(document.getElementById('inpWeight').value);
            if(!n || isNaN(w)) return;
            
            // 1. Шукаємо, чи є такий продукт (ігноруючи регістр)
            // Наприклад, якщо в базі "Рис", а ввели "рис" -> знайдемо "Рис"
            const existingKey = Object.keys(this.data.bank).find(k => k.toLowerCase() === n.toLowerCase());
            
            if (existingKey) {
                n = existingKey; // Використовуємо правильну назву з бази
            } else {
                // Якщо не знайшли - пропонуємо створити
                if(!this.data.bank[n]) {
                    if(confirm(`"${n}" немає в базі. Створити?`)) {
                        this.data.bank[n] = {p:0,f:0,c:0,k:0,unit:false};
                    } else return;
                }
            }

            const meal = this.getCurrentDay().meals.find(m=>m.id===this.state.mid);
            const item = {n, w};
            
            this.pushHistory();
            if(this.state.fidx === -1) meal.foods.push(item);
            else meal.foods[this.state.fidx] = item;
            
            this.save(); this.render(); this.closeModal();
        },

        deleteFood() {
            this.pushHistory();
            this.getCurrentDay().meals.find(m=>m.id===this.state.mid).foods.splice(this.state.fidx, 1);
            this.save(); this.render(); this.closeModal();
        },

        // --- MEAL OPS ---
        addMealBlock() {
            this.pushHistory();
            const id = Date.now();
            this.getCurrentDay().meals.push({id, name:"Прийом їжі", foods:[]});
            this.save(); this.render();
        },
        deleteMealBlock(id) {
            if(!confirm("Видалити цей блок?")) return;
            this.pushHistory();
            const day = this.getCurrentDay();
            day.meals = day.meals.filter(m=>m.id!==id);
            this.save(); this.render();
        },
        renameMeal(id, val) {
            this.getCurrentDay().meals.find(m=>m.id===id).name = val;
            this.save();
        },

        // --- DATABASE ---
        renderBank(filter = "") {
            const l = document.getElementById('bankList');
            l.innerHTML = Object.entries(this.data.bank)
                .filter(([n]) => n.toLowerCase().includes(filter.toLowerCase()))
                .sort()
                .map(([n,v]) => `
                <div class="bank-row" onclick="App.openBankEdit('${n}')">
                    <div class="bank-info">
                        <b>${n}</b>
                        <span>${v.unit ? 'ШТ/ПОРЦ' : '100г'} | Б${v.p} Ж${v.f} В${v.c} | ${v.k} ккал</span>
                    </div>
                    <div class="edit-icon">✎</div>
                </div>`).join('');
        },
        openBank() {
            this.renderBank();
            document.getElementById('bankModal').style.display='flex';
        },
        openBankEdit(name) {
            this.state.editName = name;
            if(name) {
                const d = this.data.bank[name];
                document.getElementById('bankInpName').value = name;
                document.getElementById('bankInpP').value = d.p;
                document.getElementById('bankInpF').value = d.f;
                document.getElementById('bankInpC').value = d.c;
                document.getElementById('bankInpK').value = d.k;
                document.getElementById('bankInpUnit').checked = d.unit || false;
                document.getElementById('btnDelBank').style.display = 'block';
            } else {
                document.getElementById('bankInpName').value = '';
                document.getElementById('bankInpP').value = '';
                document.getElementById('bankInpF').value = '';
                document.getElementById('bankInpC').value = '';
                document.getElementById('bankInpK').value = '';
                document.getElementById('bankInpUnit').checked = false;
                document.getElementById('btnDelBank').style.display = 'none';
            }
            document.getElementById('bankEditModal').style.display='flex';
        },
        saveBankItem() {
            const n = document.getElementById('bankInpName').value;
            const p = parseFloat(document.getElementById('bankInpP').value)||0;
            const f = parseFloat(document.getElementById('bankInpF').value)||0;
            const c = parseFloat(document.getElementById('bankInpC').value)||0;
            let k = parseFloat(document.getElementById('bankInpK').value);
            if(!k) k = Math.round(p*4 + f*9 + c*4);
            
            const unit = document.getElementById('bankInpUnit').checked;

            if(this.state.editName && this.state.editName !== n) {
                delete this.data.bank[this.state.editName];
            }
            
            this.data.bank[n] = {p,f,c,k,unit};
            this.save(); this.renderBank();
            document.getElementById('bankEditModal').style.display='none';
            this.render(); 
        },
        delFromBank() {
            if(confirm('Видалити з бази назавжди?')) {
                delete this.data.bank[this.state.editName];
                this.save(); this.renderBank();
                document.getElementById('bankEditModal').style.display='none';
            }
        },

        // --- TARGETS ---
        openTargets() {
            const t = this.data.targets;
            document.getElementById('tgP').value = t.p;
            document.getElementById('tgF').value = t.f;
            document.getElementById('tgC').value = t.c;
            document.getElementById('tgK').value = t.k;
            document.getElementById('targetsModal').style.display='flex';
        },

        calcTargetKcal() {
            const p = parseFloat(document.getElementById('tgP').value)||0;
            const f = parseFloat(document.getElementById('tgF').value)||0;
            const c = parseFloat(document.getElementById('tgC').value)||0;
            // Формула: Б*4 + Ж*9 + В*4
            document.getElementById('tgK').value = Math.round(p*4 + f*9 + c*4);
        },
        
        saveTargets() {
            this.data.targets = {
                p: parseFloat(document.getElementById('tgP').value)||0,
                f: parseFloat(document.getElementById('tgF').value)||0,
                c: parseFloat(document.getElementById('tgC').value)||0,
                k: parseFloat(document.getElementById('tgK').value)||0
            };
            this.save(); this.updateStats();
            document.getElementById('targetsModal').style.display='none';
        },

        exportData() {
            const a = document.createElement('a');
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.data));
            a.download = "protocol_nutrition.json"; a.click();
        },
        importData(inp) {
            const r = new FileReader();
            r.onload = e => { this.data = JSON.parse(e.target.result); this.save(); location.reload(); };
            r.readAsText(inp.files[0]);
        }
    };

    window.onload = () => App.init();
</script>
</body>
